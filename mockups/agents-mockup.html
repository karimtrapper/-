<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мультиагенты — прототип</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy-900:#0F172A;--navy-800:#1E293B;--navy-700:#334155;--navy-500:#64748B;
  --navy-400:#94A3B8;--navy-300:#CBD5E1;--navy-200:#E2E8F0;--navy-100:#F1F5F9;--navy-50:#F8FAFC;
  --coral:#F97316;--coral-hover:#EA580C;--green:#22C55E;--green-dark:#16A34A;
  --blue:#3B82F6;--indigo:#6366F1;--amber:#F59E0B;
  --r:12px;--r-sm:8px;--r-lg:16px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--navy-50);color:var(--navy-900);padding:20px 14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
.wrap{max-width:560px;margin:0 auto;}
h1{font-size:20px;font-weight:800;text-align:center;margin-bottom:4px;}
.sub{text-align:center;color:var(--navy-500);font-size:13px;margin-bottom:18px;}

/* tabs */
.tabs{display:flex;gap:6px;background:var(--navy-100);padding:5px;border-radius:var(--r);margin-bottom:16px;}
.tab{flex:1;padding:10px;border:none;background:transparent;border-radius:var(--r-sm);font-family:inherit;font-size:13px;font-weight:600;color:var(--navy-500);cursor:pointer;transition:.2s;}
.tab.active{background:white;color:var(--navy-900);box-shadow:0 1px 2px rgba(0,0,0,.08);}

.card{background:white;border:1px solid var(--navy-100);border-radius:var(--r-lg);padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.05);}
.card-title{font-size:13px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:6px;}

/* profit inputs */
.field{margin-bottom:10px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--navy-500);margin-bottom:5px;}
.field input,.field select{width:100%;padding:10px 12px;border:2px solid var(--navy-200);border-radius:var(--r-sm);font-family:inherit;font-size:15px;font-weight:600;color:var(--navy-900);background:white;outline:none;}
.field input:focus{border-color:var(--coral);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* presets */
.presets{display:flex;gap:8px;margin-bottom:14px;}
.preset{flex:1;padding:9px;border:2px solid var(--navy-200);border-radius:var(--r-sm);background:white;font-family:inherit;font-size:13px;font-weight:600;color:var(--navy-500);cursor:pointer;transition:.2s;}
.preset.active{background:var(--navy-800);color:white;border-color:var(--navy-800);}
.preset small{display:block;font-weight:500;font-size:10px;opacity:.7;margin-top:2px;}

/* agent rows */
.agent{border:1px solid var(--navy-200);border-radius:var(--r);padding:12px;margin-bottom:10px;background:var(--navy-50);}
.agent-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.tier-badge{display:flex;align-items:center;gap:4px;background:var(--indigo);color:white;border-radius:999px;padding:3px 4px 3px 10px;font-size:12px;font-weight:700;flex-shrink:0;}
.tier-badge button{width:20px;height:20px;border:none;border-radius:50%;background:rgba(255,255,255,.25);color:white;font-size:13px;font-weight:700;cursor:pointer;line-height:1;}
.agent-name{flex:1;padding:7px 10px;border:2px solid var(--navy-200);border-radius:var(--r-sm);font-family:inherit;font-size:14px;font-weight:600;outline:none;}
.del{width:30px;height:30px;border:none;background:transparent;color:var(--navy-400);font-size:18px;cursor:pointer;flex-shrink:0;}
.del:hover{color:#EF4444;}
.agent-cfg{display:grid;grid-template-columns:1.4fr .8fr auto;gap:8px;align-items:center;}
.agent-cfg select,.agent-cfg input{padding:8px 10px;border:2px solid var(--navy-200);border-radius:var(--r-sm);font-family:inherit;font-size:13px;font-weight:600;outline:none;background:white;}
.pay{font-size:15px;font-weight:800;color:var(--green-dark);text-align:right;min-width:90px;}
.add-btn{width:100%;padding:11px;border:2px dashed var(--navy-300);border-radius:var(--r-sm);background:white;color:var(--navy-500);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.2s;}
.add-btn:hover{border-color:var(--coral);color:var(--coral);}

/* waterfall */
.wf{background:var(--navy-900);border-radius:var(--r);padding:18px;color:white;}
.wf-row{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;font-size:14px;}
.wf-row.base{font-weight:700;font-size:15px;border-top:1px dashed rgba(255,255,255,.15);margin-top:2px;padding-top:10px;}
.wf-row.base:first-child{border-top:none;margin-top:0;}
.wf-cut{padding-left:16px;color:#FCA5A5;font-size:13px;}
.wf-cut .lvl{display:inline-block;background:rgba(99,102,241,.35);color:#C7D2FE;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:700;margin-right:6px;}
.wf-net{background:rgba(34,197,94,.18);margin:10px -8px 0;padding:12px 8px;border-radius:8px;display:flex;justify-content:space-between;font-weight:800;font-size:17px;color:#86EFAC;}
.wf-sum{display:flex;gap:10px;margin-top:12px;}
.wf-sum div{flex:1;background:rgba(255,255,255,.06);border-radius:8px;padding:10px;text-align:center;}
.wf-sum .lbl{font-size:11px;opacity:.7;}
.wf-sum .val{font-size:16px;font-weight:800;margin-top:2px;}

/* kabinet */
.viewer{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.viewer .vbtn{padding:8px 12px;border:2px solid var(--navy-200);border-radius:999px;background:white;font-family:inherit;font-size:12px;font-weight:600;color:var(--navy-500);cursor:pointer;}
.viewer .vbtn.active{background:var(--coral);color:white;border-color:var(--coral);}
.kab-head{background:linear-gradient(135deg,#1E293B,#0F172A);border-radius:var(--r-lg);padding:20px;color:white;text-align:center;margin-bottom:14px;}
.kab-head .who{font-size:13px;opacity:.7;}
.kab-head .amt{font-size:30px;font-weight:800;margin:4px 0;}
.kab-head .amt small{font-size:16px;opacity:.6;font-weight:600;}
.kab-head .note{font-size:12px;opacity:.75;}
.deal-card{border:1px solid var(--navy-100);border-radius:var(--r);padding:14px;margin-bottom:10px;background:white;box-shadow:0 1px 2px rgba(0,0,0,.04);}
.deal-row{display:flex;justify-content:space-between;align-items:flex-start;}
.deal-left{display:flex;gap:10px;align-items:center;}
.deal-av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:14px;}
.deal-name{font-weight:700;font-size:15px;}
.deal-date{font-size:12px;color:var(--navy-400);}
.deal-amt{font-weight:800;font-size:16px;text-align:right;}
.deal-income{font-weight:700;color:var(--green-dark);text-align:right;font-size:15px;}
.deal-meta{font-size:11px;color:var(--navy-400);margin-top:6px;}
.deal-meta .lvl{background:var(--navy-100);color:var(--navy-600);border-radius:4px;padding:1px 6px;font-weight:700;}
.status{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:12px;font-weight:600;background:#FFF7ED;color:var(--coral);padding:3px 10px;border-radius:999px;}
.status .dot{width:6px;height:6px;border-radius:50%;background:var(--coral);}
.privacy{font-size:11px;color:var(--navy-400);text-align:center;margin-top:10px;font-style:italic;}
.hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Мультиагенты в сделке</h1>
  <div class="sub">Прототип · уровни (каскад) и «в долю» · кабинет каждого агента</div>

  <div class="tabs">
    <button class="tab active" data-tab="form" onclick="setTab('form')">📝 Форма сделки</button>
    <button class="tab" data-tab="kab" onclick="setTab('kab')">👤 Кабинет агента</button>
  </div>

  <!-- ======= TAB: FORM ======= -->
  <div id="tab-form">
    <div class="card">
      <div class="card-title">💰 Финансы сделки</div>
      <div class="row2">
        <div class="field"><label>Объём (USDT)</label><input id="volume" type="text" value="58409" oninput="recalc()"></div>
        <div class="field"><label>Прибыль / маржа $ (P)</label><input id="profit" type="text" value="2793.15" oninput="recalc()"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">👥 Агенты</div>
      <div class="presets">
        <button class="preset" id="pre-cascade" onclick="applyPreset('cascade')">⬇️ Каскадом<small>уровни 1 → 2 → 3</small></button>
        <button class="preset" id="pre-flat" onclick="applyPreset('flat')">🟰 В долю<small>все на 1 уровне</small></button>
      </div>
      <div id="agents"></div>
      <button class="add-btn" onclick="addAgent()">＋ Добавить агента</button>
    </div>

    <div class="card" style="padding:0;border:none;background:transparent;box-shadow:none;">
      <div class="wf" id="waterfall"></div>
    </div>
  </div>

  <!-- ======= TAB: KABINET ======= -->
  <div id="tab-kab" class="hidden">
    <div class="card">
      <div class="card-title">Смотреть кабинет как:</div>
      <div class="viewer" id="viewer"></div>
    </div>
    <div class="kab-head" id="kabHead"></div>
    <div id="kabDeals"></div>
    <div class="privacy">Агент видит только свою долю. Чужие выплаты и общая прибыль скрыты.</div>
  </div>
</div>

<script>
// ===== Состояние =====
let agents = [
  { name:'Агент 1 (Иван)', tier:1, model:'revshare', percent:20 },
  { name:'Николай',        tier:2, model:'revshare', percent:50 },
];
let preset = 'cascade';
let viewerIdx = 0;

const AV_COLORS = ['#22C55E','#3B82F6','#F59E0B','#8B5CF6','#EC4899'];
const num = n => (Math.round(n*100)/100).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});
const f = id => parseFloat((document.getElementById(id).value||'0').replace(/\s/g,''))||0;

// ===== Расчёт каскада =====
function calc(){
  const profit = f('profit'), volume = f('volume');
  const sorted = agents.map((a,i)=>({...a,_i:i})).sort((a,b)=>a.tier-b.tier);
  const tiers = {};
  sorted.forEach(a=>{(tiers[a.tier]=tiers[a.tier]||[]).push(a);});
  let base = profit;
  const steps = [];
  Object.keys(tiers).map(Number).sort((x,y)=>x-y).forEach(t=>{
    const group = tiers[t]; let total=0;
    group.forEach(a=>{
      let pay;
      if(a.model==='revshare') pay = base*(a.percent/100);
      else if(a.model==='markup') pay = volume*(a.percent/100);
      else pay = a.percent; // fixed: трактуем поле как сумму $
      a._pay = pay; a._base = base;
      agents[a._i]._pay = pay; agents[a._i]._base = base;
      total += pay;
    });
    steps.push({tier:t, group, baseBefore:base, total});
    base -= total;
  });
  return { profit, volume, steps, net:base, toAgents: profit-base };
}

// ===== Рендер формы =====
function renderAgents(){
  const box = document.getElementById('agents');
  box.innerHTML = agents.map((a,i)=>`
    <div class="agent">
      <div class="agent-head">
        <div class="tier-badge">
          <button onclick="bumpTier(${i},-1)">−</button>
          Ур.${a.tier}
          <button onclick="bumpTier(${i},1)">+</button>
        </div>
        <input class="agent-name" value="${a.name.replace(/"/g,'&quot;')}" oninput="setField(${i},'name',this.value)">
        <button class="del" onclick="removeAgent(${i})" title="Удалить">🗑</button>
      </div>
      <div class="agent-cfg">
        <select onchange="setField(${i},'model',this.value)">
          <option value="revshare" ${a.model==='revshare'?'selected':''}>revshare (% от прибыли)</option>
          <option value="markup" ${a.model==='markup'?'selected':''}>markup (+% к курсу)</option>
          <option value="fixed" ${a.model==='fixed'?'selected':''}>fixed ($ сумма)</option>
        </select>
        <input type="text" value="${a.percent}" oninput="setField(${i},'percent',this.value)" placeholder="${a.model==='fixed'?'$':'%'}">
        <div class="pay" id="pay-${i}">$0</div>
      </div>
    </div>`).join('');
}

function renderWaterfall(){
  const r = calc();
  let html = `<div class="wf-row base"><span>Прибыль сделки</span><b>$${num(r.profit)}</b></div>`;
  r.steps.forEach(s=>{
    s.group.forEach(a=>{
      const basis = a.model==='revshare' ? `${a.percent}% × $${num(a._base)}`
                  : a.model==='markup'   ? `+${a.percent}% к курсу`
                  : `фикс`;
      html += `<div class="wf-row wf-cut"><span><span class="lvl">Ур.${a.tier}</span>${a.name} · ${basis}</span><span>−$${num(a._pay)}</span></div>`;
    });
    html += `<div class="wf-row base"><span>Остаток после ур.${s.tier}</span><b>$${num(r.profit - cumThrough(r, s.tier))}</b></div>`;
  });
  html += `<div class="wf-net"><span>Нам (net)</span><span>$${num(r.net)}</span></div>`;
  html += `<div class="wf-sum">
      <div><div class="lbl">Агентам всего</div><div class="val" style="color:#FCA5A5">$${num(r.toAgents)}</div></div>
      <div><div class="lbl">Нам</div><div class="val" style="color:#86EFAC">$${num(r.net)}</div></div>
    </div>`;
  document.getElementById('waterfall').innerHTML = html;
  // payouts in rows
  agents.forEach((a,i)=>{ const el=document.getElementById('pay-'+i); if(el) el.textContent = '$'+num(a._pay||0); });
}
// сумма выплат по всем уровням ≤ t
function cumThrough(r, t){ let s=0; r.steps.filter(x=>x.tier<=t).forEach(x=>s+=x.total); return s; }

function recalc(){ renderWaterfall(); }

// ===== Действия формы =====
function setField(i,k,v){
  if(k==='percent') v = parseFloat(v.replace(',','.'))||0;
  agents[i][k]=v;
  if(k==='model') renderAgents();
  renderWaterfall(); renderViewer();
}
function bumpTier(i,d){ agents[i].tier=Math.max(1,(agents[i].tier||1)+d); preset=null; syncPresetUI(); renderAgents(); renderWaterfall(); }
function addAgent(){
  const nextTier = preset==='flat' ? 1 : (Math.max(0,...agents.map(a=>a.tier))+1);
  agents.push({name:'Агент '+(agents.length+1), tier:nextTier, model:'revshare', percent:10});
  renderAgents(); renderWaterfall(); renderViewer();
}
function removeAgent(i){ agents.splice(i,1); renderAgents(); renderWaterfall(); renderViewer(); if(viewerIdx>=agents.length)viewerIdx=0; }
function applyPreset(p){
  preset=p;
  if(p==='cascade') agents.forEach((a,i)=>a.tier=i+1);
  else agents.forEach(a=>a.tier=1);
  syncPresetUI(); renderAgents(); renderWaterfall();
}
function syncPresetUI(){
  document.getElementById('pre-cascade').classList.toggle('active',preset==='cascade');
  document.getElementById('pre-flat').classList.toggle('active',preset==='flat');
}

// ===== Кабинет =====
function renderViewer(){
  const v=document.getElementById('viewer');
  v.innerHTML = agents.map((a,i)=>`<button class="vbtn ${i===viewerIdx?'active':''}" onclick="setViewer(${i})">${a.name}</button>`).join('');
  renderKabinet();
}
function setViewer(i){ viewerIdx=i; renderViewer(); }
function renderKabinet(){
  calc();
  const a = agents[viewerIdx]; if(!a){document.getElementById('kabHead').innerHTML='';document.getElementById('kabDeals').innerHTML='';return;}
  // Агент НЕ видит уровни и остатки — только своё вознаграждение
  const share = a.model==='revshare' ? `${a.percent}% от прибыли`
              : a.model==='markup'   ? `+${a.percent}% к курсу`
              : `фиксированная выплата`;
  document.getElementById('kabHead').innerHTML =
    `<div class="who">${a.name} · доступно к выводу</div>
     <div class="amt">$${num(a._pay||0)}</div>
     <div class="note">${share}</div>`;

  const basis = share;
  const av = AV_COLORS[viewerIdx%AV_COLORS.length];
  document.getElementById('kabDeals').innerHTML = `
    <div class="deal-card">
      <div class="deal-row">
        <div class="deal-left">
          <div class="deal-av" style="background:${av}">MS</div>
          <div><div class="deal-name">mak***</div><div class="deal-date">09.06.2026</div></div>
        </div>
        <div>
          <div class="deal-amt">$55 130</div>
          <div class="deal-income">+$${num(a._pay||0)}</div>
        </div>
      </div>
      <div class="deal-meta">ваша доля: ${basis}</div>
      <div class="status"><span class="dot"></span>К выплате</div>
    </div>`;
}

// ===== Tabs =====
function setTab(t){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  document.getElementById('tab-form').classList.toggle('hidden',t!=='form');
  document.getElementById('tab-kab').classList.toggle('hidden',t!=='kab');
  if(t==='kab') renderViewer();
}

// init
syncPresetUI(); renderAgents(); renderWaterfall(); renderViewer();
</script>
</body>
</html>
