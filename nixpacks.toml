# Nixpacks конфигурация для Railway
# Устанавливает системные зависимости для Playwright Chromium

[phases.setup]
# Системные библиотеки необходимые для Chromium
aptPkgs = [
    "libglib2.0-0",
    "libnss3",
    "libnspr4",
    "libatk1.0-0",
    "libatk-bridge2.0-0",
    "libcups2",
    "libdrm2",
    "libdbus-1-3",
    "libxkbcommon0",
    "libatspi2.0-0",
    "libxcomposite1",
    "libxdamage1",
    "libxfixes3",
    "libxrandr2",
    "libgbm1",
    "libpango-1.0-0",
    "libcairo2",
    "libasound2",
    "libxshmfence1",
    "libx11-6",
    "libx11-xcb1",
    "libxcb1",
    "libxext6",
    "fonts-liberation"
]

[phases.install]
# Устанавливаем Python зависимости
cmds = ["pip install -r requirements.txt"]

[phases.build]
# Устанавливаем Playwright Chromium после установки pip пакетов
cmds = ["playwright install chromium"]

[start]
# Запускаем приложение через gunicorn
cmd = "gunicorn app:app"
