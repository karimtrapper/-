<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grusha Exchange — Calculator</title>
    <link rel="icon" type="image/png" href="/static/kyc/grusha-logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* === Navy theme — same tokens as main calculator === */
        :root {
            --navy-900: #0F172A;
            --navy-800: #1E293B;
            --navy-700: #334155;
            --navy-500: #64748B;
            --navy-400: #94A3B8;
            --navy-300: #CBD5E1;
            --navy-200: #E2E8F0;
            --navy-100: #F1F5F9;
            --navy-50: #F8FAFC;
            --coral: #F97316;
            --coral-hover: #EA580C;
            --r: 12px; --r-sm: 8px; --r-lg: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--navy-50); color: var(--navy-900);
            min-height: 100vh; line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            padding: 24px 16px;
        }
        .container { width: 100%; max-width: 440px; margin: 0 auto; }

        /* === Header === */
        .header { text-align: center; margin-bottom: 16px; }
        .header .logo { width: 56px; height: 56px; margin: 0 auto 10px; }
        .header .logo img { width: 100%; height: 100%; border-radius: 12px; }
        .header h1 { font-size: 20px; font-weight: 800; color: var(--navy-800); letter-spacing: -0.3px; }
        .header .partner-name { font-size: 13px; color: var(--navy-500); margin-top: 4px; font-weight: 500; }

        /* === Card === */
        .calculator-card {
            background: white; border: 1px solid var(--navy-100);
            border-radius: var(--r-lg); padding: 16px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        /* === Direction switcher === */
        .direction-switcher {
            background: var(--navy-50); padding: 12px;
            border-radius: var(--r); margin-bottom: 16px;
        }
        .direction-header { font-size: 13px; font-weight: 700; color: var(--navy-900); margin-bottom: 8px; }
        .direction-buttons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .direction-btn {
            padding: 10px 12px; background: white; border: 2px solid var(--navy-200);
            border-radius: var(--r-sm); font-size: 13px; font-weight: 600;
            color: var(--navy-500); cursor: pointer; transition: all 0.2s;
            font-family: inherit; text-align: center;
        }
        .direction-btn:hover { border-color: var(--navy-800); }
        .direction-btn.active { background: var(--navy-800); color: white; border-color: var(--navy-800); }

        /* === Input === */
        .input-label { display: block; font-size: 13px; font-weight: 600; color: var(--navy-900); margin-bottom: 8px; }
        .input-wrapper { position: relative; margin-bottom: 12px; }
        .amount-input {
            width: 100%; padding: 14px 48px 14px 14px;
            font-size: 20px; font-weight: 700;
            border: 2px solid var(--navy-200); border-radius: var(--r);
            outline: none; transition: all 0.2s; font-family: inherit;
            color: var(--navy-900); background: white; min-height: 48px;
        }
        .amount-input:focus { border-color: var(--coral); box-shadow: 0 0 0 3px rgba(249,115,22,0.12); }
        .amount-input::placeholder { color: var(--navy-300); font-weight: 400; }
        .input-currency {
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
            font-size: 20px; font-weight: 600; color: var(--navy-400); pointer-events: none;
        }

        /* === Calculate button === */
        .calculate-btn {
            width: 100%; padding: 14px; background: var(--coral); color: white;
            border: none; border-radius: var(--r); font-size: 16px; font-weight: 700;
            cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(249,115,22,0.25);
            display: flex; align-items: center; justify-content: center; gap: 8px;
            min-height: 48px; font-family: inherit;
        }
        .calculate-btn:hover { background: var(--coral-hover); }
        .calculate-btn:active { transform: translateY(1px); }
        .calculate-btn:disabled { opacity: 0.6; cursor: wait; }
        .loading-dots::after { content: ''; animation: dots 1.5s steps(4, end) infinite; }
        @keyframes dots { 0%,20%{content:'';} 40%{content:'.';} 60%{content:'..';} 80%,100%{content:'...';} }

        /* === Results === */
        .results-section { margin-top: 20px; animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(-10px);} to{opacity:1;transform:translateY(0);} }
        .result-main {
            background: var(--navy-800); padding: 24px; border-radius: var(--r);
            text-align: center; color: white; margin-bottom: 12px;
        }
        .result-label { font-size: 13px; opacity: 0.8; margin-bottom: 4px; font-weight: 500; }
        .result-value { font-size: 36px; font-weight: 800; margin-bottom: 4px; letter-spacing: -1px; }
        .result-rate { font-size: 15px; opacity: 0.9; }

        /* === Copy block === */
        .copy-block {
            background: var(--navy-800); border: 1px solid var(--navy-700);
            border-radius: var(--r); padding: 16px; position: relative;
        }
        .copy-text { font-size: 15px; line-height: 1.7; color: var(--navy-200); white-space: pre-line; }
        .copy-btn {
            position: absolute; top: 12px; right: 12px;
            background: #4F46E5; border: none; border-radius: 8px;
            padding: 6px 14px; color: white; font-size: 13px; font-weight: 600;
            cursor: pointer; transition: background 0.2s;
        }
        .copy-btn:hover { background: #4338CA; }

        /* === States === */
        .error-state { text-align: center; padding: 40px 20px; }
        .error-state .icon { font-size: 48px; margin-bottom: 12px; }
        .error-state h2 { font-size: 18px; margin-bottom: 8px; }
        .error-state p { font-size: 14px; color: var(--navy-500); }
        .loading { text-align: center; padding: 60px 20px; color: var(--navy-500); }
        .spinner {
            width: 32px; height: 32px; border: 3px solid var(--navy-200);
            border-top-color: var(--coral); border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .footer { text-align: center; margin-top: 20px; font-size: 12px; color: var(--navy-400); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo"><img src="/static/kyc/grusha-logo.png" alt="Grusha"></div>
            <h1>Grusha Exchange</h1>
            <div class="partner-name" id="partnerName"></div>
        </div>

        <div class="calculator-card" id="loadingState">
            <div class="loading"><div class="spinner"></div><div>Loading...</div></div>
        </div>

        <div class="calculator-card" id="errorState" style="display:none">
            <div class="error-state">
                <div class="icon">🔗</div>
                <h2>Invalid link</h2>
                <p>Please contact your Grusha manager for a new link</p>
            </div>
        </div>

        <div class="calculator-card" id="calcState" style="display:none">
            <!-- Currency direction (USDT-THB pair) -->
            <div class="direction-switcher">
                <div class="direction-header">🔁 Direction</div>
                <div class="direction-buttons">
                    <button class="direction-btn active" data-dir="usdt-thb" onclick="setDirection('usdt-thb')">
                        💵 USDT → THB
                    </button>
                    <button class="direction-btn" data-dir="thb-usdt" onclick="setDirection('thb-usdt')">
                        💎 THB → USDT
                    </button>
                </div>
            </div>

            <!-- Operation: deposit a sum or target an amount to receive -->
            <div class="direction-switcher">
                <div class="direction-header">🎯 Type of operation</div>
                <div class="direction-buttons">
                    <button class="direction-btn active" data-op="send" onclick="setOperation('send')">
                        💰 I send
                    </button>
                    <button class="direction-btn" data-op="receive" onclick="setOperation('receive')">
                        🎁 I want to receive
                    </button>
                </div>
            </div>

            <label class="input-label" id="inputLabel">Amount you send (USDT)</label>
            <div class="input-wrapper">
                <input type="text" id="amount" class="amount-input" placeholder="e.g. 1000" inputmode="decimal"
                       oninput="hideResults()" onkeydown="if(event.key==='Enter') calculate()">
                <span class="input-currency" id="inputCurrency">USDT</span>
            </div>

            <button class="calculate-btn" id="calcBtn" onclick="calculate()">🚀 Calculate</button>

            <!-- Results -->
            <div class="results-section" id="resultsSection" style="display:none">
                <div class="result-main">
                    <div class="result-label" id="resultLabel">Client receives:</div>
                    <div class="result-value" id="resultValue">0 ฿</div>
                    <div class="result-rate" id="resultRate"></div>
                </div>

                <div class="copy-block">
                    <div class="copy-text" id="copyText"></div>
                    <button class="copy-btn" onclick="copyResult()" id="copyBtn">📋 Copy</button>
                </div>
            </div>
        </div>

        <div class="footer">Approximate. Final amount may vary slightly</div>
    </div>

    <script>
        const TOKEN = window.location.pathname.split('/partner/')[1]?.split('/')[0];

        let direction = 'usdt-thb';   // 'usdt-thb' | 'thb-usdt'
        let operation = 'send';       // 'send' (вношу сумму) | 'receive' (хочу получить)
        let rateBuy = null;           // USDT → THB (наш курс продажи бат за USDT)
        let rateSell = null;          // THB → USDT (наш курс покупки бат)
        let lastResult = '';          // текст для копирования

        function getRate() { return direction === 'usdt-thb' ? rateBuy : rateSell; }

        // Что в инпуте / что в результате при текущей паре направлений и операции
        function uiConfig() {
            const isUsdtThb = direction === 'usdt-thb';
            if (operation === 'send') {
                // Вношу сумму в исходной валюте → клиент получает в целевой
                return {
                    inputCur:  isUsdtThb ? 'USDT' : 'THB',
                    outputCur: isUsdtThb ? 'THB'  : 'USDT',
                    inputLabel:  `Amount you send (${isUsdtThb ? 'USDT' : 'THB'})`,
                    resultLabel: 'Client receives:'
                };
            }
            // receive: хочу получить сумму в целевой валюте → сколько надо внести
            return {
                inputCur:  isUsdtThb ? 'THB'  : 'USDT',
                outputCur: isUsdtThb ? 'USDT' : 'THB',
                inputLabel:  `Amount you want to receive (${isUsdtThb ? 'THB' : 'USDT'})`,
                resultLabel: 'You need to send:'
            };
        }

        function applyUI() {
            const c = uiConfig();
            document.getElementById('inputLabel').textContent = c.inputLabel;
            document.getElementById('inputCurrency').textContent = c.inputCur;
            document.getElementById('resultLabel').textContent = c.resultLabel;
        }

        async function init() {
            if (!TOKEN) return showError();
            try {
                const res = await fetch(`/api/partner/${TOKEN}/info`);
                if (!res.ok) return showError();
                const data = await res.json();
                if (!data.success) return showError();

                document.getElementById('partnerName').textContent = data.name;
                rateBuy = data.rate_buy;
                rateSell = data.rate_sell;

                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('calcState').style.display = 'block';
                document.getElementById('amount').focus();

                setInterval(refreshRate, 60000);
            } catch (e) { showError(); }
        }

        function showError() {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('errorState').style.display = 'block';
        }

        function setDirection(dir) {
            if (dir === direction) return;
            direction = dir;
            document.querySelectorAll('.direction-btn[data-dir]').forEach(b => {
                b.classList.toggle('active', b.dataset.dir === dir);
            });
            applyUI();
            document.getElementById('amount').value = '';
            document.getElementById('amount').focus();
            hideResults();
        }

        function setOperation(op) {
            if (op === operation) return;
            operation = op;
            document.querySelectorAll('.direction-btn[data-op]').forEach(b => {
                b.classList.toggle('active', b.dataset.op === op);
            });
            applyUI();
            document.getElementById('amount').value = '';
            document.getElementById('amount').focus();
            hideResults();
        }

        function hideResults() {
            document.getElementById('resultsSection').style.display = 'none';
        }

        async function calculate() {
            const amount = parseFloat(document.getElementById('amount').value.replace(/\s/g, ''));
            if (!amount || amount <= 0) return;

            const btn = document.getElementById('calcBtn');
            btn.disabled = true;
            btn.innerHTML = 'Calculating<span class="loading-dots"></span>';

            try {
                // Точный курс Binance считаем по сумме в её валюте (USDT или THB)
                const inputCur = uiConfig().inputCur;
                const body = inputCur === 'USDT' ? { usdt_amount: amount } : { thb_amount: amount };
                const res = await fetch(`/api/partner/${TOKEN}/precise`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (data.success) {
                    rateBuy = data.rate_buy;
                    rateSell = data.rate_sell;
                }
            } catch (e) { /* fallback на текущий курс */ }

            showResult(amount);
            btn.innerHTML = '🚀 Calculate';
            btn.disabled = false;
        }

        function showResult(amount) {
            const rate = getRate();
            if (!rate) return;

            const isUsdtThb = direction === 'usdt-thb';
            const c = uiConfig();

            // Расчёт результата
            let result;
            if (operation === 'send') {
                // input в исходной валюте → output в целевой
                result = isUsdtThb ? amount * rate : amount / rate;
            } else {
                // input — желаемое к получению → сколько надо внести
                result = isUsdtThb ? amount / rate : amount * rate;
            }

            const resultFmt = formatNumber(result);
            const symbol = (cur) => cur === 'THB' ? '฿' : 'USDT';
            document.getElementById('resultValue').textContent = `${resultFmt} ${symbol(c.outputCur)}`;
            document.getElementById('resultRate').textContent = `Rate: 1 USDT = ${rate.toFixed(4)} THB`;

            // Блок для копирования — всегда в порядке send → receive
            let sendAmt, sendCur, recvAmt, recvCur;
            if (operation === 'send') {
                sendAmt = formatNumber(amount); sendCur = c.inputCur;
                recvAmt = resultFmt;            recvCur = c.outputCur;
            } else {
                sendAmt = resultFmt;            sendCur = c.outputCur;
                recvAmt = formatNumber(amount); recvCur = c.inputCur;
            }
            lastResult =
                `Grusha Exchange\n` +
                `You send: ${sendAmt} ${sendCur}\n` +
                `You receive: ${recvAmt} ${recvCur}\n` +
                `Rate: 1 USDT = ${rate.toFixed(4)} THB`;
            document.getElementById('copyText').textContent = lastResult;

            document.getElementById('resultsSection').style.display = 'block';
        }

        function copyResult() {
            navigator.clipboard.writeText(lastResult).then(() => {
                const btn = document.getElementById('copyBtn');
                const prev = btn.innerHTML;
                btn.innerHTML = '✓ Copied';
                setTimeout(() => { btn.innerHTML = prev; }, 1500);
            });
        }

        async function refreshRate() {
            try {
                const res = await fetch(`/api/partner/${TOKEN}/info`);
                const data = await res.json();
                if (data.success) { rateBuy = data.rate_buy; rateSell = data.rate_sell; }
            } catch (e) {}
        }

        function formatNumber(n) {
            return new Intl.NumberFormat('en-US', {
                minimumFractionDigits: 2, maximumFractionDigits: 2
            }).format(parseFloat(n));
        }

        init();
    </script>
</body>
</html>
