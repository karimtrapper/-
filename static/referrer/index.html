<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grusha — Партнёрская программа</title>
    <link rel="icon" type="image/png" href="/static/kyc/grusha-logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-900: #0F172A; --navy-800: #1E293B; --navy-700: #334155;
            --navy-600: #475569; --navy-500: #64748B; --navy-400: #94A3B8;
            --navy-300: #CBD5E1; --navy-200: #E2E8F0; --navy-100: #F1F5F9;
            --navy-50: #F8FAFC;
            --coral: #F97316; --coral-dark: #EA580C; --coral-light: #FFF7ED;
            --green: #22C55E; --green-dark: #16A34A; --green-light: #F0FDF4;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--navy-50); color: var(--navy-900);
            min-height: 100vh;
        }
        .container { width: 100%; max-width: 480px; margin: 0 auto; }

        /* Desktop: центрируем карточку + тень как на мобильном */
        @media (min-width: 768px) {
            body { display: flex; justify-content: center; align-items: flex-start; padding-top: 40px; }
            .container {
                border-radius: 24px; overflow: hidden;
                box-shadow: 0 20px 50px rgba(15,23,42,0.12);
                border: 1px solid var(--navy-100);
                margin-bottom: 40px;
            }
        }

        /* === Hero === */
        .hero {
            background: #fff;
            padding: 32px 24px 40px;
            position: relative;
            overflow: hidden;
            text-align: center;
        }
        .hero::before {
            content: '';
            position: absolute; inset: 0;
            background: radial-gradient(circle at 85% 0%, rgba(249,115,22,0.07) 0%, transparent 42%),
                        radial-gradient(circle at 10% 100%, rgba(34,197,94,0.05) 0%, transparent 42%);
        }
        .hero-content { position: relative; z-index: 2; }
        .hero-fade {
            position: absolute; bottom: 0; left: 0; right: 0; height: 32px;
            background: linear-gradient(transparent, var(--navy-50));
        }

        /* Header в hero */
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .logo {
            width: 36px; height: 36px; border-radius: 10px;
            background: linear-gradient(135deg, var(--green), var(--green-dark));
            display: flex; align-items: center; justify-content: center;
        }
        .logo img { width: 24px; height: 24px; }
        .header-text .brand { color: var(--navy-900); font-size: 14px; font-weight: 600; }
        .header-text .partner { color: var(--navy-500); font-size: 12px; }
        .badge {
            padding: 6px 12px; border-radius: 999px;
            border: 1px solid rgba(249,115,22,0.3); background: rgba(249,115,22,0.1);
            font-size: 12px; font-weight: 700; color: var(--coral);
            animation: badgeShine 3s ease-in-out infinite;
            background-size: 200% 100%;
        }

        /* Баланс */
        .balance-label { color: var(--navy-500); font-size: 11px; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 8px; }
        .balance-amount { display: flex; align-items: baseline; justify-content: center; gap: 2px; margin-bottom: 4px; }
        .balance-amount .sign { color: var(--navy-400); font-size: 24px; font-weight: 300; }
        .balance-amount .value { color: var(--navy-900); font-size: 48px; font-weight: 800; letter-spacing: -2px; line-height: 1; }
        .balance-amount .cents { color: var(--navy-400); font-size: 24px; font-weight: 300; }
        .balance-sub { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 12px 0 20px; }
        .balance-sub .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
        .balance-sub span { color: var(--navy-500); font-size: 12px; }

        /* CTA */
        .cta-btn {
            display: block; width: 100%; padding: 14px; border-radius: 14px; border: none;
            background: linear-gradient(135deg, var(--coral), var(--coral-dark));
            color: white; font-size: 15px; font-weight: 700; cursor: pointer;
            font-family: inherit; animation: pulseGlow 3s ease-in-out infinite;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .cta-btn:active { transform: scale(0.97); }

        /* === Светлая часть === */
        .content { background: var(--navy-50); padding: 20px 16px 40px; }

        /* Stats grid */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-card {
            background: white; border-radius: 14px; padding: 14px;
            border: 1px solid rgba(226,232,240,0.6);
            box-shadow: 0 1px 3px rgba(15,23,42,0.05);
            animation: floatUp 0.5s ease-out backwards;
        }
        .stat-card:nth-child(1) { animation-delay: 0.1s; }
        .stat-card:nth-child(2) { animation-delay: 0.15s; }
        .stat-card:nth-child(3) { animation-delay: 0.2s; }
        .stat-card:nth-child(4) { animation-delay: 0.25s; }
        .stat-icon { width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
        .stat-value { font-size: 22px; font-weight: 700; color: var(--navy-900); }
        .stat-label { font-size: 11px; color: var(--navy-500); margin-top: 2px; }

        /* Section title */
        .section-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }

        /* Deal cards */
        .deal-card {
            background: white; border-radius: 14px; padding: 14px;
            border: 1px solid rgba(226,232,240,0.6); margin-bottom: 8px;
            box-shadow: 0 1px 2px rgba(15,23,42,0.04);
            transition: background 0.15s;
        }
        .deal-card:active { background: var(--navy-50); }
        .deal-row { display: flex; align-items: center; justify-content: space-between; }
        .deal-left { display: flex; align-items: center; gap: 10px; }
        .deal-avatar {
            width: 36px; height: 36px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; color: white;
            font-size: 11px; font-weight: 700; flex-shrink: 0;
        }
        .deal-name { font-size: 13px; font-weight: 600; }
        .deal-date { font-size: 11px; color: var(--navy-400); }
        .deal-amount { font-size: 13px; font-weight: 700; text-align: right; }
        .deal-income { font-size: 12px; font-weight: 600; color: var(--green); text-align: right; }
        .deal-status {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 999px; margin-top: 8px;
        }
        .deal-status.paid { background: rgba(34,197,94,0.1); color: var(--green-dark); }
        .deal-status.pending { background: rgba(249,115,22,0.1); color: var(--coral); }
        .deal-status .dot { width: 5px; height: 5px; border-radius: 50%; }
        .deal-status.paid .dot { background: var(--green); }
        .deal-status.pending .dot { background: var(--coral); }

        /* Условия */
        .conditions-card {
            background: white; border-radius: 14px; padding: 16px;
            border: 1px solid rgba(226,232,240,0.6); margin-bottom: 20px;
            box-shadow: 0 1px 3px rgba(15,23,42,0.05);
        }
        .cond-row {
            display: flex; align-items: center; gap: 12px; padding: 10px 0;
            border-bottom: 1px solid var(--navy-100);
        }
        .cond-row:last-child { border-bottom: none; }
        .cond-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .cond-label { font-size: 11px; color: var(--navy-400); }
        .cond-value { font-size: 13px; font-weight: 600; }

        /* Ref links */
        .ref-card {
            background: white; border-radius: 14px; padding: 14px;
            border: 1px solid rgba(226,232,240,0.6); margin-bottom: 8px;
            box-shadow: 0 1px 2px rgba(15,23,42,0.04);
        }
        .ref-row { display: flex; align-items: center; gap: 10px; }
        .ref-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .ref-url { flex: 1; min-width: 0; font-size: 12px; color: var(--navy-500); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: 'SF Mono', monospace; }
        .ref-copy {
            padding: 6px 12px; border-radius: 8px; border: none;
            background: var(--navy-100); color: var(--navy-700);
            font-size: 12px; font-weight: 600; cursor: pointer; flex-shrink: 0;
            font-family: inherit; transition: background 0.15s;
        }
        .ref-copy:active { background: var(--navy-200); }
        .ref-copy.copied { background: var(--green); color: white; }

        /* Misc */
        .empty-state { text-align: center; padding: 24px; color: var(--navy-400); font-size: 13px; }
        .loading { text-align: center; padding: 64px 24px; color: var(--navy-500); font-size: 14px; background: var(--navy-50); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .error { text-align: center; padding: 64px 24px; color: #EF4444; font-size: 14px; background: var(--navy-50); min-height: 100vh; display: flex; align-items: center; justify-content: center; }

        /* Animations */
        @keyframes gradientShift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        @keyframes pulseGlow { 0%,100%{box-shadow:0 0 16px rgba(249,115,22,0.25)} 50%{box-shadow:0 0 28px rgba(249,115,22,0.45)} }
        @keyframes floatUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
        @keyframes badgeShine { 0%{background-position:-100% 0} 100%{background-position:200% 0} }

        /* Payout modal */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.6);
            backdrop-filter: blur(4px); z-index: 100; align-items: flex-end; justify-content: center;
            padding: 0; animation: fadeIn 0.2s ease;
        }
        .modal-overlay.show { display: flex; }
        @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
        @keyframes slideUp { from { transform: translateY(100%) } to { transform: translateY(0) } }
        .modal-box {
            background: white; border-radius: 24px 24px 0 0; width: 100%; max-width: 480px;
            padding: 24px 20px 28px; max-height: 92vh; overflow-y: auto;
            animation: slideUp 0.25s ease-out;
        }
        @media (min-width: 480px) {
            .modal-overlay { align-items: center; padding: 20px; }
            .modal-box { border-radius: 20px; }
        }
        .modal-handle { width: 36px; height: 4px; background: #E2E8F0; border-radius: 2px; margin: -8px auto 16px; }
        .modal-title { font-size: 18px; font-weight: 700; color: var(--navy-900); margin-bottom: 4px; }
        .modal-sub { font-size: 13px; color: var(--navy-500); margin-bottom: 20px; }
        .modal-field { margin-bottom: 14px; }
        .modal-label { font-size: 12px; font-weight: 600; color: var(--navy-600); margin-bottom: 6px; display: block; text-transform: uppercase; letter-spacing: 0.4px; }
        .modal-input, .modal-textarea {
            width: 100%; padding: 12px 14px; border: 1.5px solid #E2E8F0; border-radius: 12px;
            font-size: 14px; color: var(--navy-900); background: var(--navy-50); font-family: inherit;
            transition: border-color 0.15s, background 0.15s; box-sizing: border-box;
        }
        .modal-input:focus, .modal-textarea:focus {
            outline: none; border-color: var(--coral); background: white;
        }
        .modal-textarea { resize: vertical; min-height: 64px; }
        .modal-radio-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .modal-radio {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px; border: 1.5px solid #E2E8F0; border-radius: 12px;
            cursor: pointer; font-size: 14px; font-weight: 600; color: var(--navy-600);
            background: var(--navy-50); transition: all 0.15s;
        }
        .modal-radio.active { border-color: var(--coral); background: #FFF7ED; color: var(--coral); }
        .modal-radio input { display: none; }
        .modal-disclaimer {
            font-size: 12px; color: var(--navy-500); background: var(--navy-50);
            padding: 10px 12px; border-radius: 10px; margin-bottom: 16px; line-height: 1.5;
        }
        .modal-actions { display: flex; gap: 8px; margin-top: 8px; }
        .modal-btn {
            flex: 1; padding: 14px; border-radius: 12px; border: none; font-size: 15px; font-weight: 700;
            cursor: pointer; font-family: inherit; transition: opacity 0.15s, transform 0.05s;
        }
        .modal-btn:active { transform: scale(0.98); }
        .modal-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .modal-btn-cancel { background: var(--navy-50); color: var(--navy-600); }
        .modal-btn-submit {
            background: linear-gradient(135deg, var(--coral), #EA580C); color: white;
        }
        .modal-error {
            background: #FEF2F2; color: #DC2626; padding: 10px 12px; border-radius: 10px;
            font-size: 13px; margin-bottom: 12px; display: none;
        }
        .modal-error.show { display: block; }
        .modal-success {
            text-align: center; padding: 16px 0;
        }
        .modal-success .icon {
            width: 64px; height: 64px; border-radius: 50%; background: #DCFCE7;
            display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;
        }
        .modal-success h3 { font-size: 18px; color: var(--navy-900); margin-bottom: 8px; }
        .modal-success p { font-size: 14px; color: var(--navy-500); line-height: 1.5; margin-bottom: 20px; }

        /* Баннеры */
        .banner {
            display: flex; gap: 12px; align-items: flex-start;
            padding: 14px; border-radius: 14px; margin-bottom: 12px;
            font-size: 13px; line-height: 1.45;
        }
        .banner-icon { flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .banner-body { flex: 1; min-width: 0; }
        .banner-title { font-weight: 700; margin-bottom: 2px; }
        .banner-action { display: inline-block; margin-top: 8px; padding: 6px 12px; border-radius: 8px; border: none; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; }
        .banner-info { background: #FFF7ED; color: #9A3412; border: 1px solid #FED7AA; }
        .banner-info .banner-icon { background: #FED7AA; color: #C2410C; }
        .banner-info .banner-action { background: #C2410C; color: white; }
        .banner-success { background: #F0FDF4; color: #14532D; border: 1px solid #BBF7D0; }
        .banner-success .banner-icon { background: #BBF7D0; color: #16A34A; }
        .banner-progress { background: #EFF6FF; color: #1E3A8A; border: 1px solid #BFDBFE; }
        .banner-progress .banner-icon { background: #BFDBFE; color: #2563EB; }

        /* Карточки заявок */
        .payout-card {
            background: white; border-radius: 14px; padding: 14px;
            border: 1px solid rgba(226,232,240,0.6); margin-bottom: 8px;
            box-shadow: 0 1px 2px rgba(15,23,42,0.04);
        }
        .payout-status {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px;
        }
        .payout-status.new { background: rgba(249,115,22,0.1); color: var(--coral); }
        .payout-status.in_progress { background: rgba(59,130,246,0.1); color: #2563EB; }
        .payout-status.paid { background: rgba(34,197,94,0.1); color: var(--green-dark); }
        .payout-status.cancelled { background: rgba(100,116,139,0.1); color: var(--navy-500); }
        .tx-link {
            display: inline-block; margin-top: 6px; font-family: 'SF Mono', monospace;
            font-size: 11px; color: var(--green-dark); background: #F0FDF4;
            padding: 4px 8px; border-radius: 6px; word-break: break-all;
            text-decoration: none; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        /* Пагинация */
        .pager {
            display: flex; justify-content: center; gap: 6px; margin-top: 8px;
        }
        .pager button {
            background: white; border: 1px solid var(--navy-200); border-radius: 8px;
            padding: 6px 12px; font-size: 12px; font-weight: 600; color: var(--navy-700);
            cursor: pointer; font-family: inherit; transition: all 0.15s;
        }
        .pager button:hover:not(:disabled) { background: var(--navy-50); }
        .pager button:disabled { opacity: 0.4; cursor: not-allowed; }
        .pager button.active { background: var(--coral); color: white; border-color: var(--coral); }

        /* Экран входа через Telegram */
        .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .login-card {
            width: 100%; max-width: 380px; background: #fff;
            border: 1px solid var(--navy-200); border-radius: 20px;
            padding: 38px 28px 30px; text-align: center;
            box-shadow: 0 12px 40px rgba(15,23,42,0.10); animation: loginIn 0.4s ease;
        }
        @keyframes loginIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
        .login-logo-img { width: 54px; height: 54px; margin: 0 auto 16px; display: block; object-fit: contain; }
        .login-welcome { font-size: 23px; font-weight: 700; color: var(--navy-900); margin-bottom: 6px; letter-spacing: -0.02em; }
        .login-btn {
            display: flex; align-items: center; justify-content: center; gap: 9px;
            width: 100%; padding: 14px; border: none; border-radius: 10px;
            background: var(--navy-800); color: #fff; font-size: 15px; font-weight: 600;
            font-family: inherit; cursor: pointer; transition: background 0.15s, transform 0.05s;
        }
        .login-btn:hover { background: var(--navy-700); }
        .login-btn:active { transform: scale(0.99); }
        .login-btn svg { flex-shrink: 0; }
        .login-refname {
            display: inline-block; margin: 2px 0 16px; padding: 6px 16px;
            background: var(--green-light); border: 1px solid rgba(34,197,94,0.35);
            border-radius: 999px; color: var(--green-dark); font-size: 14px; font-weight: 600; max-width: 100%;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .login-sub { color: var(--navy-500); font-size: 14px; line-height: 1.55; margin-bottom: 26px; }
        .login-widget-box { display: flex; justify-content: center; min-height: 48px; }
        .login-hint {
            margin-top: 20px; color: var(--navy-500); font-size: 12px; line-height: 1.5;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .login-error { color: #f87171; font-size: 13px; margin-top: 12px; min-height: 16px; }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="loading" id="loading">Загрузка...</div>
    </div>

    <script>
    // HTML-эскейп для безопасной вставки user-controlled строк в innerHTML.
    // Всё что приходит с сервера (имя реферера/клиента/маскированные поля) — потенциально XSS-вектор.
    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"'\/]/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '/': '&#x2F;'
        }[c]));
    }
    let statsData = null;
    const token = window.location.pathname.split('/ref/')[1]?.split('/')[0];

    // Маскируем внутренний инкрементный ID, чтобы партнёр не видел #1/#2
    // и не понимал, что он один из первых. Детерминированно: тот же id → тот же номер.
    function maskId(id) {
        const n = Number(id) || 0;
        return 10472 + n * 37 + ((n * 11) % 53);
    }

    function togglePayouts() {
        const sec = document.getElementById('payouts-section');
        const body = document.getElementById('payouts-body');
        const ch = document.getElementById('payouts-chevron');
        if (!sec || !body) return;
        const expanded = sec.dataset.expanded === '1';
        sec.dataset.expanded = expanded ? '0' : '1';
        body.style.display = expanded ? 'none' : 'block';
        if (ch) ch.style.transform = expanded ? 'rotate(0deg)' : 'rotate(90deg)';
    }
    if (!token) {
        document.getElementById('app').innerHTML = '<div class="error">Неверная ссылка</div>';
    } else {
        loadStats();
    }

    // Экран входа через Telegram (для рефереров с auth_mode='telegram')
    window.onTgAuth = async function (user) {
        try {
            const resp = await fetch(`/api/ref/${token}/tg-login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(user),
            });
            const d = await resp.json();
            if (d.success) { location.reload(); return; }
            showTgSwitchWidget(d.error);
        } catch (e) {
            document.getElementById('tg-login-error').textContent = 'Ошибка сети';
        }
    };

    // Официальная смена аккаунта: embed-виджет Telegram при закэшированной сессии
    // показывает «Log in as <Имя> ▾» — в меню ▾ есть «Log in as another account».
    function showTgSwitchWidget(errText) {
        const err = document.getElementById('tg-login-error');
        if (!err) return;
        err.innerHTML = esc(errText || 'Не удалось войти') +
            '<div style="margin-top:6px;color:#94A3B8;font-size:12px;">Не тот аккаунт? ' +
            'Нажмите стрелку <b>▾</b> на кнопке ниже → <b>Log in as another account</b>:</div>' +
            '<div id="tg-switch-widget" style="margin-top:10px;display:flex;justify-content:center;"></div>';
        const s = document.createElement('script');
        s.async = true;
        s.src = 'https://telegram.org/js/telegram-widget.js?22';
        s.setAttribute('data-telegram-login', window._tgBotUsername || '');
        s.setAttribute('data-size', 'medium');
        s.setAttribute('data-onauth', 'onTgAuth(user)');

    // ============== Пагинация сделок и заявок ==============
    const PAGE_SIZE = 5;

    function renderPager(elId, total, current, onPage) {
        const el = document.getElementById(elId);
        if (!el) return;
        const pages = Math.ceil(total / PAGE_SIZE);
        if (pages <= 1) { el.innerHTML = ''; return; }
        const win = 5;
        let start = Math.max(1, current - 2);
        let end = Math.min(pages, start + win - 1);
        start = Math.max(1, end - win + 1);
        let html = `<button ${current === 1 ? 'disabled' : ''} onclick="${onPage}(${current - 1})">‹</button>`;
        for (let i = start; i <= end; i++) {
            html += `<button class="${i === current ? 'active' : ''}" onclick="${onPage}(${i})">${i}</button>`;
        }
        html += `<button ${current === pages ? 'disabled' : ''} onclick="${onPage}(${current + 1})">›</button>`;
        el.innerHTML = html;
    }

    // Сумма сделки в её реальной валюте: USDT-сделки показываем как $, THB — как ฿
    function dealAmount(deal) {
        const cur = (deal.payout_currency || '').toLowerCase();
        const amt = deal.payout_amount || 0;
        if (!amt) return '$' + (deal.volume_usdt || 0).toFixed(0);
        const sym = { thb: '฿', usd: '$', usdt: '$', rub: '₽' }[cur] || '';
        const num = Math.round(amt).toLocaleString('ru-RU');
        return sym ? sym + num : num + ' ' + cur.toUpperCase();
    }

    // Подпись модели вознаграждения. У реферала может быть НЕСКОЛЬКО компонент
    // в одной сделке (напр. «+0.5% × объём» сверху + «30% × прибыль» от остатка) —
    // тогда components содержит все строки, соединяем через « + ».
    function compLabel(deal) {
        const one = (m, pct, base) =>
            m === 'markup' ? 'markup +' + (pct || 0) + '% × объём' + (deal.volume_usdt ? ' ($' + deal.volume_usdt.toFixed(0) + ')' : '')
            : m === 'fixed' ? 'фикс'
            : (pct || 0) + '% × прибыль' + (base != null ? ' ($' + base.toFixed(2) + ')' : '');
        const comps = deal.components || [];
        if (comps.length > 1) {
            return comps.map(c => one(c.comp_model, c.percent, c.base_usdt) + ' = $' + (c.payout_usdt || 0).toFixed(2)).join(' + ');
        }
        return deal.comp_model === 'fixed'
            ? 'фикс $' + (deal.commission_usdt || 0).toFixed(2)
            : one(deal.comp_model, deal.percent, deal.profit_usdt);
    }

    function renderDeals(page) {
        const list = document.getElementById('deals-list');
        if (!list || !statsData) return;
        const all = statsData.recent_deals || [];
        if (!all.length) { list.innerHTML = '<div class="empty-state">Пока нет завершённых сделок</div>'; return; }
        const start = (page - 1) * PAGE_SIZE;
        const items = all.slice(start, start + PAGE_SIZE);
        const avatarColors = [
            'linear-gradient(135deg,#22C55E,#16A34A)',
            'linear-gradient(135deg,#3B82F6,#2563EB)',
            'linear-gradient(135deg,#F59E0B,#D97706)',
            'linear-gradient(135deg,#8B5CF6,#7C3AED)',
            'linear-gradient(135deg,#EC4899,#DB2777)',
        ];
        list.innerHTML = items.map((deal, i) => `
            <div class="deal-card">
                <div class="deal-row">
                    <div class="deal-left">
                        <div class="deal-avatar" style="background:${avatarColors[(start + i) % avatarColors.length]}">${esc(deal.client_initials || '??')}</div>
                        <div>
                            <div class="deal-name">${esc(deal.client_masked || 'Клиент')}</div>
                            <div class="deal-date">${esc(deal.date || '—')}</div>
                        </div>
                    </div>
                    <div>
                        <div class="deal-amount">${dealAmount(deal)}</div>
                        <div class="deal-income">+$${(deal.commission_usdt || 0).toFixed(0)}</div>
                    </div>
                </div>
                <div style="font-size:11px;color:#94a3b8;margin-top:4px;">
                    ${compLabel(deal)}
                </div>
                <div class="deal-status ${deal.paid ? 'paid' : 'pending'}">
                    <span class="dot"></span>
                    ${deal.paid ? 'Выплачено' + (deal.paid_note ? ' · ' + esc(deal.paid_note) : '') : 'К выплате'}
                </div>
            </div>
        `).join('');
        renderPager('deals-pager', all.length, page, 'renderDeals');
    }

    function renderPayouts(page) {
        const list = document.getElementById('payouts-list');
        if (!list || !statsData) return;
        const all = statsData.payout_requests || [];
        if (!all.length) { list.innerHTML = ''; return; }
        const STATUS_RU = { new: 'На рассмотрении', in_progress: 'В работе', paid: 'Выплачено', cancelled: 'Отменено' };
        const start = (page - 1) * PAGE_SIZE;
        const items = all.slice(start, start + PAGE_SIZE);
        list.innerHTML = items.map(r => {
            const date = r.created_at ? new Date(r.created_at).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '—';
            return `
                <div class="payout-card">
                    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
                        <div style="font-size:13px;font-weight:600;color:var(--navy-900);">$${(r.amount_usdt||0).toFixed(2)}</div>
                        <span class="payout-status ${r.status}">${STATUS_RU[r.status] || r.status}</span>
                    </div>
                    <div style="font-size:11px;color:var(--navy-500);margin-top:4px;">#${maskId(r.id)} · ${date}</div>
                    ${r.tx_hash ? `<a class="tx-link" href="https://tronscan.org/#/transaction/${esc(r.tx_hash)}" target="_blank">TX: ${esc(r.tx_hash)}</a>` : ''}
                </div>
            `;
        }).join('');
        renderPager('payouts-pager', all.length, page, 'renderPayouts');
    }

    async function cancelActiveRequest(reqId) {
        if (!confirm('Отменить заявку?')) return;
        try {
            const resp = await fetch(`/api/ref/${token}/payout-request/${reqId}/cancel`, { method: 'POST' });
            const data = await resp.json();
            if (!data.success) { alert(data.error || 'Не удалось отменить'); return; }
            loadStats();
        } catch (e) { alert('Сетевая ошибка'); }
    }

    function copyUrl(elId, btn) {
        const text = document.getElementById(elId).textContent;
        navigator.clipboard.writeText(text).then(() => {
            btn.textContent = 'Скопировано!';
            btn.classList.add('copied');
            setTimeout(() => { btn.textContent = 'Копировать'; btn.classList.remove('copied'); }, 2000);
        });
    }

    // ============== Модалка заявки на выплату ==============
    function openPayoutModal() {
        if (!statsData || (statsData.pending_usdt || 0) < 20) return;
        const tg = statsData.telegram || '';
        document.getElementById('payoutModal').classList.add('show');
        document.getElementById('payoutAmount').textContent = '$' + (statsData.pending_usdt || 0).toFixed(2);
        document.getElementById('payoutCurrency').textContent = (statsData.payout_currency || 'USDT') + ' (TRC-20)';
        document.getElementById('pmWallet').value = '';
        document.getElementById('pmContactValue').value = tg;
        document.getElementById('pmNotes').value = '';
        setContactMethod(tg ? 'telegram' : 'telegram');
        hidePayoutError();

        // Подсказки предыдущих кошельков
        const wallets = statsData.previous_wallets || [];
        const dl = document.getElementById('pmWalletList');
        const chips = document.getElementById('pmWalletChips');
        dl.innerHTML = wallets.map(w => `<option value="${esc(w)}">`).join('');
        if (wallets.length) {
            chips.innerHTML = '<div style="font-size:11px;color:var(--navy-500);width:100%;margin-bottom:2px;">Прошлые кошельки:</div>' +
                wallets.map(w => `<button type="button" onclick="document.getElementById('pmWallet').value='${esc(w)}'" style="background:var(--navy-100);border:1px solid var(--navy-200);border-radius:8px;padding:6px 10px;font-size:11px;font-family:'SF Mono',monospace;color:var(--navy-700);cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(w.length > 16 ? w.slice(0,8)+'...'+w.slice(-6) : w)}</button>`).join('');
        } else {
            chips.innerHTML = '';
        }

        document.getElementById('payoutFormBox').style.display = 'block';
        document.getElementById('payoutSuccessBox').style.display = 'none';
        document.body.style.overflow = 'hidden';
    }
    function closePayoutModal() {
        document.getElementById('payoutModal').classList.remove('show');
        document.body.style.overflow = '';
    }
    function setContactMethod(method) {
        document.querySelectorAll('.modal-radio').forEach(el => {
            el.classList.toggle('active', el.dataset.method === method);
        });
        const inp = document.getElementById('pmContactValue');
        inp.placeholder = method === 'telegram' ? '@username или +66...' : '+66 81 234 56 78';
        inp.dataset.method = method;
    }
    function showPayoutError(msg) {
        const el = document.getElementById('payoutError');
        el.textContent = msg;
        el.classList.add('show');
    }
    function hidePayoutError() {
        document.getElementById('payoutError').classList.remove('show');
    }
    async function submitPayoutRequest(e) {
        e.preventDefault();
        hidePayoutError();
        const wallet = document.getElementById('pmWallet').value.trim();
        const method = document.getElementById('pmContactValue').dataset.method || 'telegram';
        const contact = document.getElementById('pmContactValue').value.trim();
        const notes = document.getElementById('pmNotes').value.trim();

        if (!wallet) { showPayoutError('Укажите кошелёк для выплаты'); return; }
        if (!contact) { showPayoutError('Укажите контакт для связи'); return; }

        const btn = document.getElementById('pmSubmit');
        btn.disabled = true;
        btn.textContent = 'Отправляем...';
        try {
            const resp = await fetch(`/api/ref/${token}/payout-request`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    wallet, contact_method: method, contact_value: contact, notes
                })
            });
            const data = await resp.json();
            if (!data.success) {
                showPayoutError(data.error || 'Ошибка отправки');
                btn.disabled = false;
                btn.textContent = 'Отправить заявку';
                return;
            }
            document.getElementById('payoutFormBox').style.display = 'none';
            document.getElementById('payoutSuccessBox').style.display = 'block';
        } catch (err) {
            showPayoutError('Сетевая ошибка. Попробуйте ещё раз.');
            btn.disabled = false;
            btn.textContent = 'Отправить заявку';
        }
    }
    </script>

    <!-- Модалка заявки на выплату -->
    <div class="modal-overlay" id="payoutModal" onclick="if(event.target===this)closePayoutModal()">
        <div class="modal-box">
            <div class="modal-handle"></div>

            <div id="payoutFormBox">
                <div class="modal-title">Заявка на выплату</div>
                <div class="modal-sub">Доступно: <b id="payoutAmount">$0.00</b> · <span id="payoutCurrency">USDT (TRC-20)</span></div>

                <div class="modal-error" id="payoutError"></div>

                <form onsubmit="submitPayoutRequest(event)">
                    <div class="modal-field">
                        <label class="modal-label">Кошелёк для выплаты</label>
                        <input type="text" class="modal-input" id="pmWallet" placeholder="TXXXXXXXXXXXXXXXXXXXXXXXXX" autocomplete="off" list="pmWalletList" required>
                        <datalist id="pmWalletList"></datalist>
                        <div id="pmWalletChips" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;"></div>
                    </div>

                    <div class="modal-field">
                        <label class="modal-label">Способ связи</label>
                        <div class="modal-radio-group">
                            <label class="modal-radio active" data-method="telegram" onclick="setContactMethod('telegram')">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 0 0-.07-.2c-.08-.06-.19-.04-.27-.02-.12.03-1.99 1.27-5.63 3.72-.53.37-1.01.55-1.44.54-.47-.01-1.38-.27-2.06-.49-.83-.27-1.49-.42-1.43-.88.03-.24.37-.49 1.02-.75 3.98-1.73 6.64-2.87 7.97-3.44 3.8-1.58 4.59-1.86 5.1-1.87z"/></svg>
                                Telegram
                            </label>
                            <label class="modal-radio" data-method="whatsapp" onclick="setContactMethod('whatsapp')">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347M12.05 21.785h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884"/></svg>
                                WhatsApp
                            </label>
                        </div>
                    </div>

                    <div class="modal-field">
                        <label class="modal-label">Контакт</label>
                        <input type="text" class="modal-input" id="pmContactValue" placeholder="@username или +66..." autocomplete="off" required>
                    </div>

                    <div class="modal-field">
                        <label class="modal-label">Комментарий (необязательно)</label>
                        <textarea class="modal-textarea" id="pmNotes" placeholder="Доп. информация для менеджера"></textarea>
                    </div>

                    <div class="modal-disclaimer">
                        Свяжемся с вами, если возникнут вопросы по оплате. Выплата USDT TRC-20 на указанный кошелёк.
                    </div>

                    <div class="modal-actions">
                        <button type="button" class="modal-btn modal-btn-cancel" onclick="closePayoutModal()">Отмена</button>
                        <button type="submit" class="modal-btn modal-btn-submit" id="pmSubmit">Отправить заявку</button>
                    </div>
                </form>
            </div>

            <div id="payoutSuccessBox" style="display:none;">
                <div class="modal-success">
                    <div class="icon">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                    </div>
                    <h3>Заявка отправлена</h3>
                    <p>Менеджер свяжется с вами в ближайшее время для подтверждения деталей и проведения выплаты.</p>
                    <button type="button" class="modal-btn modal-btn-submit" onclick="closePayoutModal()" style="width:100%;">Готово</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
