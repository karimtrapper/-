<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Grusha CRM</title>
    <link rel="icon" type="image/png" href="/static/kyc/grusha-logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #F8FAFC;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #fff;
            border-radius: 16px;
            padding: 40px 32px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 4px 24px rgba(15,23,42,0.08);
        }
        .login-logo {
            text-align: center;
            margin-bottom: 24px;
        }
        .login-logo img {
            width: 48px;
            height: 48px;
        }
        .login-title {
            font-size: 22px;
            font-weight: 800;
            text-align: center;
            color: #1E293B;
            margin-bottom: 4px;
        }
        .login-subtitle {
            font-size: 14px;
            color: #64748B;
            text-align: center;
            margin-bottom: 28px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #E2E8F0;
            border-radius: 10px;
            font-family: inherit;
            font-size: 15px;
            color: #0F172A;
            transition: border-color 0.2s;
            outline: none;
            min-height: 48px;
        }
        .form-group input:focus {
            border-color: #F97316;
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.12);
        }
        .btn-login {
            width: 100%;
            padding: 13px;
            background: #1E293B;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
            min-height: 48px;
        }
        .btn-login:hover { background: #334155; }
        .btn-login:active { transform: scale(0.98); }
        .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .error-msg {
            background: #FEF2F2;
            color: #991B1B;
            font-size: 13px;
            font-weight: 500;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
            text-align: center;
        }
        .error-msg.visible { display: block; }

        /* Setup mode */
        .setup-note {
            background: #EFF6FF;
            color: #1E40AF;
            font-size: 13px;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">
            <img src="/kyc/grusha-logo.png" alt="Grusha">
        </div>

        <!-- Режим первой настройки -->
        <div id="setupMode" style="display:none">
            <h1 class="login-title">Создание аккаунта</h1>
            <p class="login-subtitle">Первый вход — создайте администратора</p>
            <div class="setup-note">Это одноразовая настройка. После создания аккаунта вход будет по логину и паролю.</div>
            <div class="error-msg" id="setupError"></div>
            <form onsubmit="doSetup(event)">
                <div class="form-group">
                    <label>Имя</label>
                    <input type="text" id="setupName" placeholder="Как вас зовут" autocomplete="name" required>
                </div>
                <div class="form-group">
                    <label>Логин</label>
                    <input type="text" id="setupUsername" placeholder="Придумайте логин" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="setupPassword" placeholder="Минимум 4 символа" autocomplete="new-password" required minlength="4">
                </div>
                <button class="btn-login" type="submit" id="setupBtn">Создать аккаунт</button>
            </form>
        </div>

        <!-- Обычный логин: только Telegram -->
        <div id="loginMode">
            <h1 class="login-title">Вход в CRM</h1>
            <p class="login-subtitle">Grusha Exchange</p>
            <div class="error-msg" id="loginError"></div>
            <button class="btn-login" id="tgLoginBtn" style="display:flex;align-items:center;justify-content:center;gap:9px;">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg>
                Войти через Telegram
            </button>
            <div style="text-align:center;margin-top:16px;">
                <a href="#" id="pwToggle" style="font-size:12px;color:#94A3B8;text-decoration:none;">Вход по паролю</a>
            </div>
            <form onsubmit="doLogin(event)" id="pwForm" style="display:none;margin-top:16px;">
                <div class="form-group">
                    <label>Логин</label>
                    <input type="text" id="loginUsername" placeholder="Введите логин" autocomplete="username">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="loginPassword" placeholder="Введите пароль" autocomplete="current-password">
                </div>
                <button class="btn-login" type="submit" id="loginBtn">Войти</button>
            </form>
        </div>
    </div>

    <script>
        // Проверяем: есть ли уже админ?
        (async function init() {
            try {
                const resp = await fetch('/api/auth/me');
                if (resp.ok) {
                    // Уже авторизован
                    window.location.href = '/crm';
                    return;
                }
            } catch(e) {}

            // Проверяем, нужна ли первоначальная настройка
            try {
                const resp = await fetch('/api/auth/setup', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: '', password: ''})
                });
                const data = await resp.json();
                if (resp.status === 403) {
                    // Админ уже создан или setup отключён — показываем логин
                    document.getElementById('loginMode').style.display = 'block';
                    document.getElementById('setupMode').style.display = 'none';
                } else {
                    // Первая настройка
                    document.getElementById('loginMode').style.display = 'none';
                    document.getElementById('setupMode').style.display = 'block';
                }
            } catch(e) {
                // Фоллбэк — показываем логин
            }
        })();

        async function doLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errEl = document.getElementById('loginError');
            errEl.classList.remove('visible');
            btn.disabled = true;
            btn.textContent = 'Входим...';

            try {
                const resp = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username: document.getElementById('loginUsername').value,
                        password: document.getElementById('loginPassword').value
                    })
                });
                const data = await resp.json();
                if (data.success) {
                    window.location.href = '/crm';
                } else {
                    errEl.textContent = data.error || 'Ошибка входа';
                    errEl.classList.add('visible');
                }
            } catch(err) {
                errEl.textContent = 'Ошибка сети';
                errEl.classList.add('visible');
            }
            btn.disabled = false;
            btn.textContent = 'Войти';
        }

        async function doSetup(e) {
            e.preventDefault();
            const btn = document.getElementById('setupBtn');
            const errEl = document.getElementById('setupError');
            errEl.classList.remove('visible');
            btn.disabled = true;
            btn.textContent = 'Создаём...';

            try {
                const resp = await fetch('/api/auth/setup', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        display_name: document.getElementById('setupName').value,
                        username: document.getElementById('setupUsername').value,
                        password: document.getElementById('setupPassword').value
                    })
                });
                const data = await resp.json();
                if (data.success) {
                    window.location.href = '/crm';
                } else {
                    errEl.textContent = data.error || 'Ошибка создания';
                    errEl.classList.add('visible');
                }
            } catch(err) {
                errEl.textContent = 'Ошибка сети';
                errEl.classList.add('visible');
            }
            btn.disabled = false;
            btn.textContent = 'Создать аккаунт';
        }

        // Telegram-вход админа
        (async function initTg() {
            let cfg = {};
            try { cfg = await (await fetch('/api/auth/tg-config')).json(); } catch(e) {}
            if (!(window.Telegram && window.Telegram.Login)) {
                const s = document.createElement('script');
                s.async = true; s.src = 'https://telegram.org/js/telegram-widget.js?22';
                document.head.appendChild(s);
            }
            function doTgAuth() {
                const errEl = document.getElementById('loginError');
                window.Telegram.Login.auth({ bot_id: cfg.bot_id, request_access: 'write' }, async function (user) {
                    if (!user) return;
                    try {
                        const resp = await fetch('/api/auth/tg-login', {
                            method: 'POST', headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify(user)
                        });
                        const d = await resp.json();
                        if (d.success) { window.location.href = '/crm'; }
                        else {
                            // Виджет Telegram кэширует аккаунт браузера — даём кнопку реального сброса
                            errEl.innerHTML = (d.error || 'Доступ запрещён') +
                                '<div style="margin-top:10px;"><button type="button" id="tgSwitchBtn" ' +
                                'style="background:#1E293B;color:#fff;border:none;border-radius:8px;padding:9px 14px;' +
                                'font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;">' +
                                '🔄 Войти с другого Telegram</button></div>';
                            errEl.classList.add('visible');
                            document.getElementById('tgSwitchBtn').addEventListener('click', switchTgAccount);
                        }
                    } catch (e) { errEl.textContent = 'Ошибка сети'; errEl.classList.add('visible'); }
                });
            }
            // Сброс кэшированной сессии Telegram-виджета → повторный вход с вводом номера
            function switchTgAccount() {
                const w = window.open(
                    'https://oauth.telegram.org/auth/logOut?bot_id=' + encodeURIComponent(cfg.bot_id) +
                    '&origin=' + encodeURIComponent(location.origin),
                    'tg_logout', 'width=360,height=120');
                setTimeout(function () {
                    try { if (w) w.close(); } catch (e) {}
                    doTgAuth();  // теперь Telegram спросит номер заново
                }, 1500);
            }
            const btn = document.getElementById('tgLoginBtn');
            if (btn) btn.addEventListener('click', function () {
                const errEl = document.getElementById('loginError');
                errEl.classList.remove('visible');
                if (!cfg.bot_id || !(window.Telegram && window.Telegram.Login)) {
                    errEl.textContent = 'Загрузка Telegram… нажмите ещё раз';
                    errEl.classList.add('visible'); return;
                }
                doTgAuth();
            });
            const tgl = document.getElementById('pwToggle');
            if (tgl) tgl.addEventListener('click', function (e) {
                e.preventDefault();
                const f = document.getElementById('pwForm');
                f.style.display = f.style.display === 'none' ? 'block' : 'none';
            });
        })();
    </script>
</body>
</html>
