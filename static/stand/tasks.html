/* До конвертации от суммы отнимается 0,3 % + 40 ₽, но это НЕ одна статья.
   Настоящий валютный контроль — 0,1 % + 40 ₽, это расход. Ещё 0,2 % мы оставляем
   на рублёвом счёте — в прибыль сделки они не идут и здесь не считаются.
   Формула проверена на двух сделках: 141 405,13 и 474 292,27 → −0,3 % −40. */
const BROKER_FEE={ctrl:0.1,fix:40,ours:0.2};
function brokerSend(rub,fee){
  const c=(fee&&fee.ctrl!=null?fee.ctrl:BROKER_FEE.ctrl);
  const f=(fee&&fee.fix!=null?fee.fix:BROKER_FEE.fix);
  const o=(fee&&fee.ours!=null?fee.ours:BROKER_FEE.ours);
  const ctrl=Math.round((rub*c/100+f)*100)/100;   // валютный контроль — уходит наружу
  const ours=Math.round(rub*o/100*100)/100;        // остаётся у нас на счёте
  const sent=Math.round((rub-ctrl-ours)*100)/100;
  return {sent:sent, held:Math.round((ctrl+ours)*100)/100, ctrl:ctrl, ours:ours,
          pct:Math.round((c+o)*100)/100, ctrlPct:c, oursPct:o, fix:f};
}
function brokerSentAmount(d,total){
  if(d.brokerSentOverride==null)return brokerSend(total);
  const sent=brokerSentParse(d.brokerSentOverride);
  if(sent==null)return {sent:NaN,held:NaN,manual:true};
  return {sent,held:Math.round((total-sent)*100)/100,manual:true};
}
function brokerPlanShares(weights,sent,rate){
  // План в целых центах: последний источник забирает остаток, как incoming_shares.
  const cents=Math.round(sent/rate*100);
  if(!Number.isSafeInteger(cents)||cents<=0)return [];
  const rub=weights.map(w=>BigInt(Math.round(Number(w)*100)));
  const total=rub.reduce((a,b)=>a+b,0n);
  if(total<=0n)return [];
  let used=0n;
  return rub.map((weight,i)=>{
    const part=i===rub.length-1?BigInt(cents)-used:BigInt(cents)*weight/total;
    used+=part;return Number(part)/100;
  });
}

  const amount=Number(value);

}

   и остаётся за ним. Поэтому при заведении новой сделки реферер подставляется сам. */
function refOfClient(clientId,source,sourceRef){
  const prev=S.deals.filter(d=>d.refId&&((clientId!=null&&d.clientId===clientId)||(source&&sourceRef&&d.source===source&&d.sourceRef===sourceRef)));
  return prev.length?prev[0].refId:null;
}

/* Агенты сделки. Справочник даёт значения по умолчанию, но ставка, модель и уровень

/* serverPayouts (опционально) — ответ /api/stand/crm-preview в порядке уровней: {agents:[{payout_usdt}]}.

      <select class="fc" onchange="agentSet('${ctx}',${d.id},${i},'refId',this.value)">
        <option value="">— выбрать агента —</option>
        ${refs().map(r=>`<option value="${r.id}"${String(a.refId)===String(r.id)?' selected':''}>${r.name} · ${r.code}</option>`).join('')}
      </select>
      <button class="btn btn-outline btn-sm" onclick="agentDel('${ctx}',${d.id},${i})">Убрать</button>

      <span class="agpay">${payOf(i)!=null?moneyKop(payOf(i),'USDT'):'…'}</span>

    return sig?`<div class="alert a-warn" style="margin:0"><div>Агентов нет, но след есть: <b>${sig.r.name}</b> — ${sig.why}. Если это его клиент, добавьте агентом.</div>

  ${list.length?`<p style="font-size:13px;margin-top:8px">${serverPayouts?'':`Агентам всего: <b>${moneyKop(total,'USDT')}</b> · чистая наша: <b class="pos">${moneyKop(E.net!=null?E.net:0,'USDT')}</b> · `}

/* Отметки «пришёл сам» больше нет: отсутствие агента и следа само означает это.

function dAgentAdd(){const D=S.draft;D.agents=D.agents||[];
  const flat=(D.agentsMode==='flat');
  D.agents.push({refId:null,name:'',tier:flat?1:(D.agents.length?D.agents.reduce((m,a)=>Math.max(m,a.tier||1),0)+1:1),

function dAgentSet(i,k,v){
  const a=S.draft.agents[i];

    if(r){a.name=r.name;if(!a.touched){a.comp=r.comp;a.percent=r.percent;a.fixed=r.comp==='fixed'?r.percent:0;}}}
  else {a[k]=(k==='comp')?v:Number(String(v).replace(',','.'))||0;a.touched=true;}
  syncRef(S.draft);save();render();
}

function agentAdd(ctx,id){const d=deal(id);d.agents=d.agents||[];
  const flat=(d.agentsMode==='flat');

function agentTier(ctx,id,i,dir){const d=deal(id);const a=d.agents[i];

function agentSet(ctx,id,i,k,v){

  if(k==='refId'){a.refId=refIdNorm(v);const r=refById(a.refId);

function refAgents(d,gross,payin,crypto){
  const lost=d.closed&&d.closeReason!=='Успешно завершена';
  const list=(d.agents||[]).slice().sort((a,b)=>(a.tier||1)-(b.tier||1));
  let prevPay=null;
  return list.map(a=>{
    const tier=a.tier||1;
    /* markup — от объёма, crypto_share — от той части прибыли, что осталась в крипте,
       остальное — от прибыли. Уровень выше первого считается от выплаты предыдущего:
       это доля с чужого вознаграждения, а не вторая доля с той же прибыли. */
    const base=a.comp==='markup'?payin
      :(a.comp==='crypto_share'?(crypto!=null?crypto:gross)
      :(tier>1&&prevPay!=null?prevPay:gross));
    let pay=a.comp==='fixed'?(+a.fixed||0):Math.max(0,base*((+a.percent||0)/100));
    if(lost)pay=0;
    prevPay=pay;
    return {refId:a.refId,name:a.name,level:tier,tier:tier,type:a.comp,
      value:a.comp==='fixed'?a.fixed:a.percent,payout:pay,paid:!!a.paid,paidAt:a.paidAt||'',
      lost:lost,base:a.comp==='fixed'?'фикс':(a.comp==='markup'?'объём'
        :(a.comp==='crypto_share'?'прибыль в крипте':(tier>1?'выплата ур.'+(tier-1):'прибыль')))};
  });
}
/* После удаления агента уровни не должны начинаться с двойки: сдвигаем так,
   чтобы первый был первым, — иначе каскад считается от несуществующей выплаты. */
function normTiers(o){
  const list=o.agents||[]; if(!list.length)return;
  const min=Math.min(...list.map(a=>a.tier||1));
  if(min>1) list.forEach(a=>{a.tier=(a.tier||1)-min+1;});
}
/* Реферер сделки — не отдельное поле, а первый её агент. Два места разъезжались:
   агентов убрали, реферер висел (Карим, 22.09). В старой CRM поле одно — агенты. */
function syncRef(o){
  const list=(o.agents||[]).slice().sort((a,b)=>(a.tier||1)-(b.tier||1));
  const first=list.find(a=>a.refId);
  if(first){
    o.refKnown=true;
    if(o.refId!==first.refId){
      o.refId=first.refId;
      if(!(o.refSrc||'').startsWith('ссылка')) o.refSrc='агент 1-го уровня';
    }
  }else{
    o.refId=null;
    if((o.refSrc||'').startsWith('ссылка')) o.refSrc=null;
    if(o.selfCame){o.refKnown=true;o.refSrc='подтверждено: реферала нет';}
    else {o.refKnown=false;if(o.refSrc==='подтверждено: реферала нет')o.refSrc=null;}
  }
}
const COMPS=[['revshare','% от прибыли'],['markup','Наценка к курсу (% от объёма)'],
  ['fixed','Фикс USDT'],['crypto_share','% от прибыли в крипте (MF Corp)']];
function compOpts(cur){return COMPS.map(([k,t])=>`<option value="${k}"${cur===k?' selected':''}>${t}</option>`).join('');}
/* Пресеты как в старой CRM: каскадом — каждый следующий уровнем ниже и считается
   от выплаты предыдущего; в долю — все на первом уровне, все от прибыли. */
function agentsPreset(ctx,id,mode){
  const o=ctx==='draft'?S.draft:deal(id);
  o.agentsMode=mode;
  (o.agents||[]).forEach((a,i)=>{a.tier=(mode==='cascade'?i+1:1);});
  syncRef(o);save();render();
}
/* Все начисления реферера по всем сделкам — с суммой и статусом выплаты */
/* Все сделки реферера: и те, где он получил, и те, где сделка не состоялась.
   Вторые — не мусор: по ним считается его конверсия. */
function refRows(r){
  const out=[];
  S.deals.forEach(d=>{
    const a=(econ(d).agents||[]).find(x=>x.refId===r.id||x.name===r.name);
    if(a){out.push({deal:d,a:a,own:d.refId===r.id});return;}
    if(d.refId===r.id) out.push({deal:d,own:true,
      a:{name:r.name,type:r.comp,value:r.percent,payout:0,paid:false,level:1,tier:1}});
  });
  return out;
}
function refStat(r){
  const rows=refRows(r);
  const paid=rows.filter(x=>x.a.paid).reduce((s,x)=>s+(x.a.payout||0),0);
  const pend=rows.filter(x=>!x.a.paid).reduce((s,x)=>s+(x.a.payout||0),0);
  const won=rows.filter(x=>x.deal.closed&&x.deal.closeReason==='Успешно завершена').length;
  const lost=rows.filter(x=>x.deal.closed&&x.deal.closeReason!=='Успешно завершена').length;
  const live=rows.length-won-lost;
  return {deals:rows.length,won:won,lost:lost,live:live,
    conv:(won+lost)?Math.round(won/(won+lost)*100):null,
    clients:new Set(rows.map(x=>x.deal.client)).size,
    earned:paid+pend,paid:paid,pending:pend,rows:rows};
}

function refPay(id){
  const r=refs().find(x=>x.id===id); if(!r)return;
  const st=refStat(r);
  if(st.pending<=0){toast('Нечего выплачивать');return;}
  if(!confirm('Выплатить '+r.name+' '+usd(st.pending)+'?'))return;
  const today=new Date().toLocaleDateString('ru-RU');
  refRows(r).forEach(x=>{ if(!x.a.paid&&x.a.payout>0){
    const src=(x.deal.agents||[]).find(y=>y.refId===r.id||y.name===r.name);
    if(src){src.paid=true;src.paidAt=today;}
    log(x.deal,'Выплата агенту '+r.name+(x.a.tier>1?' (ур.'+x.a.tier+')':'')+': '+usd(x.a.payout));
  }});
  save();render();toast('Выплачено '+usd(st.pending));

function balInit(){return {ipps:1250000,cash:480000,scb:2100000,usdt:41800};}
function bal(){ if(!S.bal)S.bal=balInit(); return S.bal; }
function balOf(src){const b=bal();return src==='coins'||src==='founder'?b.usdt:(b[src]||0);}
function balLabel(src){const s=SOURCES_PAY[src];return s.cur==='usdt'?usd(balOf(src)):money(balOf(src),'฿');}
/* Списание. Возвращает false, если не хватает — это и есть причина выбрать другой источник */
function balTake(src,thb,usdtRate){
  const b=bal(), s=SOURCES_PAY[src];
  if(s.cur==='usdt'){
    const need=usdtRate?thb/usdtRate:0;
    if(need>b.usdt) return false;
    b.usdt=Math.round((b.usdt-need)*100)/100; return need;
  }
  if(thb>(b[src]||0)) return false;
  b[src]=Math.round((b[src]||0)-thb); return thb;
}

/* Хеш — не текст, а ссылка: из карточки надо попадать в обозреватель одним кликом */
function hashLink(hash,net,amount){
  if(!hash)return '—';
  if(String(hash).startsWith('demo:'))return '<span class="src">DEMO</span> <span class="addr">'+htmlText(hash)+'</span>';
  const n=(net||'TRC20').toUpperCase();
  return `${amount!=null?`<b class="pos">+${usd(amount)}</b> `:''}<span class="net">${n}</span> `+
    `<a class="hash" href="${explorer(hash,n)}" target="_blank" rel="noopener">${hash}</a> `+
    `<span class="cp" title="Скопировать" onclick="event.stopPropagation();copyHash('${hash}')">📋</span>`;
}
/* Все хеши прихода, а не первый: приход бывает частями, в т. ч. тестовым переводом,
   и по одному хешу происхождение денег не сверить (аудит 27.09 №18, Карим, 27.09) */

    (String(t.hash).startsWith('demo:')&&t.amount!=null?' <b class="pos">+'+usd(t.amount)+'</b>':'')).join('<br>');
}
/* Хеш крупно и целиком — для шага «Известить Coins», где хеш и есть главная задача,

/* Суммы с копейками: money() покажет «1 697 252,8» — один знак читается как обрезанный.
   Там, где копейки существенны (что реально уходит брокеру), печатаем оба. */
/* проценты печатаем по-русски: 0,1 % — точка в числе читается как опечатка */
function pct(v){return String(v).replace('.',',')+' %';}
function moneyKop(v,c){return (v==null||v==='')?'—':Number(v).toLocaleString('ru-RU',
  {minimumFractionDigits:2,maximumFractionDigits:2})+(c?' '+c:'');}
function usd(v){return v==null?'—':'$'+Number(v).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});}
/* Пара курсов в журнале: запятая вместо точки (The Tabular Money Rule), и без
   «/ —», когда второго курса ещё нет — пустое значение с разделителем не показываем. */
function ratePair(rub,usdtThb){
  const fmt=v=>(v==null||v==='')?null:String(v).replace('.',',');
  const a=fmt(rub),b=fmt(usdtThb);
  if(a&&b) return a+' / '+b;
  return a||b||'—';
}
/* строка таблицы «поле — значение»; пустые значения не рисуем */

/* этапы по порядку. Номера шагов (4,5,6,8,11…) — строки доски Section 8,
   поэтому идут не подряд; человеку нужен понятный прогресс «N из M». */
/* Рублёвый путь проходит через конвертацию: рубли клиента надо превратить в USDT.
   В крипте USDT уже пришли — конвертировать нечего, шаг 18 из пути выпадает. */
/* Шага «запрос курса» в пути больше нет: запрос уходит в момент создания заявки.
   Он остаётся только у сделок, заведённых до этой правки. */
const FLOW_RUB =['s5','s6','s8','s11','s12','s14','s15','s18','s18w','s22','s23','s24','s25','s26','s27'];
/* Крипта: конвертации у брокера нет, но решение «что делаем с USDT» есть — без него
   Coins не назначен, отправлять нечего, и путь вставал на подписи с нулём переводов
   (прогон крипто-лизхолда 25.09). */
const FLOW_USDT=['s5','s6','s8','s11','s12','s14','s15','s22','s23','s24','s25','s26','s27'];
const FLOW_ALIAS={s11b:'s11',s14m:'s14'};
function flowOf(d){
  if(d.prepay)return d.prepay.flow||FLOW_RUB.filter(s=>s!=='s15'&&s!=='s25'&&(!d.selfRate||s!=='s5'));
  let F=(isCrypto(d)||d.cashPartnerUsdt)?FLOW_USDT:FLOW_RUB;
  /* Реквизиты — параллельная задача менеджера, а не шаг пути: деньги пришли —
     операционист сразу конвертирует (Карим, 25.09). s15 остаётся только у сделок,
     которые уже стоят на нём. */
  if(d.step!=='s15') F=F.filter(s=>s!=='s15');
  if(d.step==='s4') F=['s4'].concat(F);      /* старые сделки, заведённые до правки */
  if(d.selfRate) F=F.filter(s=>s!=='s5');
  /* Крипто-фрихолд: внешнего курса нет вообще — «Ответить курс» и «Расчёт клиенту»
     не нужны, путь начинается с документов (спека 28.09, п.4). */
  if(isCrypto(d)&&d.kind==='Фрихолд') F=F.filter(s=>s!=='s5'&&s!=='s6');
  /* Баты уже на счёте компании или в кассе — отправлять USDT и собирать подписи не за чем.
     Но только пока решение по USDT не принято: источник выплаты проставляется на шаге
     оплаты, и без этой оговорки путь задним числом укорачивался — «14 из 15» превращалось
     в «13 из 13» уже после подписей (поймано на прогоне лизхолда 23.09). */
  const src=d.paySrc&&SOURCES_PAY[d.paySrc];
  if(src&&!src.conv&&!d.postConv) F=F.filter(s=>s!=='s24'&&s!=='s25');
  /* деньги остаются на кошельке — платежа с него нет, подписывать нечего */
  if(d.postConv==='keep') F=F.filter(s=>s!=='s23'&&s!=='s24'&&s!=='s25');
  /* личный кошелёк: владелец отправляет сам, вторая подпись не нужна. Это решает
     выбор кошелька, а не решение по USDT — поэтому шаг уходит из пути сразу. */
  if(dealWallet(d)&&!needsSecondSign(d)) F=F.filter(s=>s!=='s24');
  /* По фрихолду заявку в IPPS согласуют до исходящего перевода, не после него. */
  if(d.postConv&&d.postConv!=='coins'&&d.postConv!=='ipps_swift') F=F.filter(s=>s!=='s25');
  /* У фрихолда заявку согласуют и поручают исходящий перевод до s23; после
     подтверждения сети сразу ждут MT103 на s26 — заявка второй раз не уходит. */
  if(d.kind==='Фрихолд') F=F.filter(s=>s!=='s25');
  return F;
}
/* Курс бывает публичным: USDT→THB видно в стакане Bitazza, и менеджер знает его сам.
   Спрашивать операциониста в таком случае — лишний хоп ради цифры, которая уже есть. */
function rateKnown(d){
  if(d.type==='Обмен валюты') return true;      // обменный курс менеджер видит сам
  return false;                                  // недвижимость: курс у Coins под объём
}
function progress(d){
  if(d.prepay){const F=flowOf(d);return {i:Math.min(F.length,F.filter(s=>prepayStepDone(d,s)).length+1),n:F.length};}
  const F=flowOf(d), i=F.indexOf(FLOW_ALIAS[d.step]||d.step);
  return {i:i<0?0:i+1,n:F.length};
}

function log(d,text){
  const entry={ts:now(),at:Date.now(),role:S.role,text};
  if(standMeId)entry.by=employeeName(standMeId)||undefined;
  d.log.push(entry);

function logWhen(entry){
  /* at — абсолютная эпоха (мс), показываем в поясе смотрящего через Date();
     ts — текст без эпохи у старых записей, оставляем как записали тогда */
  const stamp=typeof entry.at==='number'?entry.at:Date.parse(entry.at||'');
  if(Number.isFinite(stamp)&&stamp>0)
    return new Date(stamp).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  if(typeof entry.ts==='string'&&/^\d{2}\.\d{2},? \d{2}:\d{2}$/.test(entry.ts))
    return entry.ts.replace(/^(\d{2}\.\d{2}) (\d{2}:\d{2})$/,'$1, $2');
  const parsed=Date.parse(entry.ts||'');
  return Number.isFinite(parsed)&&parsed>0
    ?new Date(parsed).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})
    :'время неизвестно';
}
function logMeta(entry){
  const author=entry.role?(ROLES[entry.role]?.n||'Сотрудник'):'Система';
  return htmlText((entry.role?'от ':'')+author+' · '+logWhen(entry)+' · '+(entry.text||''));
}
/* сколько прошло между событиями — «сколько простояли на этом статусе» */
function dur(ms){
  if(ms==null||ms<0)return '';
  const m=Math.round(ms/60000);
  if(m<1)return 'меньше минуты';
  if(m<60)return m+' мин';
  const h=Math.floor(m/60),r=m%60;
  if(h<24)return h+' ч'+(r?' '+r+' мин':'');
  return Math.floor(h/24)+' дн '+(h%24)+' ч';
}
/* Задача и сделка — разные сущности. Задачу заводят на запрос: её ведут по шагам,
   пока не ясно, состоится ли что-то. Как только пошли деньги — приход на счёт — из
   задачи вырабатывается сделка и попадает в реестр (Карим, 22.09). Сделку можно
   завести и напрямую, минуя задачи: так работает CRM сегодня. */
const DEAL_FROM='s14';                       // шаг, с которого задача становится сделкой
function taskToDeal(d,step){
  if(!d.isTask) return;
  const F=flowOf(d), i=F.indexOf(step), j=F.indexOf(DEAL_FROM);
  if(i<0||j<0||i<j) return;
  d.isTask=false;
  log(d,'Задача стала сделкой — деньги пошли, карточка попала в реестр');
}
function go(d,step,text,persist=true){
  if(d.prepay&&(step==='s18w'||step==='s22')){
    d.prepay.brokerStep=step==='s18w'?'s18w':'done';
    log(d,text);
    if(step==='s22')log(d,'USDT брокера получены — сервер сверит кошельки для возмещения оплаты IPPS');
    if(persist)save();render();return;
  }
  const prev=S.role;
  draftsClear(d.id);
  taskToDeal(d,step);
  d.step=step;
  /* Фрихолд в задачнике — маршрут USDT один: IPPS SWIFT, без выбора (спека 28.09,
     п.7 и §2 «s22»). Назначение проставляем сразу на входе в шаг, чтобы «Что делаем
     с USDT» не блокировалось пустым выбором и не предлагало Coins/оставить/вернуть,
     которые к фрихолду не относятся. */
  if(step==='s22'&&d.kind==='Фрихолд'&&!d.postConv)d.postConv='ipps_swift';
  log(d,text||('→ '+(STEPS[step]?STEPS[step].title:step)));
  const to=stepWho(d,step);
  if(to&&to!==prev){
    S.modal={id:d.id,step:step,to:to};
    /* Работа ушла другому человеку — он про это узнает, только если сказать.
       Уведомление тут одно на переход: сервер разошлёт его в Телеграм. */
    const note=noteAdd(to,'Задача на вас: '+(STEPS[step]?STEPS[step].title:step),d.id);
    S.modal.noteId=note.id;S.modal.delivery='pending';
  }
  /* Прямо перед оплатой (s26) или отправкой заявки в IPPS для фрихолда (s25) —
     отдельная задача менеджеру: подтвердить, что реквизиты не устарели (Карим, T34 п.3). */
  if(needsPayConfirm(d)) noteAdd('manager','Подтвердите реквизиты перед оплатой',d.id);
  if(persist)save(); render();
}
/* Деньги пришли — дальше две задачи сразу: операционист конвертирует (s18 у рублей,
   s22 у крипты), менеджер вносит реквизиты получателя. Реквизиты нужны только на
   оплате инвойса (s26) — там и ждём (Карим, 25.09: «параллельно, не последовательно»). */
/* Оплата идёт штатными шагами, конвертация сохраняет независимый курсор.
   Старые сделки без prepay продолжают линейный путь. */
function prepayCanStart(d){
  return !!d&&!d.prepay&&!d.closed&&d.type==='Оплата недвижимости'&&d.kind==='Фрихолд'
    &&!isCrypto(d)&&['s18','s18w'].includes(d.step)
    &&(d.payinParts||[]).some(p=>Number(p.amountRub)>0)
    &&!(d.pay||{}).usdt&&!((convOf(d)||{}).txs||[]).some(t=>t.status==='confirmed');
}
function prepayStepDone(d,s){
  if(d.closed)return true;
  if(s==='s18')return d.prepay.brokerStep!=='s18';
  if(s==='s18w')return d.prepay.brokerStep==='done';
  const P=['s22','s23','s24','s26','s27'];
  if(!P.includes(s))return true;
  if(s==='s24'&&!d.prepay.wallet.multisig)return true;
  return P.indexOf(s)<P.indexOf(d.step);
}
function prepayRefundRole(d){
  if(!d.prepay||!d.serverTransferComplete
      ||d.prepay.brokerStep!=='done'||d.payout?.reimbursement)return null;
  const w=walletById(convOf(d)?.walletId);
  if(w?.addr===d.prepay.wallet.addr)return null;
  return w?.multisig?'findir':(w?.role||'teodor');
}
function prepayCloseReason(d){
  if(!d.prepay)return '';
  const txs=convOf(d)?.txs||[];
  if(d.prepay.brokerStep!=='done'||!txs.length||!txs.every(t=>t.status==='confirmed'))
    return 'Ждём закрытия конвертации и прихода USDT от брокера';
  if(!d.payout?.reimbursement)return 'Ждём возмещения оплаты на кошелёк IPPS';
  return '';
}

  if(step==='s23'&&d){const w=dealWallet(d); if(w&&!w.multisig) return w.role||'teodor';}

function taskBranchesForRole(d,role){

  const policyConfirm=d.step==='s24'&&policyWallet?.purpose;
  const ownsPayment=!!STEPS[d.step]&&((!policySend&&!policyConfirm&&stepWho(d)===role)||
    (policySend&&((policyInitiators(policyWallet).includes(role)&&
      (!d.transferClaim||String(d.transferClaim.byId)===String(standMeId)))||
      (!d.transferClaim&&policyNeedsApproval(d,policyWallet)&&
       !d.transferOwnerApproval&&policyApprovalActor(role))))||
    (policyConfirm&&(policyWallet.confirmer_roles||[]).includes(role)&&
      String(d.transferClaim?.byId)!==String(standMeId)));
  const sidePayment=(role==='manager'&&(reqOpen(d)||needsPayConfirm(d)))||
    (role==='operator'&&d.step==='s27'&&d.type==='Оплата недвижимости')||
    (role==='operator'&&d.step==='s14'&&(d.manualBankReceipt?.status==='pending'||(!d.manualBankReceipt&&!rubApiAccount(d))));

function ownerDate(value,withTime=false){
  if(!value)return '';
  const raw=String(value);
  const iso=raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(iso&&!withTime)return iso[3]+'.'+iso[2];
  if(/^\d{2}\.\d{2}/.test(raw))return withTime?raw.slice(0,16):raw.slice(0,5);
  const date=new Date(value);
  if(Number.isNaN(date.getTime()))return '';
  return date.toLocaleString('ru-RU',{timeZone:'Europe/Moscow',day:'2-digit',month:'2-digit',
    ...(withTime?{hour:'2-digit',minute:'2-digit'}:{})});
}
/* До пачки используем снимок последнего выпущенного договора. У старых пакетов
   снимка нет: восстанавливаем только из сохранившихся полей и явно это подписываем. */
function ownerEstimate(d){
  if(isCrypto(d)||convOf(d))return null;
  if(d.kind!=='Фрихолд'){
    const rate=num(d.rates?.rubUsdt);
    if(!(rate>0))return null;
    const result=econ({...d,rates:{...d.rates,broker:rate}});
    if(!result.ready)return null;
    const quote=(d.quotes||[]).find(q=>num(q.rate)===rate&&(!q.dir||q.dir==='rub'));
    return {result:{profit:result.gross,pct:result.pct,incoming:result.payin,sent:result.cost},
      rate,name:quote?.name||quote?.cpId||'контрагент не сохранён',source:'оценка по котировке'};
  }
  const pack=d.docPack||{}, version=Number(d.docVersion||pack.version||0);
  const saved=d.ownerEconomyAtDoc;
  const exact=saved&&Number(saved.version)===version;
  const legacy=!exact&&pack.version&&Number(pack.version)===version;
  const params=exact?saved:legacy?{
    amountRub:pack.amount,invoiceUsd:pack.transfer||d.invoiceUsd,
    ippsTariff:d.ippsTariff,brokerRate:d.rates?.rubUsdt,at:pack.at
  }:{amountRub:d.incomeAmount||d.amountRub,invoiceUsd:d.invoiceUsd,
    ippsTariff:d.ippsTariff,brokerRate:d.rates?.rubUsdt,at:null};
  const rate=num(params.brokerRate);
  if(!(rate>0))return null;
  const quote=(d.quotes||[]).find(q=>num(q.rate)===rate&&(!q.dir||q.dir==='rub'));
  const name=exact?(params.brokerName||'контрагент не сохранён'):
    (quote?.name||quote?.cpId||'контрагент не сохранён');
  const result=freeholdEstimate({...d,invoiceUsd:num(params.invoiceUsd),
    ippsTariff:params.ippsTariff},params.amountRub,rate);
  if(result.profit==null)return null;
  const source=exact?'ориентир на момент договора от '+ownerDate(params.at):
    legacy?'ориентир по доступным данным договора от '+ownerDate(params.at):
      'оценка по котировке';
  return {result,rate,name,source,exact,legacy};
}

function accountShortLabel(account){
  const a=String(account||'');
  if(a.includes('40807810819000000261')||a.includes('…0261'))return 'Flow Sole (СГБ) …0261';
  if(a.includes('40807810938720000286')||a.includes('…0286'))return 'Сбер …0286';
  if(a.includes('…2118')||a.endsWith('2118'))return 'Сбер эквайринг …2118';
  if(a.includes('…5510')||a.endsWith('5510'))return 'Т-Банк …5510';
  const full=a.match(/\d{20}/);
  if(full)return (a.split(' · ')[0]||'Другой счёт')+' …'+full[0].slice(-4);
  return a?a:'счёт ещё нет';
}

/* Человеческие названия: технические коды полей (payin_method, ipps_swift) в тексте не показываем */
function payinHuman(d){
  if(d.payType==='По реквизитам')return d.rubReceivingAccount?.mode==='flowsole'?'Flow Sole (СГБ)':'Сбер';
  return {'СБП':'СБП','Крипта':'Крипта (USDT)','Наличные':'Наличные'}[d.payType]||d.payType||'не выбран';
}
/* Способ оплаты для строки «Получение»: счёт зачисления, если он известен из прихода, иначе — общий способ.
   Общая функция для «Итога сделки» и «Подтверждений», чтобы не показывать разные названия одного и того же. */
function payinSourceLabel(d){
  const acc=(d.payinParts||[]).map(p=>((S.incomes||[]).find(x=>String(x.id)===String(p.incId))||{}).acc).find(Boolean);
  return acc?accountShortLabel(acc):payinHuman(d);
}
function payoutHuman(d){
  if(d.kind==='Фрихолд'||d.postConv==='ipps_swift')return 'IPPS → SWIFT';
  if(d.postConv==='coins')return 'Coins';
  if(d.postConv==='client'||d.paySrc==='client')return 'кошелёк клиента';
  if(d.paySrc==='founder')return 'фаундер';
  return {cash:'касса',ipps:'IPPS',scb:'SCB'}[d.paySrc]||d.paySrc||'не выбран';
}
/* Сколько ₽ клиент заплатил и когда — из подтверждённых частей прихода, не из ожидаемой суммы */
function clientRubPaid(d){
  const parts=d.payinParts||[], extra=d.payinExtra||[];
  const sum=parts.reduce((s,p)=>s+(Number(p.amountRub)||0),0)+
    extra.reduce((s,x)=>s+(Number(x.amount_rub??x.amountRub)||0),0);
  const last=parts[parts.length-1]||{};
  const inc=(S.incomes||[]).find(x=>String(x.id)===String(last.incId))||{};
  return {rub:sum>0?sum:null,date:last.date||inc.date||null};
}
/* Доля общего перевода: зеркало split_by_payin_share (app.py): остаток округления — последней части */
function splitByPayinShare(total,partAmounts,digits=2){
  const n=partAmounts.length; if(!n)return [];
  const denom=partAmounts.reduce((s,a)=>s+(Number(a)||0),0), k=10**digits;
  const out=[]; let acc=0;
  for(let i=0;i<n-1;i++){const v=denom?Math.round(total*(Number(partAmounts[i])||0)/denom*k)/k:0;out.push(v);acc+=v;}
  out.push(Math.round((total-acc)*k)/k);
  return out;
}
/* Общий хеш прихода: доля этой сделки, если перевод записан ещё и у других сделок */
function hashShareOf(d,h){
  const holders=S.deals.filter(x=>(x.payinHashes||[]).some(y=>y.hash===h.hash));
  if(holders.length<2)return null;
  const idx=holders.findIndex(x=>x.id===d.id); if(idx<0)return null;
  const amounts=holders.map(x=>Number((x.payinHashes||[]).find(y=>y.hash===h.hash).amount)||0);
  /* Общая сумма по хешу — сумма амаунтов всех держателей, не свой же amount (иначе
     splitByPayinShare делит собственную сумму сделки на себя же и даёт долю меньше
     своей — приёмка Карима 17.10, нашёл расхождение против живой доски). */
  const of=amounts.reduce((s,a)=>s+a,0);
  return {share:splitByPayinShare(of,amounts)[idx],of:of};
}
/* Хеш в одну строку: сокращение посередине (txShort), копирование, ссылка в обозреватель */
function hashCell(d,h){
  if(!h||!h.hash)return '—';
  if(String(h.hash).startsWith('demo:'))return '<span class="src">DEMO</span> <span class="addr">'+htmlText(txShort(h.hash))+'</span>';
  const net=(h.network||'TRC20').toUpperCase(), sh=hashShareOf(d,h);
  return `<div class="sumhash"><span class="net">${htmlText(net)}</span>
    <a class="addr" href="${htmlText(explorer(h.hash,net))}" target="_blank" rel="noopener noreferrer" title="${htmlText(h.hash)}">${htmlText(txShort(h.hash))}</a>
    <button class="btn btn-outline btn-sm" onclick="copyHash(${jsLiteralAttr(h.hash)})">Копировать</button>
    ${sh?`<span class="fh">доля ${moneyKop(sh.share,'USDT')} из ${moneyKop(sh.of,'USDT')}</span>`:''}</div>`;
}
/* Прибыль и выплаты агентам — ответ /api/stand/crm-preview (те же функции, что при сохранении в CRM).
   Кэш по телу запроса: смена агента даёт новый ключ и новый запрос, без сабмита и без релоада. */
const CRM_PREVIEW={};
function crmPreviewFor(d){
  const crm=crmPayloadFinal(d), key=JSON.stringify(crm), hit=CRM_PREVIEW[key];
  if(hit)return hit;
  CRM_PREVIEW[key]={pending:true};
  fetch('/api/stand/crm-preview',{method:'POST',credentials:'same-origin',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({crm:crm})})
    .then(r=>r.json()).then(j=>{CRM_PREVIEW[key]=j.success?{data:j}:{error:j.error||'ошибка расчёта'};})
    .catch(()=>{CRM_PREVIEW[key]={error:'сервер недоступен'};})
    .finally(()=>render());
  return CRM_PREVIEW[key];
}
/* Итог сделки: три раздела, в каждой строке источник и «Поправить» */
function dealSummaryBlock(d){
  const E=econ(d), rub=!isCrypto(d), fh=d.kind==='Фрихолд', realty=d.type==='Оплата недвижимости';
  const paid=clientRubPaid(d), pv=crmPreviewFor(d), edit=`editOpen(${d.id})`, ev=crmEvidenceParts(d,true);
  const row=(label,value,src,fix)=>`<div class="sumrow"><div class="sumlab">${label}</div><div class="sumval">${value}</div>
    <div class="sumsrc">${htmlText(src)}</div>${fix?`<button class="btn btn-outline btn-sm" onclick="${fix}">Поправить</button>`:'<span></span>'}</div>`;
  const noSum='<span class="sumred">нет суммы</span>';
  /* 1. Получение */
  const inRows=[row('Способ оплаты',htmlText(payinSourceLabel(d)),'заявка',edit)];
  if(rub){
    /* Если ждали одну сумму, а подтверждённый приход — другая, не прячем расхождение,
       но и не держим жёлтый призыв к действию вечно: если в Хронологии уже есть
       объяснение (банк/комиссия/расхождение, записано сотрудником) — показываем
       нейтрально с полной причиной по наведению; иначе остаётся обычная строка
       (жёлтый баннер «Ждали... Недоплата...» — отдельно, rerateBalance, гасится
       canRerate). Приёмка Карима 17.10: сверка уже принята, баннер не должен мозолить. */
    const expected=num(expectOf(d).amount), gapNote=(()=>{
      if(paid.rub==null||!expected||Math.abs(expected-paid.rub)<1)return null;
      /* «Расхождения приняты вручную: ... Причина: ...» — точный префикс, которым s14m
         («Разберите поступление») логирует ручное принятие расхождения прихода. Не by,
         а role — автор этим действием часто не подписан по имени (видно на живых данных). */
      const hit=(d.log||[]).slice().reverse().find(l=>String(l.text||'').startsWith('Расхождения приняты вручную:'));
      if(!hit)return null;
      const reason=String(hit.text).split('Причина:')[1]?.trim()||hit.text;
      const who=hit.by||ROLES[hit.role]?.n||'сотрудник';
      return {gap:Math.round((expected-paid.rub)*100)/100,reason,who,when:logWhen(hit)};
    })();
    inRows.push(row('Клиент заплатил',paid.rub!=null
      ?(gapNote
        ?`<span title="${htmlText(gapNote.reason)}">Клиент перевёл ${moneyKop(expected,'₽')} · пришло ${moneyKop(paid.rub,'₽')} · ${gapNote.gap>0?'−':'+'}${moneyKop(Math.abs(gapNote.gap),'₽')} (расхождение принято ${htmlText(gapNote.when)}, ${htmlText(gapNote.who)})</span>`
        :`<b>${moneyKop(paid.rub,'₽')}</b>${paid.date?' · '+htmlText(paid.date):''}`)
      :noSum,'подтверждённый приход',edit));
    const c=convOf(d), rate=num((c&&c.rate)||d.rates.broker), broker=c?.broker||quoteBest(d,'rub')?.name||'брокер не записан';
    /* Клиент платит X, брокер на входе списывает свою комиссию (валютный контроль + наш
       0,2%), в обмен уходит X минус комиссия — это РАЗНЫЕ цифры, не ошибка (приёмка Карима
       17.10). Берём готовые суммы из записи конвертации (conv.sent/held/fee*), не считаем
       сами — c.held==0 для ручного режима (feeMode='manual'), тогда просто без разбивки. */
    const sentRub=c?.sent, heldRub=c?.held;
    /* Цепочка должна начинаться с ФАКТА прихода (paid.rub — он же «пришло» строкой выше),
       а не с ожидаемой суммы заявки (conv.clientRubTotal/rubTotal — это план, не факт;
       перепутал раньше, приёмка Карима 18.10). */
    inRows.push(row('Конвертация',sentRub!=null
      ?(heldRub?`<div>Пришло ${moneyKop(paid.rub,'₽')}</div>`+
          `<div>Комиссии брокера −${moneyKop(heldRub,'₽')}${c.feeMode!=='manual'?' (валютный контроль '+moneyKop(c.feeCtrl||0,'₽')+' + '+moneyKop(c.feeOurs||0,'₽')+')':''}</div>`+
          `<div><b>Отправлено брокеру ${moneyKop(sentRub,'₽')}</b> → ${moneyKop(E.payin,'USDT')} по курсу ${htmlText(String(rate).replace('.',','))} · ${htmlText(broker)}</div>`
        :`${moneyKop(sentRub,'₽')} → ${moneyKop(E.payin,'USDT')} по курсу ${htmlText(String(rate).replace('.',','))} · ${htmlText(broker)}`)
      :(paid.rub!=null&&rate&&E.payin!=null
        ?`${moneyKop(paid.rub,'₽')} → ${moneyKop(E.payin,'USDT')} по курсу ${htmlText(String(rate).replace('.',','))} · ${htmlText(broker)}<div class="fh">запись конвертации не найдена — показана сумма клиента без вычета комиссий</div>`
        :'<span class="sumred">курс или сумма не записаны</span>'),'курс брокера',edit));
  }
  inRows.push(row('USDT получено',(E.payin!=null?`<b>${moneyKop(E.payin,'USDT')}</b>`:noSum)+
    ((d.payinHashes||[]).map(h=>hashCell(d,h)).join('')||'<div class="fh">хеша прихода нет</div>')+
    (ev?`<div style="margin-top:6px">${ev.payinBtn}</div>`:''),'приход USDT · хеш',edit));
  /* 2. Оплата */
  const po=d.payout||{}, payHashes=(fh||realty)?mfList(d).map(t=>({hash:t.hash,network:t.net,amount:t.amount})):(po.hashes||[]);
  const receipt=filesOf(d,'receipt')[0];
  const outRows=[row('Способ',htmlText(payoutHuman(d)),'выдача',edit)];
  if(d.prepay){
    /* Жёлтый баннер «Оплата наперёд...» живёт, пока конвертация не завершена (goalCard).
       Когда conv.status==='received' — факт уже история, не предупреждение: нейтральная
       строка с датами вместо жёлтого баннера (приёмка Карима 17.10). */
    /* d.prepay.startedAt — ISO с сервера; conv.receivedAt — уже готовая строка «ДД.ММ, ЧЧ:ММ»
       (пишет её now(), как и остальные ts в логе) — не парсим её через new Date(). */
    const pc=convOf(d), started=d.prepay.startedAt?new Date(d.prepay.startedAt).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit'}):null;
    const received=pc&&pc.status==='received'&&pc.receivedAt?String(pc.receivedAt).split(',')[0].trim():null;
    if(started)outRows.push(row('Оплата наперёд',
      received?`Оплачено наперёд ${started} · конвертация завершена ${received}`:`Оплачено наперёд ${started} · конвертация ещё не завершена`,
      'параллельная оплата',null));
  }
  outRows.push(row('Отправлено',fh
      ?(d.invoiceUsd!=null?`<b>${usd(d.invoiceUsd)}</b> застройщику · тариф ${htmlText(ippsTariff(d).label)}`:noSum)
      :realty?(d.amountThb!=null?`<b>${money(d.amountThb,'฿')}</b> инвойс${d.companyPct!=null?' · комиссия '+d.companyPct+' %':''}`:noSum)
      :money(po.thb||d.amountThb,'฿'),fh?'инвойс застройщика':'выдача',edit));
  outRows.push(row('USDT списано',E.cost!=null?`<b>${moneyKop(E.cost,'USDT')}</b>`:noSum,'себестоимость выдачи',edit));
  outRows.push(row('Хеш выплаты',(payHashes.length?payHashes.map(h=>hashCell(d,h)).join(''):'<span class="fh">хеша выплаты нет</span>')+
    (ev?`<div style="margin-top:6px">${ev.payoutBtn}</div>`:''),'перевод в сети',edit));
  outRows.push(row('Инвойс и чек',htmlText((d.payTo||{}).inv||d.invNo||'номер не указан')+' · '+(receipt?'чек: '+htmlText(receipt.file):'чека нет')+
    (ev&&ev.receiptBtn?`<div style="margin-top:6px">${ev.receiptBtn}</div>`:''),'оплата инвойса',edit));
  if(ev&&(ev.warnings||ev.resendBtn))outRows.push(row('Проверка',ev.warnings+ev.resendBtn,'перед закрытием',null));
  /* 3. Агент и прибыль — переиспользуем agentsBlock (тот же редактор, что в editOpen),
     не рисуем свою вёрстку. Выплаты — серверные (pv.data.agents), не client-side econ(). */
  const list=d.agents||[];
  let profit='<span class="fh">считаем по формуле CRM…</span>';
  if(pv&&pv.error)profit=`<span class="sumred">не посчитать: ${htmlText(pv.error)}</span>`;
  else if(pv&&pv.data){const p=pv.data;
    profit=`<b>${moneyKop(p.profit_usdt,'USDT')}</b> (${Number(p.profit_percent||0).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})} %)`+
      (list.length?` · после агентов ${moneyKop(p.net_profit_usdt,'USDT')}`:'');}
  const agSec=agentsBlock(d,'s27',pv&&pv.data?pv.data.agents:null);
  return `<div class="sumsec"><div class="sumtitle">Получение</div>${inRows.join('')}</div>
    <div class="sumsec"><div class="sumtitle">Оплата</div>${outRows.join('')}</div>
    <div class="sumsec"><div class="sumtitle">Агент и прибыль</div>
      ${row('Прибыль',profit,'формула CRM, считает сервер',null)}${agSec}</div>`;
}
/* Сводка владельца читает только сохранённые факты сделки и готовую экономику.
   Неизвестное значение не подменяем расчётом или данными другой сделки. */
function ownerSummary(d){
  const safe=v=>htmlText(v==null||v===''?'ещё нет':v);

  const item=(label,value)=>`<div><b>${label}:</b> ${safe(value)}</div>`;

    const a=String(account||''), b=String(bank||'').toLowerCase();

    if(a.includes('40807810938720000286'))return 'Сбер …0286 · '+a;
    if(a.endsWith('2118')&&b.includes('сбер'))return 'Сбер эквайринг …2118 · '+a;
    if(a.endsWith('5510')&&b.includes('т-банк'))return 'Т-Банк …5510 · '+a;
    return account||null;

  const link=(hash,network)=>hash&&String(hash).startsWith('demo:')?safe(hash):hash?`<a href="${htmlText(explorer(hash,network||'TRC20'))}" target="_blank" rel="noopener noreferrer">${safe(hash)}</a>`:'ещё нет';

  const c=convOf(d), E=c?econ({...d,rates:{...d.rates,broker:c.rate}}):econ(d);
  const estimate=ownerEstimate(d), crypto=isCrypto(d), parts=d.payinParts||[], manual=d.manualBankReceipt||{};
  const confirmationLog=(d.log||[]).slice().reverse().find(l=>
    String(l.text||'').startsWith('Оператор сверил ручной RUB приход')&&l.by);
  const reviewerFromLog=confirmationLog?.by&&
    !['operator','manager','admin','findir','teodor'].includes(String(confirmationLog.by))?
    employeeName(confirmationLog.by)||confirmationLog.by:null;
  const reviewer=employeeName(manual.confirmedBy)||reviewerFromLog||employeeName(manual.requestedBy);
  const proof=filesOf(d,'bankCreditEvidence'), checks=filesOf(d,'clientPayinReceipt');

  const received=crypto?receipts.filter(h=>h.verified).reduce((s,h)=>s+(Number(h.amount)||0),0):parts.reduce((s,p)=>{
    const income=(S.incomes||[]).find(x=>String(x.id)===String(p.incId));

  },0);
  const receiptDetails=crypto?receipts.map(h=>item('Перевод',`${h.amount!=null?usd(h.amount)+' · ':''}${h.verified?'подтверждён':'ожидает подтверждения'}`)+`<div>${link(h.hash,h.network)}</div>`).join(''):
    parts.map((p,i)=>{const income=(S.incomes||[]).find(x=>String(x.id)===String(p.incId))||{};
      const isManual=income.source==='manual_confirmed'||!!p.manualReceiptId;
      const account=income.acc||p.acc||(isManual&&manual.bank&&manual.account?manual.bank+' · '+manual.account:null);
      const review=(d.log||[]).slice().reverse().find(l=>String(l.text||'').startsWith('Приход собран из записей:'));
      const who=isManual?(reviewer||
        (manual.confirmedRole==='operator'?'операционист':'сотрудник')+' · имя недоступно'):
        (income.confirmedBy?employeeName(income.confirmedBy):review?.by);
      return `<div><b>Часть ${i+1} · ${moneyKop(p.amountRub,'₽')}</b></div>`+
        (p.demo||income.demo?'<div>DEMO запись · реальный приход не подтверждён</div>':'')+
        item('Счёт зачисления',accountLabel(account,income.bank||manual.bank))+item('Дата',isManual?manual.statementDate||p.date:p.date||income.date)+
        (p.kind==='acquiring'?item('На счёт после комиссии',p.net!=null?moneyKop(p.net,'₽'):income.rub!=null?moneyKop(income.rub,'₽'):null):'')+
        item('Плательщик',p.payer||income.payer)+item('Сверил',who)+
        (isManual?item('Сверка подтверждена',ownerDate(manual.confirmedAt,true)):'' )+
        item('Подтверждение',isManual?`выписка${manual.statementRef?' · строка '+manual.statementRef:''}`:income.source==='sber'?'поступление из API Сбера'+(income.docNumber?' · '+income.docNumber:''):null);
    }).join('');
  const receiptProof=(parts.some(p=>p.manualReceiptId)||manual.status==='confirmed')&&proof.length?`<div><b>Выписка:</b> ${proof.map((f,i)=>file('bankCreditEvidence',f,i)).join(' ')}</div>`:'';
  const checksDetail=checks.length?`<div><b>Чеки клиента (не подтверждают приход):</b> ${checks.map((f,i)=>file('clientPayinReceipt',f,i)).join(' ')}</div>`:'';
  const expected=crypto?(d.amountUsdt?usd(d.amountUsdt):'ещё нет'):(expectOf(d).amount?moneyKop(expectOf(d).amount,'₽'):'ещё нет');
  const last=parts[parts.length-1]||{}, lastIncome=(S.incomes||[]).find(x=>String(x.id)===String(last.incId))||{};
  const paidDate=ownerDate(crypto?null:last.manualReceiptId?manual.statementDate:last.date||lastIncome.date);

  const receiptValue=received?`✓ пришли${paidDate?' '+paidDate:''} · ${crypto?moneyKop(received,'USDT'):moneyKop(received,'₽')}${crypto?'':' · '+paidAccount}${proofName?' · '+proofName:''}`:`✗ не пришли · ждём ${expected}`;
  const receiptHint=received&&receipts.length>1?`${receipts.length} ${plural(receipts.length,'часть','части','частей')}`:

  if(!isCrypto(d)&&d.rubReceivingAccount)out.payTo=auto.payTo;
  // Поле показывает текст следующего выпуска; старые выпущенные файлы не меняются.
  if(cryptoFreehold)out.feeNote=cryptoFeeNote;
  if(isCrypto(d)){out.purpose='';out.payTo=payToCrypto(payinWallet(d));}
  if(isCrypto(d)&&d.kind==='Фрихолд'){
    out.amountPay=d.amountUsdt==null?'':d.amountUsdt;

  if(!isCrypto(d)&&d.kind==='Фрихолд'&&d.freeholdClientInput==='sum'){
    out.amountPay=d.amountRub;out.amountThb=d.invoiceUsd;out.rate=d.rates.client;
  }

}
/* ФИО по паспорту и имя в заявке — разные вещи: в заявке клиента пишут как удобно

function fioNorm(v){return String(v||'').toLowerCase().replace(/ё/g,'е').split(/[\s.,]+/).filter(Boolean).sort().join(' ');}
function fioHint(d){
  const F=docFields(d), ru=String(F.fio||'').trim(), en=String(F.fioLat||'').trim();
  const name=String(d.client||'').trim();
  if(!name||(!ru&&!en)) return '';
  const same=ru?fioNorm(ru)===fioNorm(name)
    :fioNorm(en)===fioNorm(lat(name))||fioNorm(en).split(' ').some(w=>w&&fioNorm(lat(name)).split(' ').includes(w));
  if(same) return '';
  return `<p class="fh" style="margin-top:10px">В заявке клиент записан как «${htmlText(name)}», в договор идёт ФИО из паспорта — ${htmlText(ru||en)}.</p>`;

/* Обязательные поля пакета — по ним подсвечивается незаполненное */

function docReq(d){

     сделки» из обязательных полей пакета убираем — его просто не с чем сравнить. */
  const base=(isCrypto(d)&&d.kind==='Фрихолд')?DOC_REQ.filter(k=>k!=='rate'):DOC_REQ;
  return base.concat(isCrypto(d)?[]:['purpose'],
    (d.type==='Оплата недвижимости'&&(d.kind==='Лизхолд'||d.kind==='Фрихолд'))?['invNo']:[]);
}

function docFieldSave(id){
  const d=deal(id), cur=docFields(d), out={}, ch=[];
  Object.keys(DOC_SRC).forEach(k=>{
    const el=document.getElementById('df_'+k); if(!el)return;

    out[k]=v;

       а в журнал уходило «Поля пакета поправлены вручную» (аудит 27.09 №22, Карим, 27.09) */
    const a=String(cur[k]==null?'':cur[k]), n=t=>{t=t.replace(/[\s\u00a0]/g,'').replace(',','.');return /^-?\d+(\.\d+)?$/.test(t)?parseFloat(t):null;};
    if(n(a)!=null&&n(v)!=null?n(a)!==n(v):a!==v) ch.push(k);

  // утверждённой фразой независимо от сохранённого исторического поля.
  if(cur.feeNote!=null)out.feeNote=cur.feeNote;

/* Скачивание пакета: PDF для подписи, DOC — когда случай нестандартный и договор
   правят руками. Свой файл заменяет сгенерированный, но сгенерированный не теряется:
   его всегда можно вернуть (Карим, 22.09). */
function docFileName(d,k,ext){
  const t={dog:'agreement',app:'appendix',bill:'invoice'}[k]||k;
  return t+'_'+String(d.code||'').replace(/\s/g,'')+'.'+ext;
}
function docDownload(id,k,ext){
  if(typeof ext==='number'||ext===undefined){
    const d=deal(id), f=filesOf(d,k)[typeof ext==='number'?ext:0];
    if(f && f.data === '__detached__') {
       const url = fileUrl(id, k, typeof ext==='number'?ext:0) + '&download=1';
       const a=document.createElement('a');
       a.href=url;a.download=f.file||'document';a.style.display='none';
       document.body.appendChild(a);a.click();a.remove();
       log(d,'Скачан файл: '+(DOCT[k]||k)+' · '+f.file);save();return;
    }
    const blob=f&&fileBlob(f);
    if(!blob){toast('Файл не загружен — скачивать нечего');return;}
    const url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url;a.download=f.file||'document';a.style.display='none';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
    log(d,'Скачан файл: '+(DOCT[k]||k)+' · '+f.file);save();return;
  }
  /* Договор, приложение и счёт — настоящие файлы генератора (или свой файл
     операциониста), лежат на сервере: /api/docs/file/<id> */
  const d=deal(id), f=docFileOf(d,k);
  if(!f){toast('Документ ещё не выпущен — операционист создаёт его на шаге «Подготовить договор»');return;}
  docFetch('/api/docs/file/'+f.docId,f.file||docFileName(d,k,'pdf'),d,'Скачан документ: '+(DOCT[k]||k)+' · '+f.file);
}
/* Текущая версия пакета: что выпустил генератор, со своими файлами поверх */
function docPackFiles(d){const p=d.docPack;if(!p)return [];return (d.docsIssued||[]).filter(x=>x.version===p.version&&!x.deletedAt);}
function docFileOf(d,k){
  const own=(d.issued||{})[k];
  if(own&&own.docId&&!own.deletedAt)return Object.assign({own:true,kind:k},own);
  return docPackFiles(d).find(x=>x.kind===k)||null;
}
function docExt(f){const m=String((f&&(f.mime||f.file))||'').toLowerCase();
  return m.includes('pdf')?'PDF':(m.includes('word')||m.endsWith('.docx')||m.endsWith('.doc'))?'DOCX':'файл';}
async function docFetch(url,name,d,text){
  try{
    const r=await fetch(url,{credentials:'same-origin'});
    if(!r.ok){let j={};try{j=await r.json();}catch(e){}toast(j.error||('Файл не отдался: '+r.status));return;}
    const blob=await r.blob(), u=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=u;a.download=name||'document';a.style.display='none';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),60000);
    if(d&&text){log(d,text);save();}

function docDownloadAll(id){

/* Выпуск пакета настоящим генератором (тем же, что в CRM). Сервер сам пишет
   в сделку список файлов и версию; сюда возвращается свежая доска. */
async function docIssue(id,F,ch,comment){
  if(!await standRequireSaved('Сохранение не завершилось — документы не выпущены'))return;
  if(STAND&&isCrypto(deal(id))&&deal(id).kind==='Фрихолд'){
    const amount=num(cleanNum(String(F.amountPay||'')));
    if(!(amount>0)){toast('Введите положительную сумму клиента, USDT');return;}
    if(deal(id).amountUsdt!==amount){
      deal(id).amountUsdt=amount;
      await standSave();
      if(!await standRequireSaved('Сумма клиента не сохранилась'))return;
    }
    const saved=(standBase?.deals||[]).find(x=>x.id===id);
    if(!saved||Number(saved.amountUsdt)!==amount){toast(standSaveError(standLastSaveResult,'Сумма клиента не сохранилась — документы не выпущены'));return;}
  }
  if(standBusy||standPush){toast('Дождитесь сохранения и повторите');return;}
  if(S.docIssuing)return;
  S.docIssuing=id;standBusy=true;render();toast('Выпускаю документы…');
  let j=null;
  try{
    const r=await fetch('/api/stand/docs/issue',{method:'POST',credentials:'same-origin',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({dealId:id,docFields:F})});
    try{j=await r.json();}catch(e){j={success:false,detail:'Сервер ответил '+r.status};}
    j.httpStatus=r.status;
    if(j.success&&j.data){standVer=j.version;standApply(j.data);}
  }catch(e){j={success:false,detail:'Сервер недоступен — документы не выпущены'};}
  finally{standBusy=false;S.docIssuing=null;}
  const d=deal(id);
  if(!d){render();return;}
  if(!j.success){
    if(j.httpStatus===409){
      if(j.data){standVer=j.version;standBase=standClone(j.data);standApply(j.data);}
      render();toast(j.detail||j.error||'Документы не выпущены');return;
    }
    d.docFields=F;d.docMiss=j.fields||[];d.docErr=j.detail||j.error||'Документы не выпущены';
    save();render();toast(d.docErr);
    const k=(j.fields||[])[0], el=k&&document.getElementById('df_'+k);
    if(el){el.scrollIntoView({block:'center'});el.focus();}
    return;}
  d.docMiss=[];d.docErr='';
  const spec=exchangeSpec(d);
  d[spec?amountField(spec.output):'amountThb']=num(cleanNum(String(F.amountThb)));d.rates.client=F.rate;
  /* объект из пакета — в карточку сделки, иначе в шапке всех шагов «не указан» */
  if(String(F.object||'').trim()) d.object=String(F.object).trim();
  const pay=num(cleanNum(String(F.amountPay)));
  if(spec)d[amountField(spec.input)]=pay;
  else if(!isCrypto(d)) d.amountRub=pay;
  d.docComment2=comment;
  if(ch.length) log(d,'Поля пакета поправлены вручную: '+ch.map(k=>DOC_LABEL[k]||k).join(', '));
  go(d,'s11b','Пакет документов создан, версия '+d.docVersion);toast('Создано — проверьте файлы');
}

/* «Заменить своим» — настоящий файл уходит на сервер и дальше идёт вместо сгенерированного.

async function issuedUploadFile(id,k,f){

  if(standBusy||standPush){toast('Дождитесь сохранения и повторите');return;}
  const fd=new FormData();fd.append('dealId',id);fd.append('kind',k);fd.append('file',f);
  standBusy=true;
  try{
    const r=await fetch('/api/stand/docs/upload',{method:'POST',credentials:'same-origin',body:fd});
    const j=await r.json().catch(()=>({success:false,error:'Сервер ответил '+r.status}));
    if(j.success&&j.data){standVer=j.version;standApply(j.data);render();toast('Файл загружен — дальше пойдёт он');}
    else toast(j.error||'Файл не загружен');
  }catch(e){toast('Сервер недоступен — файл не загружен');}

}
function issuedUpload(id,k){

/* Мелкие обмены, проведённые без шагов, стоят в общей очереди и ждут ближайшей

function pendingEx(exceptId){
  const taken={};
  S.deals.forEach(d=>{if(d.id!==exceptId)(d.conv||[]).forEach(x=>taken[x]=1);});
  /* Крипта конвертации не требует: USDT клиента уже у нас. В рублёвой пачке она
     шла с 0 ₽, а её баты попадали в «должны выдать» (прогон 24.09). */
  return S.deals.filter(x=>!x.closed&&x.step==='ready'&&!isCrypto(x)&&x.id!==exceptId&&!taken[x.id]);
}

function s18DateKey(value){
  const v=String(value||'').trim();
  let m=v.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m)return m[1]+'-'+m[2]+'-'+m[3];
  m=v.match(/^(\d{2})\.(\d{2})\.(\d{4})/);
  return m?m[3]+'-'+m[2]+'-'+m[1]:'';
}
function s18DateLabel(value){
  const v=String(value||'').trim(), key=s18DateKey(v);
  if(!key)return v||'дата не указана';
  const time=v.match(/(?:T|\s)(\d{2}:\d{2})/);
  return key.slice(8,10)+'.'+key.slice(5,7)+(time?', '+time[1]:'');
}

function s18Sber(d){

  const parts=d.payinParts||[];
  return !!parts.length&&parts.every(p=>incomes().some(i=>String(i.id)===String(p.incId)&&i.source==='sber'));
}
function s18AccountIdentity(key){
  // Только точные настроенные реквизиты; одинаковый банк не означает один счёт.
  const aliases={['bank:'+FLOWSOLE.bik+':'+FLOWSOLE.acc]:'flow_sole'};
  aliases['bank:'+MF.bik+':'+MF.acc]='sber';
  return aliases[key]||key;
}
function s18AccountKey(d){
  const parts=d?.payinParts||[];
  if(!parts.length)return null;
  const receipt=d.manualBankReceipt||{}, target=d.rubReceivingAccount||{};
  const confirmed=receipt.status==='confirmed'&&receipt.confirmedAt&&receipt.confirmedBy;
  const account=String((confirmed?receipt.account:target.account)||'').replace(/\D/g,'');
  const bik=String((confirmed?receipt.bankBik:target.bik)||'').replace(/\D/g,'');
  const fallback=account.length===20&&bik.length===9?'bank:'+bik+':'+account:null;
  const keys=parts.map(p=>{const i=incomes().find(x=>String(x.id)===String(p.incId));
    if(!i)return null;
    if(i.source==='sber')return s18AccountIdentity(i.accountKey||'sber')==='sber'?'sber':null;
    if(i.accountKey&&fallback&&s18AccountIdentity(i.accountKey)!==s18AccountIdentity(fallback)&&
       i.accountKey!=='other:'+account)return null;
    return s18AccountIdentity(fallback||i.accountKey)||null;
  });
  return keys[0]&&keys.every(k=>k===keys[0])?keys[0]:null;
}
function s18AccountLabel(key){return key==='sber'?'Сбер':key==='flow_sole'?'Flow Sole':
  key?.startsWith('other:')?'Другой счёт · '+key.slice(6):
  key?.startsWith('bank:')?'Банковский счёт · ••••'+key.slice(-4):'Счёт не указан';}
function s18Rub(d){
  const parts=d.payinParts||[];
  if(!parts.length)return Number(d.incomeAmount||d.amountRub||0);
  return Math.round(parts.reduce((sum,p)=>{
    const inc=incomes().find(i=>String(i.id)===String(p.incId));
    const gross=Number(inc?.grossRub||inc?.rub||0);
    return sum+(inc?.source==='sber'&&gross?Number(p.amountRub)*Number(inc.rub)/gross:Number(p.amountRub));
  },0)*100)/100;
}
function s18CrmUnavailable(d){
  const members=[d].concat((d.conv||[]).map(deal).filter(Boolean));
  return members.some(x=>x.manualBankReceipt?.status==='confirmed'&&(x.payinParts||[]).some(p=>
    !String(p.incId).startsWith('sber:')&&!p.crmIncomeId))?
    'Ручной приход ещё не связан с общим реестром. Добавить поступления CRM можно после сверки связи. Эти рубли можно отправить отдельной пачкой.':'';
}
function s18CrmRows(d){

}

function rubBatchReady(x){
  const rub=Number(x.incomeAmount||x.amountRub);
  if(!Number.isFinite(rub)||rub<=0)return false;
  const parts=x.payinParts||[];
  if(!parts.length)return false;
  const ids=new Set();let total=0;
  for(const p of parts){
    const i=incomes().find(v=>String(v.id)===String(p.incId));
    const manual=x.manualBankReceipt;
    const manualOk=i&&i.source==='manual_confirmed'&&manual?.status==='confirmed'&&manual.confirmedAt&&manual.confirmedBy&&i.manualReceiptId===manual.id&&Number(p.amountRub)===Number(manual.actualAmount);
    if(!i||ids.has(String(p.incId))||i.dealId!==x.id||i.excluded||
      !(i.source==='sber'||i.demo===true||manualOk)||Number(p.amountRub)!==Number(i.grossRub||i.rub))return false;
    ids.add(String(p.incId));total+=Number(p.amountRub);
  }
  return Math.round(total*100)===Math.round(rub*100);
}

function tgPayBlock(d,step){

  return `<div class="paybox">
    <div class="chtitle" style="margin-bottom:8px">Договор готов — можно отправлять
      <span>скопируйте и вставьте клиенту</span></div>

    </div>`).join('')}
    <div class="row" style="margin-top:10px">
      <button class="btn btn-secondary btn-sm" onclick="copyAsk(${jsLiteralAttr(all)})">Скопировать всё одним текстом</button>

}
function notificationDeliveryText(m){
  if(!m)return '';
  const delivery=m.delivery, admin=m.adminDelivery, to=m.to;
  const recipient=to==='operator'?'операционисту':to==='manager'?'менеджеру':'адресату задачи';
  if(delivery==='sent'){
    if(to!=='admin'&&admin==='failed')return 'Уведомление доставлено '+recipient+'; Telegram не подтвердил администраторскую копию.';
    if(to!=='admin'&&admin==='suppressed')return 'Уведомление доставлено '+recipient+'; администраторская копия не отправлялась.';
    return 'Уведомление доставлено '+recipient+'.';
  }
  if(to==='operator'&&delivery==='suppressed'&&admin==='sent')
    return 'Задача сохранена. Уведомление получил администратор; Настя увидит задачу в задачнике.';
  if(to==='operator'&&delivery==='failed'&&admin==='sent')
    return 'Задача сохранена. Telegram не подтвердил отправку Насте; уведомление получил администратор.';
  if(delivery==='suppressed'&&admin==='sent')
    return 'Задача сохранена. Уведомление получил администратор; адресат увидит задачу в задачнике.';
  if(delivery==='failed'&&admin==='sent')
    return 'Задача сохранена. Telegram не подтвердил отправку '+recipient+'; уведомление получил администратор.';
  if(delivery==='failed'&&admin==='failed')
    return 'Задача сохранена, но Telegram не подтвердил отправку ни адресату задачи, ни администратору.';
  if(delivery==='failed'&&admin==='suppressed')
    return 'Задача сохранена. Telegram не подтвердил отправку '+recipient+'; администраторская копия не отправлялась.';
  if(delivery==='suppressed'&&admin==='failed')
    return 'Задача сохранена. Telegram не подтвердил отправку администраторской копии; адресату задачи уведомление не отправлено.';
  if(delivery==='suppressed'&&admin==='suppressed')
    return 'Задача сохранена; Telegram не отправлял уведомления адресату и администратору.';
  if(delivery==='failed')return 'Задача сохранена; Telegram не подтвердил отправку уведомления '+recipient+'.';
  if(delivery==='suppressed')return 'Задача сохранена; Telegram не отправил уведомление '+recipient+'.';
  if(delivery==='save_failed')return 'Задача не сохранена; Telegram не вызывался.';
  if(delivery==='unknown')return 'Задача сохранена; статус доставки Telegram не подтверждён.';
  return 'Сохраняем задачу и проверяем доставку…';
}

function srcManualBlock(D){

function srcAfterClient(D){
  if(D.source==='none') return '';
  /* pickOther открывает селектор клиента, но само по себе не означает
     несовпадение. Предупреждаем только о явно выбранном вручную клиенте. */
  if(!D.clientManual) return '';
  const c=D.clientId?clientById(D.clientId):null;
  const tg=c&&c.tg?c.tg:null;
  if(D.clientManual&&D.sourceRef&&tg&&D.sourceRef===tg) return '';
  const who=c?c.name:'новый клиент';
  return `<div class="alert a-warn" style="margin-top:12px"><div>

      ? 'Клиент выбран вручную'+(D.sourceRef?', а чат остался прежний — <b>'+htmlText(D.sourceRef)+'</b>':', чат не выбран')+'. Укажите, откуда пишет '+htmlText(who)+': '+(tg?'в карточке записан <b>'+htmlText(tg)+'</b>':'в карточке чата нет — выберите из списка выше или впишите вручную')+'.'
      : 'Меняете клиента'+(D.sourceRef?' — чат <b>'+htmlText(D.sourceRef)+'</b> остался от прежнего':'')+'. Выберите клиента ниже, а здесь укажите, из какого чата он пишет: из списка или вручную.'}
  </div>${tg?`<button class="btn btn-outline btn-sm" style="margin-left:auto;align-self:center;white-space:nowrap"
      onclick="draftTakeChat(${htmlText(JSON.stringify(tg))})">Взять из карточки</button>`:''}</div>`;
}
/* Чат из карточки клиента может быть из любого канала — подставляем вместе с каналом,
   иначе номер WhatsApp окажется записан как телеграм. */

function getChatObj(src, v) {
  if(!v) return null;
  const all=src==='tg'?TG_CHATS:src==='wa'?WA_CHATS:src==='bitrix'?BX_DEALS:[];
  return all.find(c => c.key === v || c.id === v) || all.find(c => c.name === v);
}
function isKnownRef(src, v) {
  const bareRef = String(v||'').includes(':') ? String(v).split(':').slice(1).join(':') : v;
  return getChatObj(src, v) !== null || (bareRef !== v && getChatObj(src, bareRef) !== null);
}

function draftTakeChat(v){
  const D=S.draft;
  D.source=(isKnownRef('wa', v))?'wa':(isKnownRef('bitrix', v))?'bitrix':(isKnownRef('tg', v))?'tg':D.source;
  const selected=getChatObj(D.source,v);
  D.bitrixCloseProof=D.source==='bitrix'&&selected?selected.close_proof||null:null;
  D.sourceRef=v;D.q='';D.srcEdit=false;D.srcPrev=null;D.srefOther=!(isKnownRef('tg', v)||isKnownRef('wa', v)||isKnownRef('bitrix', v));
  save();render();toast('Источник: '+SOURCES[D.source]+' · '+v);
}
function draftSrefManual(){
  const D=S.draft, v=(D.srefManualV||'').trim();

function draftSrcEdit(){
  const D=S.draft;
  /* запоминаем прежний источник: передумал менять — вернём одной кнопкой */
  D.srcPrev={source:D.source,sourceRef:D.sourceRef,srefOther:!!D.srefOther,
    bitrixCloseProof:D.bitrixCloseProof||null,
    clientId:D.clientId,client:D.client,clientManual:!!D.clientManual,
    refId:D.refId,refKnown:!!D.refKnown,refSrc:D.refSrc,agents:(D.agents||[]).map(x=>Object.assign({},x))};
  D.srcEdit=true;save();render();
}
function draftSrcCancel(){
  const D=S.draft, p=D.srcPrev;
  if(!p){D.srcEdit=false;save();render();return;}
  Object.assign(D,{source:p.source,sourceRef:p.sourceRef,srefOther:p.srefOther,
    bitrixCloseProof:p.bitrixCloseProof||null,
    clientId:p.clientId,client:p.client,clientManual:p.clientManual,
    refId:p.refId,refKnown:p.refKnown,refSrc:p.refSrc,agents:(p.agents||[]).map(x=>Object.assign({},x))});
  D.srcEdit=false;D.srcPrev=null;D.q='';D.srefManual=false;D.pickOther=false;
  save();render();toast('Источник оставили как был');
}

function draftResolve(){

  if(D.cur==='fhusd'){
    const thb=D.invoiceCurrency==='thb';
    return {invoiceUsd:v,amountThb:null,amountRub:null,amountUsdt:D.payType==='Крипта'?planned:null,curBase:'fhusd',
      ippsTariff:D.ippsTariff||'bank',
      invoiceCurrency:D.invoiceCurrency||'usd',
      invoiceThb:thb?parseFlexibleAmount(D.invoiceThbAmount):null,
      invoiceUsdEstimate:thb?!!D.invoiceUsdEstimate:false,
      fxBank:thb?(D.fxBank||null):null,fxRate:thb?(D.fxRate||null):null,fxAt:thb?(D.fxAt||null):null};
  }
  if(D.cur==='thb') return {amountThb:v,amountRub:null,amountUsdt:null,curBase:'thb'};
  if(D.cur==='usd'||D.cur==='usdt')return {amountUsdt:v,amountThb:null,amountRub:null,curBase:'usdt'};
  return {amountRub:v,amountThb:null,amountUsdt:null,curBase:'rub'};
}
/* Заявка сразу уходит операционисту: отдельный шаг «нажми, чтобы отправить запрос»
   ничего не добавлял — менеджер уже всё указал в форме (Карим, 23.09). */
function createGo(){
  if(!draftValid())return;const D=S.draft;ensureClient(D);
  D.isOld=D.clientId?!!(clientById(D.clientId)||{}).docs:false;
  /* Крипто-фрихолд: сумма клиента задана явно; внешнего курса нет.
     Путь начинается со сбора документов у менеджера. */
  const cryptoFreehold=D.type==='Оплата недвижимости'&&D.kind==='Фрихолд'&&D.payType==='Крипта';
  /* Одним сохранением: иначе первый PUT ставит сделку на шаг операциониста s5,
     а второй (комментарий, лог, уведомление) сервер отклоняет как правку чужого
     шага — и операционист не получал уведомления о новой задаче. */
  const d=newDeal({...D,step:cryptoFreehold?'s8':'s5',isTask:true,...draftAmounts(D),noSave:true});
  d.comment=(D.note||'').trim();
  if(cryptoFreehold){
    log(d,'Крипто-фрихолд — курса не спрашиваем, сразу к сбору документов'+(d.comment?' · '+d.comment:''));
    S.draft=null;S.open=d.id;S.view='task';save();render();
    toast('Заявка создана — соберите документы');
    return;
  }
  log(d,'Запрос курса ушёл операционисту'+(d.comment?' · '+d.comment:''));
  /* Первая задача приходила молча: go() тут не вызывается, сделка сразу рождается
     на шаге операциониста. Без этого человек узнавал о работе, только открыв доску. */
  noteAdd('operator','Задача на вас: '+(STEPS['s5']?STEPS['s5'].title:'Ответить курс')+
    ' · '+(d.client||'')+(d.comment?' · '+d.comment:''),d.id);
  /* менеджеру показываем карточку: задача уже не его, ему важно видеть саму сделку */
  S.draft=null;S.open=d.id;S.view='deal';save();render();
  toast('Заявка создана — курс запрашивает операционист');
}
/* Менеджер знает курс — сделка сразу на нём, задача операционисту не создаётся */
async function createSelf(){
  if(!draftValid())return;const D=S.draft;ensureClient(D);
  D.isOld=D.clientId?!!(clientById(D.clientId)||{}).docs:knownBy(D.source,D.sourceRef).some(x=>x.client===D.client);
  /* крипто-фрихолд: курса нет вообще, «сам» здесь означает то же, что и обычная
     заявка — сразу к документам (спека 28.09, п.4) */
  if(D.type==='Оплата недвижимости'&&D.kind==='Фрихолд'&&D.payType==='Крипта'){
    const d=newDeal({...D,step:'s8',isTask:true,...draftAmounts(D)});
    log(d,'Крипто-фрихолд — курса не спрашиваем, сразу к сбору документов');
    S.draft=null;S.open=d.id;S.view='task';save();render();
    toast('Заявка создана — соберите документы');
    return;
  }
  /* Сразу на s6 без курсов сервер отклонял (нет rates/selfRate) — к моменту
     первого PUT (внутри newDeal) d.self ещё не стоял. Черновик уже сбрасывался
     в UI, а сервер откатывал к previous без новой сделки → «Сделка не найдена»
     (баг TG #516). Заводим на s4 (как и запрос операционисту) с self:true —
     курс вводится в уже существующей форме s4, на s6 уходим только после
     selfRate() с проверенными курсами, одним подтверждённым PUT. */
  D.createError=null;
  const d=newDeal({...D,step:'s4',isTask:true,...draftAmounts(D),noSave:true});
  d.self=true;
  log(d,'Курс менеджер ставит сам — заявка не уходит операционисту');
  save();render();
  /* Черновик закрываем и уходим на карточку только после подтверждённого PUT:
     отказ сервера (409/сеть) не должен оставлять «осиротевшую» сделку в S.deals
     и показывать «Сделка не найдена» — откатываем создание и показываем
     причину прямо в форме черновика (Карим, проверка после правки s4). */
  if(STAND){
    let saved;
    try{saved=await standWaitSaved();}catch(e){saved={ok:false,error:'timeout'};}
    if(!saved.ok||!deal(d.id)){
      S.deals=S.deals.filter(x=>x.id!==d.id);
      D.createError=standSaveError(saved,'Сервер не подтвердил создание задачи — повторите');
      render();
      return;
    }
  }
  S.draft=null;S.open=d.id;S.view='task';
  /* Сервер уже подтвердил ровно этот снимок — второй PUT с теми же данными
     избыточен (QA по commit bbf2ffc, п.1): S.draft/S.open/S.view — локальные
     поля, которых нет в STAND_SHARED. Без STAND сохраняем как раньше, в localStorage. */
  if(STAND)render();else{save();render();}
  toast('Укажите курс выбранной пары — заявка не уходит операционисту');
}

function createClosed(){

  const r=prompt('Причина закрытия:\n'+CLOSE_REASONS.map((x,i)=>(i+1)+'. '+x).join('\n'),'1');
  if(!r)return;const reason=CLOSE_REASONS[Number(r)-1]||CLOSE_REASONS[0];

function dealTaskPath(d,branch){
  let steps=flowOf(d);
  if(d.prepay)steps=steps.filter(k=>branch==='conversion'?['s18','s18w'].includes(k):
    ['s22','s23','s24','s26','s27'].includes(k));
  const refundPending=d.prepay&&branch==='conversion'&&!!prepayRefundRole(d);
  if(refundPending)steps.push('refund');
  const active=refundPending?'refund':d.prepay&&branch==='conversion'?d.prepay.brokerStep:d.step;
  const index=steps.indexOf(FLOW_ALIAS[active]||active);
  return {steps,active,index:index<0?Math.max(0,steps.length-1):index,
    done:d.prepay&&branch==='conversion'&&active==='done'};
}
function dealTaskPathCard(d,branch){
  const path=dealTaskPath(d,branch);
  const wallet=dealWallet(d);
  return `<div class="card side deal-path"><h4>Путь сделки</h4><ol>${path.steps.map((k,i)=>
    `<li class="${i<path.index||path.done?'done':i===path.index?'current':'next'}"><span class="path-dot"></span>
      <div><b>${htmlText(k==='refund'?'Возместить оплату':STEPS[k]?.title||k)}</b><small>${i===path.index&&!path.done?'Сейчас · ':''}${htmlText(wallet?.purpose&&k==='s23'?policyRoleNames(policyInitiators(wallet)):
        wallet?.purpose&&k==='s24'?policyRoleNames(wallet.confirmer_roles):
        k==='refund'?(ROLES[prepayRefundRole(d)]||{}).t:(ROLES[stepWho(d,k)]||{}).t||'')}</small></div></li>`).join('')}</ol></div>`;
}
function taskBranchSet(branch){S.taskBranch=branch;S.view='task';saveUi();render();}
function prepayBranchAssignee(d,branch){
  const role=branch==='conversion'?(prepayRefundRole(d)||'operator'):stepWho(d);
  const assigned=STAND_EMPLOYEES.find(e=>String(e.id)===String(d.assigneeAdminId)&&
    (e.role===role||(branch==='payment'&&e.role==='admin')));

  if(role==='manager'&&d.manager)return d.manager;

function prepayBranchStatus(d,branch){
  const step=branch==='conversion'?d.prepay.brokerStep:d.step;

    step==='done'?'завершена':(STEPS[step]?.title||step).replace(/^./,s=>s.toLowerCase());
  return (branch==='conversion'?'Конвертация':'Оплата')+' — '+title+' · '+prepayBranchAssignee(d,branch);

function viewDeal(d){

  const who=stepWho(d);
  const policyWallet=dealWallet(d);
  const policySend=d.step==='s23'&&policyWallet?.purpose&&!d.outgoingReview?.requestedAt;
  const policyConfirm=d.step==='s24'&&policyWallet?.purpose;
  const mine=!d.closed&&((!policySend&&!policyConfirm&&who===S.role)||
    (S.role==='admin'&&d.step==='s27')||
    (policySend&&((policyInitiators(policyWallet).includes(S.role)&&
      (!d.transferClaim||String(d.transferClaim.byId)===String(standMeId)))||

      else if(current==='done')body='<div class="card">Конвертация завершена: USDT брокера получены.</div>';

/* Карточка сделки: всё, что о ней известно, одним экраном. Задача — только строкой,
   чтобы открыть её отдельно: сделка живёт дольше, чем текущий шаг. */
/* Строка конвертации в Pay-In — та же, что в рабочей карточке: пачка, брокер, курс, USDT */
function cnvRow(d){
  if(isCrypto(d)||d.type!=='Оплата недвижимости'&&!d.amountRub) return '';
  if(isCrypto(d)) return '';
  const c=convOf(d);
  if(!c) return `<p style="margin-top:10px"><b>Конвертация:</b> <span style="color:#B45309">${icoWait()}ждёт конвертации</span>
    <span style="color:var(--text-muted);font-size:12.5px">— рубли на счёте, брокер ещё не выбран</span></p>`;
  const mine=c.sources.find(x=>x.dealId===d.id)||{};
  return `<p style="margin-top:10px"><b>Конвертация:</b>
    <a href="#" onclick="cnvOpen(${c.id});return false">${htmlText(c.name)}</a> · ${c.broker} · курс ${c.rate} ·
    <b class="pos">${usd(mine.usdtFact!=null?mine.usdtFact:mine.usdt)}</b>
    <span style="color:var(--text-muted);font-size:12.5px">${mine.usdtFact!=null?'· по хэшу':'· ожидание по курсу'}${c.sources.length>1?` · пачка из ${c.sources.length} приходов`:''}</span></p>`;
}

      ${(d.payout&&d.payout.invoice)?row('Оплата инвойса',money(d.payout.invoice.thb,'฿')+' · '+d.payout.invoice.source+(d.payout.invoice.to?' → '+d.payout.invoice.to:'')):''}
    </table>
    ${(d.payout&&d.payout.noConversion)?`<p style="font-size:13px;color:#B45309;margin-top:8px">Выдано своими батами — конвертации не было, хеша выдачи нет</p>`:''}
    ${(d.payout&&d.payout.reimbursement)?`<div class="box box-green">
      <b>Возмещение:</b> #${d.payout.reimbursement.id} ✅ ${d.payout.reimbursement.kind||''}${d.payout.reimbursement.usdt?' · '+usd(d.payout.reimbursement.usdt):''}
      ${d.payout.reimbursement.hash?`<br><b>Хэш возмещения:</b> ${hashLink(d.payout.reimbursement.hash,'TRC20')}`:''}</div>`:
      ((d.paySrc==='founder'||(d.payout&&d.payout.source==='из своих (фаундер)'))?`<div class="box box-amber">Платили с кошелька фаундера — пока не возмещено, прибыль по сделке не финальная.</div>`:'')}`}
  </div>`}

  ${(!d.refId&&refSignal(d))?(function(){const sig=refSignal(d);return `<div class="card" style="margin-bottom:16px">
    <div class="sec fin">АГЕНТ НЕ УКАЗАН, НО СЛЕД ЕСТЬ</div>
    <div class="alert a-warn" style="margin:0"><div>Похоже, клиента привёл <b>${sig.r.name}</b> — ${sig.why}. Агентом он не добавлен, поэтому начисления по сделке нет.</div>
      <button class="btn btn-outline btn-sm" style="margin-left:auto;align-self:center;white-space:nowrap" onclick="editOpen(${d.id})">Добавить агента</button></div>
    <p style="font-size:12px;color:var(--text-muted);margin-top:10px">Указать можно и после закрытия: партнёр часто заявляет клиента задним числом. На успешной сделке начисление появится сразу.</p>
  </div>`;})():''}
  ${!E.ready&&d.refId&&d.closed&&d.closeReason!=='Успешно завершена'?`<div class="card" style="margin-bottom:16px">
    <div class="sec fin">РЕФЕРАЛ</div>
    <div class="alert a-warn" style="margin:0"><div>Привёл <b>${(refById(d.refId)||{}).name}</b>, но сделка закрыта: «${d.closeReason}».
      Начисления нет — платить не с чего. В статистике реферера она считается приведённой и потерянной, это его конверсия.</div></div>
  </div>`:''}
  ${E.ready?`<div class="card" style="margin-bottom:16px">
    <div class="sec fin">Финансы</div>
    <p style="font-size:14px">Валовая прибыль: <b class="big-num pos">${usd(E.gross)}</b> <span style="color:var(--text-sec)">(${E.pct.toFixed(1)}%)</span></p>
    <p style="font-size:12.5px;color:var(--text-muted);margin-top:4px">${[
      'в крипте '+usd(E.crypto),
      E.feeThb?'в компании '+money(E.feeThb,'฿')+' ('+usd(E.feeUsd)+')':''
    ].filter(Boolean).join(' · ')}${d.kind==='Фрихолд'?' · после расходов на перевод':''}</p>
    ${E.agents.length?`<div class="box box-amber">
      ${E.agents.map(a=>`<div>Партнёр: <b>${a.name}</b> <span style="opacity:.7">ур.${a.level||1}</span> ·
        <b style="color:${a.type==='markup'?'#7C3AED':(a.type==='fixed'?'#0F766E':(a.type==='l2'?'#B45309':'#2563EB'))}">${
          a.type==='l2'?('2-й уровень '+a.value+'% через '+(a.via||'')):
          (a.type==='markup'?'markup +'+a.value+'%':(a.type==='fixed'?'fixed $'+a.value:'revshare '+a.value+'%'))}</b> ·
        <b style="color:#D97706">−${usd(a.payout)}</b> ${a.paid?`<span class="pos">✓ выплачено ${a.paidAt||''}</span>`:`<span class="neg">• не выплачено</span>`}</div>`).join('')}
      ${E.agents.length>1?`<div style="margin-top:6px">Итого партнёрам: <b>−${usd(E.agentsTotal)}</b></div>`:''}</div>`:''}

    ${E.pockets==='два'?`<p style="font-size:12.5px;color:var(--green-darker);margin-top:4px">= ${money(E.feeThb,'฿')} на MF Corp + ${usd(E.crypto-E.agentsTotal)} на кошельке</p>`:''}
    ${d.notes?`<p style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border-light);font-size:13.5px"><b>Заметки:</b> ${d.notes}</p>`:''}
  </div>`:`<div class="card" style="margin-bottom:16px"><div class="sec fin">Финансы</div>
    <div class="alert a-info" style="margin:0"><div>${d.kind==='Фрихолд'&&isCrypto(d)
      ?'Плановый доход известен из суммы клиента и отправки в IPPS. Фактическую прибыль покажем после подтверждения прихода USDT по хешам и расходов на оплату застройщика.'
      :'Прибыль посчитается, когда будут известны '+(d.type==='Оплата недвижимости'?'курс партнёра USDT→THB и приход':'себестоимость выдачи и приход')+'. '+(isCrypto(d)?'':'Для рублёвой сделки нужен ещё курс обмена у брокера.')}</div></div></div>`}
