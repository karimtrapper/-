<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, shrink-to-fit=no">
<title>Задачник CalcCRM — кликабельный прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy-900:#0F172A; --navy-800:#1E293B; --navy-700:#334155; --navy-600:#475569;
  --navy-500:#64748B; --navy-400:#94A3B8; --navy-300:#CBD5E1; --navy-200:#E2E8F0;
  --navy-100:#F1F5F9; --navy-50:#F8FAFC;
  --coral:#C2410C; --coral-hover:#9A3412; --coral-light:#FFF7ED;
  --green:#22C55E; --green-light:#F0FDF4; --green-dark:#16A34A; --green-darker:#065F46;
  --red:#EF4444; --red-light:#FEF2F2;
  --blue:#3B82F6; --blue-light:#EFF6FF;
  --amber:#F59E0B; --amber-light:#FEF3C7;
  --indigo:#6366F1; --indigo-light:#EEF2FF;
  --bg:#FFFFFF; --bg-page:var(--navy-50);
  --text:var(--navy-900); --text-sec:var(--navy-500); --text-muted:var(--navy-400);
  --border:var(--navy-200); --border-light:var(--navy-100);
  --r:12px; --r-sm:8px; --r-lg:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg-page);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
::selection{background:var(--coral);color:#fff}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
button{font-family:inherit}

.proto{background:var(--navy-900);color:var(--navy-300);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:200}
.proto .lab{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--navy-500)}
.proto .rolebtn{background:rgba(255,255,255,.07);color:var(--navy-300);border:1px solid transparent;padding:6px 13px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer}
.proto .rolebtn:hover{background:rgba(255,255,255,.14);color:#fff}
.proto .rolebtn.on{background:var(--coral);color:#fff}
.proto .rolebtn .c{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 5px;margin-left:6px;border-radius:999px;background:rgba(0,0,0,.25);font-size:10.5px;font-weight:700}
.proto .rolebtn.on .c{background:rgba(255,255,255,.3)}
.proto .spacer{margin-left:auto}
.proto .ghost{background:none;border:1px solid var(--navy-600);color:var(--navy-400);padding:6px 13px;border-radius:var(--r-sm);font-size:12.5px;font-weight:500;cursor:pointer}
.proto .ghost:hover{color:#fff;border-color:var(--navy-400)}

.top-nav{background:var(--navy-800);padding:10px 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--navy-700)}
.top-nav a{color:var(--navy-300);text-decoration:none;padding:8px 20px;border-radius:var(--r-sm);font-weight:600;font-size:14px;white-space:nowrap}
.top-nav a.active{background:var(--coral);color:#fff}
.top-nav .who{margin-left:auto;font-size:12.5px;color:var(--navy-400);border:1px solid var(--navy-600);padding:6px 13px;border-radius:var(--r-sm);font-weight:500;white-space:nowrap}
/* На 390px шапка (3 ссылки + роль) шире экрана и уводит всю страницу вбок —
   на узких экранах переносим «роль» на вторую строку вместо горизонтального скролла (Карим, 25.09) */
@media(max-width:480px){
  .top-nav{flex-wrap:wrap;row-gap:6px;padding:8px 12px}
  .top-nav a{padding:7px 12px;font-size:13px}
  .top-nav .who{margin-left:0;flex:0 0 100%;text-align:center}
}
.nav{background:var(--bg);border-bottom:1px solid var(--border);padding:0 16px}
.nav-tabs{display:flex;gap:4px;padding:8px 0;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
.nav-tabs .nav-tab{white-space:nowrap;flex:0 0 auto}
.nav-tabs::-webkit-scrollbar{display:none}
.nav-tab{background:none;border:none;color:var(--text-sec);padding:10px 16px;border-radius:var(--r-sm);font-size:14px;font-weight:500;white-space:nowrap;cursor:pointer}
.nav-tab:hover{background:var(--navy-100);color:var(--text)}
.nav-tab.active{background:var(--navy-800);color:#fff}
.nav-tab .cnt{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 6px;margin-left:7px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:700}
.nav-tab.active .cnt{background:#fff;color:var(--red)}

.container{max-width:1240px;margin:0 auto;padding:20px 16px 90px}
/* Экран внутри раскадровки: шапка прототипа там лишняя — роль и шаг подписаны рядом с кадром */
body.screen-mode.embed .proto,body.screen-mode.embed .top-nav,body.screen-mode.embed .nav{display:none}
body.screen-mode.embed .container{padding-top:14px}
.card{background:var(--bg);border-radius:var(--r);border:1px solid var(--border-light);padding:20px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.card+.card{margin-top:14px}
/* колокольчик и список уведомлений */
.notebox{position:absolute;top:44px;right:210px;z-index:600;width:360px;max-width:calc(100vw - 24px);max-height:60vh;overflow:auto;
  background:var(--bg);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 20px 50px -18px rgba(15,23,42,.45)}
.noteh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border-light);
  font-size:12.5px;font-weight:700;color:var(--text-sec)}
.notei{padding:11px 14px;border-bottom:1px solid var(--border-light);cursor:pointer}
.notei:hover{background:var(--navy-50)}
.notei.new{background:#FFF7ED}
.notei .t{font-size:13px;color:var(--text);line-height:1.45}
.notei .s{font-size:11.5px;color:var(--text-muted);margin-top:3px}
/* на телефоне панель прижимается к краю экрана, а не к кнопке */
@media(max-width:700px){.notebox{right:12px;left:12px;width:auto;top:96px}}
/* Главные цифры пакета — сумма инвойса, курс и сумма клиенту. Их сверяют с инвойсом
   глазами, поэтому они крупнее остальных полей и стоят первыми. */
.keybox{background:linear-gradient(0deg,var(--navy-50),var(--navy-50));border:1px solid var(--border);
  border-left:3px solid var(--coral);border-radius:var(--r);padding:14px 16px;margin:16px 0 4px}
.fc.big{font-size:20px;font-weight:700;letter-spacing:-.01em;padding-top:10px;padding-bottom:10px}
@media(max-width:620px){.fc.big{font-size:18px}}
/* Хеши и ссылки — длинные неразрывные строки. Без переноса они задают ширину
   страницы, и на телефоне весь экран уезжает вбок. Таймлайн «Коротко о пути» и
   обычные (не .tbl) таблицы вроде журнала «Весь путь» раньше сюда не входили —
   адрес кошелька в тексте лога вылезал за край правой колонки (Карим, 25.09). */
.li .t1,.li .t2,.v,.tbl td,.fh,.derived,.alert,.tl .t,.tl .s,.side{overflow-wrap:anywhere}
td{overflow-wrap:anywhere}
/* «Как задачи наполняют сделку» (История сделки) — тот же паттерн, что
   Хронология (47af6a6): не таблица ни на одной ширине, а список. Раньше
   4-колоночная таблица на 768 обрезала «Что вносит в сделку» справа, а на
   375 требовала горизонтальный скролл (находки №2/№3 аудита ui-2026-10-17).
   Короткие поля (шаг, кто, статус) — caption-строка сверху через « · »,
   содержательный текст (что вносит) — ниже, во всю ширину, как в
   Хронологии на мобильном. */
.flow-list{list-style:none;margin:0 0 20px;padding:0}
.flow-item{padding:var(--ds-md) 0;border-bottom:1px solid var(--ds-border)}
.flow-item:last-child{border-bottom:0}
.flow-item-meta{display:flex;flex-wrap:wrap;align-items:baseline;gap:0;font-size:var(--ds-caption);color:var(--ds-muted)}
.flow-item-who::before{content:" · "}
.flow-item-status{margin-left:auto}
.flow-item-body{margin-top:var(--ds-xs);font-size:var(--ds-body);color:var(--ds-ink);overflow-wrap:break-word}
/* Внутренний комментарий (находка №4 аудита ui-2026-10-17): переносы строк
   как в исходном тексте, длинный текст свёрнут за «Показать полностью». */
.comment-fold-text{white-space:pre-line;overflow-wrap:break-word}
.comment-fold>summary{cursor:pointer;color:var(--text-sec);font-size:13px}
.comment-fold[open]>summary{margin-bottom:6px}
.addr{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;letter-spacing:.01em;word-break:break-all}
.li .t3 .pick{display:block;font-size:11.5px;font-weight:600;color:var(--text-muted);letter-spacing:.01em}
.li.on .t3 .pick{color:var(--green-dark)}
.card-title{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-title .sub{font-size:12.5px;font-weight:500;color:var(--text-sec)}
.cols{display:grid;grid-template-columns:1fr 310px;gap:16px;align-items:start}
.cols.cols-create-compact{grid-template-columns:minmax(0,1fr)}
.fh.create-next{font-size:12.5px;line-height:1.4;color:var(--navy-600);margin-bottom:0}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.b-new{background:var(--coral-light);color:#9A3412}
.b-work{background:var(--blue-light);color:#1E40AF}
.b-done{background:#D1FAE5;color:var(--green-darker)}
.b-wait{background:var(--navy-100);color:var(--navy-600)}
.b-pend{background:var(--amber-light);color:#92400E}
.b-lose{background:var(--red-light);color:#991B1B}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 20px;border:none;border-radius:var(--r-sm);font-size:14px;font-weight:600;min-height:48px;cursor:pointer}
.btn-primary{background:var(--coral);color:#fff}.btn-primary:hover{background:var(--coral-hover)}
.btn-success{background:var(--green);color:#fff}.btn-success:hover{background:var(--green-dark)}
.btn-secondary{background:var(--navy-100);color:var(--navy-700)}.btn-secondary:hover{background:var(--navy-200)}
.btn-outline{background:none;border:1.5px solid var(--border);color:var(--text-sec)}.btn-outline:hover{border-color:var(--navy-400);color:var(--text)}
.btn-sm{padding:8px 14px;font-size:14px;min-height:36px}
.btn-lg{padding:16px 22px;font-size:16px;min-height:56px}
/* s27: чек от операциониста — главное на шаге, поэтому крупный акцентный блок
   в самом верху карточки, а служебное (CRM-превью и т.п.) — ниже и спокойнее (Карим, 25.09) */
.checktop{border:1.5px solid var(--coral);border-radius:var(--r);padding:18px;margin-bottom:16px}
.checktop .checklab{font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--coral-hover)}
.checktop .checksum{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:4px;overflow-wrap:anywhere}
.checktop .checksum .to{font-size:15px;font-weight:600;color:var(--text-sec);margin-left:4px}
.checkfile{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  border-top:1px solid var(--border-light);padding:12px 0}
.checkfile .fname{font-size:15px;font-weight:700;overflow-wrap:anywhere}
.checkfile .fmeta{font-size:12.5px;color:var(--text-sec);margin-top:2px}
.checkfile .fops{display:flex;gap:8px;flex-wrap:wrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.fg{margin-bottom:14px}
.fl{display:block;margin-bottom:6px;font-weight:500;font-size:13px;color:var(--navy-600)}
.fl .rq{color:var(--coral);margin-left:3px}
.fc{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:15px;font-family:inherit;background:var(--bg);color:var(--text);min-height:46px}
.fc:focus{outline:none;border-color:var(--coral);box-shadow:0 0 0 3px rgba(249,115,22,.12)}
.fc[readonly]{background:var(--navy-50);color:var(--navy-600)}
.fr{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
/* поле с длинной подсказкой занимает две колонки — иначе текст встаёт лесенкой */
.fg.w2{grid-column:span 2}
@media(max-width:700px){.fg.w2{grid-column:span 1}}
textarea.fc{min-height:74px;resize:vertical;line-height:1.5}
.alert{padding:13px 15px;border-radius:var(--r-sm);font-size:13.5px;line-height:1.55;display:flex;gap:10px;margin-bottom:14px}
.a-info{background:var(--blue-light);border-left:3px solid var(--blue);color:#1E40AF}
.alert.create-neutral-info{background:var(--ds-page);border:1px solid var(--ds-border);color:var(--ds-muted)}
.a-warn{background:var(--amber-light);border-left:3px solid var(--amber);color:#92400E}
.a-ok{background:#D1FAE5;border-left:3px solid var(--green);color:var(--green-darker)}
/* Узкий класс только для D.createError (createSelf) — design-gate требует токены
   --ds-decision*, обычную 1px рамку вместо левой полосы и шкалу --ds-*, не
   перекрашивая остальные .a-warn (QA по commit 28daf43). */
.create-error-alert{background:var(--ds-decision);border:1px solid var(--ds-decision-border);
  color:var(--ds-decision-ink);border-radius:var(--ds-control);font-size:var(--ds-body);
  line-height:1.55;padding:var(--ds-sm) var(--ds-md);margin:var(--ds-sm) 0 var(--ds-md)}
.s27-close-warning{background:var(--ds-decision);border:1px solid var(--ds-decision-border);
  color:var(--ds-decision-ink);border-radius:var(--ds-control);font-size:var(--ds-body);
  padding:var(--ds-sm) var(--ds-md);margin:var(--ds-md) 0;overflow-wrap:anywhere}
.s27-fact-pending{color:var(--ds-decision-ink);white-space:normal;overflow-wrap:anywhere}
.s27-close-actions{margin-top:var(--ds-lg)}
.s27-sent-action{width:100%;margin-top:var(--ds-lg)}
.s27-sent-note{margin-top:var(--ds-lg)}
.s27-sent-hint{text-align:center;margin-top:var(--ds-sm)}

table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--navy-50);color:var(--text-sec);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;padding:10px 12px;text-align:left;border-bottom:2px solid var(--border);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--border-light);vertical-align:middle}
tr:last-child td{border-bottom:none}
.clickable{cursor:pointer}
.clickable:hover{background:var(--navy-50)}

.searchbox{display:flex;align-items:center;gap:9px;padding:0 13px;border:1.5px solid var(--border);border-radius:var(--r-sm);margin-bottom:11px;background:var(--bg)}
.searchbox:focus-within{border-color:var(--coral);box-shadow:0 0 0 3px rgba(249,115,22,.12)}
.searchbox svg{color:var(--navy-400);flex-shrink:0}
.qinp{flex:1;border:none;outline:none;padding:12px 0;font-size:15px;font-family:inherit;background:none;color:var(--text);min-width:0}
.qinp::placeholder{color:var(--navy-400)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;padding:8px 14px;border-radius:20px;font-size:13px;font-weight:600;border:1.5px solid var(--border);color:var(--navy-600);background:var(--bg);cursor:pointer}
.chip:hover{border-color:var(--navy-400)}
.chip.on{background:var(--navy-800);color:#fff;border-color:var(--navy-800)}
.chip.disabled{opacity:.45;cursor:not-allowed}
.chip.pending{background:var(--ds-decision);border-color:var(--ds-decision-border);color:var(--ds-decision-ink)}

.derived{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:11px 14px;background:var(--navy-50);border:1px solid var(--border);border-radius:var(--r-sm);font-size:13.5px;color:var(--navy-600)}
.derived svg{color:var(--navy-400);flex-shrink:0}
.derived b{color:var(--text);font-weight:600}
.comment{margin-top:16px;border:1.5px solid var(--border);border-radius:var(--r-sm);background:var(--bg);padding:12px 14px}
.comment .lbl{font-size:12px;font-weight:600;color:var(--navy-600);display:flex;align-items:center;gap:7px;margin-bottom:7px}
.comment .lbl svg{color:var(--navy-400)}
.comment .txt{font-size:13.5px;line-height:1.55;color:var(--text)}

.strip{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:13px 16px;background:var(--navy-800);color:#fff;border-radius:var(--r);margin-bottom:16px}
.strip .id{font-size:13px;font-weight:700;color:var(--coral)}
.strip .nm{font-size:14.5px;font-weight:600}
.strip .it{font-size:12.5px;color:var(--navy-300)}
.strip .it b{color:#fff;font-weight:600}
.strip .sp{width:1px;height:18px;background:var(--navy-600)}
.prog{display:inline-flex;align-items:center;gap:9px;margin-left:11px}
.prog .bar{display:block;width:96px;height:5px;border-radius:3px;background:var(--navy-600);overflow:hidden}
.prog .bar span{display:block;height:100%;background:var(--coral);border-radius:3px}
.prog .pt{font-size:12px;color:var(--navy-300);white-space:nowrap;font-variant-numeric:tabular-nums}

.list{border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden}
.s18-batch-summary{position:sticky;top:96px;z-index:30;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;
  padding:11px;margin:0 0 14px;background:#fff;border:1px solid var(--navy-200);border-radius:var(--r-sm);
  box-shadow:0 5px 18px rgba(15,23,42,.1)}
.s18-batch-summary .label{font-size:11px;color:var(--text-sec)}
.s18-batch-summary .value{font-size:15px;font-weight:750;white-space:nowrap}
.s18-filterbar{display:grid;grid-template-columns:minmax(160px,2fr) repeat(2,minmax(130px,1fr));gap:9px;margin:0 0 12px}
.s18-filterbar .fg{margin:0}.s18-filterbar .fl{font-size:11px}
.s18-section+.s18-section{border-top:2px solid var(--border)}
.s18-section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 13px;background:var(--navy-50);font-size:13px}
.s18-section-head span{font-variant-numeric:tabular-nums;color:var(--text-sec);white-space:nowrap}
.s18-section .li:last-child{border-bottom:0}.s18-empty{color:var(--text-muted);cursor:default}
.s18-show-all{display:block;margin:10px auto}
@media(max-width:760px){.s18-batch-summary{grid-template-columns:repeat(2,minmax(0,1fr));top:96px}
  .s18-batch-summary .value{font-size:13px}.s18-filterbar{grid-template-columns:1fr 1fr}.s18-filterbar .fg:first-child{grid-column:1/-1}}
.li{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;padding:11px 13px;border-bottom:1px solid var(--border-light);cursor:pointer}
.li:last-child{border-bottom:none}
.li:hover{background:var(--navy-50)}
.li.on{background:var(--coral-light);box-shadow:inset 2px 0 0 var(--coral)}
.li .av{width:34px;height:34px;border-radius:9px;background:var(--navy-200);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:var(--navy-600)}
.li.on .av{background:var(--coral);color:#fff}
.li .t1{font-size:13.5px;font-weight:600;line-height:1.3}
.li .t2{font-size:12.5px;color:var(--text-sec);margin-top:2px}
.li .t3{font-size:12.5px;color:var(--text-sec);white-space:nowrap}
/* Зона загрузки файла: строка подсвечивается, пока над ней держат файл — тот же
   вид для всех мест приёма (docRow, fileBlock, «Заменить своим») (Карим, 25.09) */
.li.drag-over{outline:2px dashed var(--coral);outline-offset:-2px;background:var(--coral-light)}
.list.drag-over{outline:2px dashed var(--coral);outline-offset:-2px;background:var(--coral-light)}

/* адрес/хеш — всегда одна строка; подпись доли переносится на следующую строку блока, а не ломает адрес.
   Цвет — токен текста, не цвет ссылки браузера по умолчанию (design-gate: #0000EE вне палитры). */

.sumhash .addr{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;color:var(--text)}
.sumagent{display:grid;grid-template-columns:minmax(0,1.6fr) 110px 90px auto;gap:8px;align-items:center;margin-top:8px}
@media(max-width:650px){
  /* Компактно: подпись+«Поправить» в одной строке сверху, значение — под ней, источник — мелким текстом.
     Было: все 4 ячейки строки в столбик — «Поправить» растягивался на всю ширину (приёмка Карима). */
  .sumrow{grid-template-columns:1fr auto;grid-template-areas:"lab fix" "val val" "src src";gap:2px 8px;padding:8px 0}
  .sumlab{grid-area:lab}
  .sumval{grid-area:val}
  .sumsrc{grid-area:src;font-size:11px}
  .sumrow>:nth-child(4){grid-area:fix;padding:3px 10px;font-size:12px;align-self:start}
  .sumagent{grid-template-columns:1fr 1fr}
  .sumagent select:first-child{grid-column:1/-1}
}

/* таблица «поле — значение» в карточке сделки */
.tbl th{background:none;text-transform:none;letter-spacing:0;font-size:13px;font-weight:500;color:var(--text-sec);
  border-bottom:1px solid var(--border-light);width:220px;vertical-align:top;white-space:normal}
.tbl td{font-size:14px;font-weight:600;color:var(--text)}
.tbl tr:last-child th,.tbl tr:last-child td{border-bottom:none}
/* контекст сделки на шаге: факты, которые иначе спрашивают в чате */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:13px 20px}
.facts .k{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:3px}
.facts .v{font-size:13.5px;font-weight:600;color:var(--text);line-height:1.35}
.facts .v small{display:block;font-size:12px;font-weight:500;color:var(--text-sec);margin-top:2px;line-height:1.4}
/* макеты документов */
.modal.wide{max-width:660px}
/* Пачка — широкая таблица: модалка должна расширяться и скроллиться,
   иначе колонка «Сделка» уезжает за край экрана вместе с кнопкой «Закрыть». */
.modal.big{max-width:1020px}
.modal.big .modal-b{max-height:72vh;overflow:auto}
.modal .tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.modal .tscroll table{min-width:640px}
.doc{background:#fff;border:1px solid var(--border);border-radius:var(--r-sm);padding:20px;max-height:58vh;overflow:auto}
.pp{background:#EEF2E9;border:1px solid #C9D3BC;border-radius:8px;padding:18px;font-family:'Courier New',monospace;color:#22301C}
.pp-h{display:flex;justify-content:space-between;gap:10px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid #C9D3BC;padding-bottom:8px;margin-bottom:14px}
.pp-b{display:grid;grid-template-columns:96px 1fr;gap:18px}
.pp-photo{height:124px;background:repeating-linear-gradient(45deg,#D9E0CD,#D9E0CD 6px,#CCD6BD 6px,#CCD6BD 12px);border:1px solid #B3BFA2;border-radius:4px;display:flex;align-items:flex-end;justify-content:center;font-size:9px;color:#5A6B4C;padding-bottom:6px}
.pp-f{font-size:12px;margin-bottom:10px}
.pp-f span{display:block;font-size:8.5px;letter-spacing:.07em;color:#63734F;text-transform:uppercase;margin-bottom:1px}
.pp-mrz{margin-top:14px;padding-top:10px;border-top:1px solid #C9D3BC;font-size:11px;letter-spacing:.08em;color:#3A4A31;word-break:break-all;line-height:1.7}
.pa{font-family:Georgia,'Times New Roman',serif;color:#1A1F2B;font-size:13px;line-height:1.7}
.pa h5{font-size:13.5px;text-align:center;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.pa .meta{text-align:center;font-size:11.5px;color:#6B7280;margin-bottom:16px}
.pa .pa-t{width:100%;border-collapse:collapse;margin:12px 0;font-size:12.5px}
.pa .pa-t td,.pa .pa-t th{border:1px solid #D8DEE7;padding:7px 9px;text-align:left;vertical-align:top}
.pa .pa-t th{background:#F4F6F9;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#556070}
.pa .sign{display:flex;justify-content:space-between;gap:16px;margin-top:20px;font-size:12px;color:#4B5563}
.stamp{display:inline-block;border:2px solid #C2410C;color:#C2410C;border-radius:6px;padding:3px 9px;font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;transform:rotate(-5deg);font-family:Inter,sans-serif}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--bg);border-radius:var(--r-lg);max-width:520px;width:100%;box-shadow:0 24px 60px -20px rgba(15,23,42,.5);overflow:hidden}
.modal-h{padding:18px 22px 0}
.modal-h .t{font-size:18px;font-weight:800;letter-spacing:-.02em}
.modal-h .s{font-size:13px;color:var(--text-sec);margin-top:5px;line-height:1.55}
.modal-b{padding:18px 22px 22px}
.tgwrap{background:#17212B;border-radius:var(--r);padding:14px;margin-top:4px}
.tgbot{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.tgbot .av{width:28px;height:28px;border-radius:50%;background:var(--coral);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.tgbot .nm{font-size:13px;font-weight:700;color:#7EC5F5}
.tgmsg{background:#232E3C;border-radius:10px;padding:12px 14px;color:#E9EDF2;font-size:13.5px;line-height:1.6}
.tgmsg b{color:#fff;font-weight:700}
.tgmsg .dim{color:#93A3B5}
.tgbtns{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.tgbtn{background:#2B3A4C;border:none;color:#7EC5F5;padding:10px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;text-align:center}
.tgbtn:hover{background:#34455A}
.tgtime{font-size:11px;color:#6A7D93;text-align:right;margin-top:6px}

.build{font-size:11px;color:var(--navy-400);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:2px 8px;margin-left:10px}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:999;background:var(--navy-700);color:#fff;padding:14px 24px;border-radius:var(--r-sm);font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.toast.error{background:#9f1239}
/* min-width:0 — иначе колонка грида не сжимается ниже своего min-content
   и страница едет вбок из-за одной широкой карточки внутри */
@media(max-width:900px){.cols{grid-template-columns:1fr}.cols>*{min-width:0}}
/* Телефон: таблица «поле — значение» встаёт в два ряда, иначе колонка th в 220px
   растягивает страницу и весь экран едет вбок. Мелкий текст и кнопки подрастают. */
@media(max-width:620px){
  .tbl tr{display:block;border-bottom:1px solid var(--border-light);padding:7px 0}
  .tbl tr:last-child{border-bottom:none}
  .tbl th,.tbl td{display:block;width:auto;border:none;padding:0 2px}
  .tbl th{font-size:12.5px;margin-bottom:2px}
  .tbl td{font-size:14px}
  table:not(.tbl):not(.pa-t){display:block;overflow-x:auto;white-space:nowrap}
  .facts .k,.payrow .k{font-size:11.5px}
  .li .t3 .pick,.hrow .net,.hrow .src{font-size:11.5px}
  .btn-sm{min-height:38px}
  .fc,.nav-tab,.vtab{min-height:40px}
  .strip{flex-wrap:wrap;row-gap:6px}
  .container{padding-left:12px;padding-right:12px}
  /* строка «поле + кнопка» на телефоне переносится, иначе распирает колонку */
  .hrow{flex-wrap:wrap}
  .hrow input:last-of-type{min-width:110px}
  .hrow .btn{flex:0 0 auto}
  /* строка списка: правая колонка уходит под текст и переносится,
     иначе кнопки «Открыть · PDF · DOC» вылезают за экран и до них не дотянуться */
  .li{grid-template-columns:34px 1fr;row-gap:8px}
  .li>:nth-child(3){grid-column:1 / -1}
  .li .t3{white-space:normal;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  /* пальцем в 33 px попадают плохо — поднимаем все кликабельные элементы */
  #app button,#app .seg,#app .chip{min-height:38px}
  /* адрес и кнопка копирования не помещаются в строку — кнопка уходит вниз */
  .payrow{flex-wrap:wrap}
  .payrow>.btn{width:100%;margin-top:6px}
}
/* ===== Телефон (Карим, 27.09): вёрстка по компонентам, а не ужатый десктоп =====
   Работают с телефона на ходу: менеджер отвечает клиенту, операционист жмёт шаг.
   Шапка — одна строка, навигация разделов — вкладками, которые прилипают к верху;
   главное действие шага — под большим пальцем внизу; модалки — листом снизу. */
.bellbtn{display:inline-flex;align-items:center;gap:6px}
.bellbtn svg{flex-shrink:0}
.bellbtn .c{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;
  border-radius:999px;background:var(--coral);color:#fff;font-size:11px;font-weight:700}
@media(max-width:700px){
  /* На телефонах flex-дети с длинным текстом не должны задавать ширину странице.
     Горизонтально прокручиваются только роли и вкладки; карточки остаются в viewport. */
  .proto,.top-nav,.nav,.container,#app,.card,.cols>*{min-width:0;max-width:100%}
  /* Два отдельных ряда не дают длинному market chip схлопнуть переключатель ролей.
     Роли занимают всю ширину и прокручиваются внутри шапки; body не расширяется. */
  .proto{position:static;width:100%;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));
    display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"roles roles" "market market" "bell build" "tools tools";
    align-items:center;gap:8px;}
  .proto .lab{display:none}
  .proto .build{grid-area:build;justify-self:end;margin:0;font-size:10.5px;padding:2px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(65vw,260px)}
  .proto #roles{grid-area:roles;display:flex;width:100%;min-width:0;gap:6px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none}
  .proto #roles::-webkit-scrollbar{display:none}
  .proto .rolebtn{flex:0 0 auto;padding:7px 12px;font-size:13px;white-space:nowrap;min-height:40px}
  .proto #market{grid-area:market;display:flex;min-width:0;width:100%;max-width:100%;overflow:hidden}
  .proto #market .chip{max-width:100%;flex-wrap:wrap;justify-content:center}
  .proto #bell{grid-area:bell;justify-self:start;min-width:0}
  .proto .spacer{display:none}
  .proto #admintools:empty{display:none}
  .proto #admintools{grid-area:tools;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
  .proto #admintools .ghost{white-space:nowrap;padding:6px 10px;font-size:12px;min-height:36px}
  .bellbtn{min-height:40px;min-width:44px;padding:6px 10px;justify-content:center}
  .bellbtn .bl{display:none}
  .notebox{position:fixed;top:auto;bottom:0;left:0;right:0;width:auto;max-width:none;max-height:72vh;
    border-radius:var(--r-lg) var(--r-lg) 0 0;padding-bottom:env(safe-area-inset-bottom)}
  /* разделы CRM: компактная полоса, прокрутка вбок, имя роли уже есть в шапке */
  .top-nav{width:100%;flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;padding:6px 12px;gap:6px}
  .top-nav::-webkit-scrollbar{display:none}
  .top-nav a{padding:7px 12px;font-size:13px}
  .top-nav .who{display:none}
  /* вкладки задачника прилипают к верху: до «Задачника» и «Сделок» — один тап
     с любого места длинной карточки. Край затухает — видно, что есть ещё. */
  .nav{position:sticky;top:0;z-index:150;width:100%;padding:0 12px;box-shadow:0 1px 0 var(--border)}
  .nav-tabs{min-width:0;padding:6px 0;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
  .nav-tab{padding:9px 13px;font-size:14px;min-height:40px}
  .container{padding:14px 12px calc(96px + env(safe-area-inset-bottom))}
  .page-h{font-size:20px}
  /* шапка сделки: код и имя первой строкой, тип — второй, прогресс во всю ширину */
  .strip{gap:4px 10px;padding:12px 14px}
  .strip .sp{display:none}
  .strip .it{flex:1 1 100%}
  .strip>span:last-child{margin-left:0!important;flex:1 1 100%;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .prog{margin-left:0;flex:1}
  .prog .bar{flex:1;width:auto}
  /* «Карточка · Текущая задача · История» — сегментный переключатель на всю ширину */
  .vtabs{flex-wrap:nowrap;gap:0;margin:-4px 0 14px;background:var(--navy-100);border-radius:10px;padding:3px}
  .vtab{flex:1 1 0;text-align:center;padding:9px 6px;font-size:13px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vtab.on{border-color:transparent}
  .vtab .lg{display:none}
  .vtab{text-transform:capitalize}
  /* «Что это за сделка»: факты в две колонки — вдвое короче, суть видна сразу */
  .facts{grid-template-columns:1fr 1fr;gap:12px 14px}
  /* карточки и цель шага плотнее: больше полезного на первом экране */
  .card{padding:16px 14px}
  .goalt{font-size:17px;margin-bottom:12px}
  .goalnums{grid-template-columns:1fr 1fr;gap:10px}
  .goalnums .v{font-size:15.5px}
  .goalnums .v.big{font-size:22px;grid-column:1 / -1}
  .goalnums>div:first-child{grid-column:1 / -1}
  .card-title{font-size:15.5px;margin-bottom:12px}
  /* поля: 16px — иначе iPhone увеличивает страницу при фокусе на поле */
  .fc,.qinp,select.fc{font-size:16px}
  .fc.big{font-size:18px}
  .fr{grid-template-columns:1fr;gap:0 12px}
  /* главное действие шага — под пальцем: ряд с основной кнопкой прилипает к низу
     экрана, пока видна его карточка; основная кнопка — во всю ширину. Только если
     ряд последний в карточке: в «Новой заявке» и на закрытии после кнопок ещё идут
     поля — прилипшая кнопка их закрывала (приёмка 27.09) */
  .card>.row:last-child:has(>.btn-primary,>.btn-success){position:sticky;bottom:0;z-index:20;margin:16px -14px -16px;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.94);
    -webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px);
    border-top:1px solid var(--border);border-radius:0 0 var(--r) var(--r)}
  /* главный ряд, под которым оставлены пояснения (Карим, 27.09): прилипает так же, но
     не последний в карточке — без отрицательного нижнего отступа и скругления */
  .card>.row.mainrow:not(:last-child):has(>.btn-primary,>.btn-success){position:sticky;bottom:0;z-index:20;margin:16px -14px 0;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.94);
    -webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px);
    border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
  .row>.btn-primary,.row>.btn-success{flex:1 1 100%}
  .row>.btn{min-height:46px}
  /* модалки — лист снизу: до кнопок дотягивается большой палец */
  .ov{align-items:flex-end;padding:0}
  .modal,.modal.wide,.modal.big{max-width:none;border-radius:var(--r-lg) var(--r-lg) 0 0;max-height:92vh;overflow:auto;
    padding-bottom:env(safe-area-inset-bottom)}
  .modal.big .modal-b{max-height:none}
  /* тост — полосой сверху во всю ширину, не обрезается по краям */
  .toast{left:12px;right:12px;transform:none;top:max(12px,env(safe-area-inset-top));text-align:center;font-size:14px}
  /* правая колонка под основной: «Коротко о пути» и документы — после работы */
  .side{padding:14px}
  .docstrip{grid-template-columns:1fr}
  /* хеши на s25: операции под хешем, кнопки крупнее */
  .hashtxt{font-size:14px;flex-basis:100%}
  .hashops{white-space:normal}
  .hashops .btn{min-height:40px}
  .coinsrow{padding:12px}
  /* «Отправить клиенту»: имя файла над кнопкой, кнопка во всю ширину */
  .payrow{flex-direction:column;align-items:stretch}
  .payrow>.btn{width:100%}
  .checktop{padding:14px}
  .checktop .checksum{font-size:22px}
  .checkfile .fops{width:100%}
  .checkfile .fops .btn{flex:1 1 0}
  .stats-grid{grid-template-columns:1fr 1fr;gap:10px}
  .stat-value{font-size:22px}
}
@media(max-width:620px) and (pointer:coarse){
  .chip{min-height:40px}
  .btn-sm{min-height:40px}
}
/* Wave 3 · deal cards. Values come from the final DESIGN.md. */
:root{
  --ds-display:22px;--ds-emphasis:16px;--ds-body:14px;--ds-caption:12px;
  --ds-regular:400;--ds-semibold:600;--ds-bold:700;
  --ds-control:8px;--ds-card:12px;--ds-pill:999px;
  --ds-xs:4px;--ds-sm:8px;--ds-md:12px;--ds-lg:16px;--ds-xl:24px;
  --ds-ink:#0F172A;--ds-muted:#475569;--ds-border:#E2E8F0;--ds-page:#F8FAFC;--ds-surface:#FFFFFF;
  --ds-glass:rgba(255,255,255,.97);
  --ds-shadow:0 1px 3px rgba(15,23,42,.05),0 1px 2px rgba(15,23,42,.04);
  --ds-decision:#FFFBEB;--ds-decision-border:#FDE68A;--ds-decision-ink:#92400E;
  --ds-blocker:#FEF2F2;--ds-blocker-border:#FECACA;--ds-blocker-ink:#991B1B;
  --ds-money:#F0FDF4;--ds-money-border:#BBF7D0;--ds-money-ink:#065F46;
}
.deal-screen{min-width:0;color:var(--ds-ink);font-size:var(--ds-body);font-weight:var(--ds-regular);
  font-feature-settings:"tnum" 1,"cv11" 1;
  --text-muted:var(--ds-muted);--text-sec:var(--ds-muted);--navy-400:var(--ds-muted);--navy-500:var(--ds-muted)}
.deal-screen *{min-width:0}
.deal-screen .cols{grid-template-columns:minmax(0,1fr) 300px;gap:var(--ds-xl)}
.deal-screen .card{border:1px solid var(--ds-border);border-radius:var(--ds-card);box-shadow:var(--ds-shadow)}
.deal-screen .deal-breadcrumb,.deal-screen .deal-code{font-size:var(--ds-caption);color:var(--ds-muted)}
.deal-screen .deal-breadcrumb{margin-bottom:var(--ds-md)}
.deal-screen .task-card-nav{display:none}
@media(max-width:700px){
  .deal-screen .task-card-nav{display:flex;align-items:center;margin-bottom:var(--ds-md)}
  .deal-screen .task-card-nav button{min-height:44px;padding:0;border:0;background:none;color:var(--navy-700);font:600 16px Inter,system-ui,sans-serif;cursor:pointer}
}
.deal-screen .deal-head{background:var(--ds-surface);border-radius:var(--ds-card);padding:var(--ds-xl);display:flex;align-items:center;justify-content:space-between;gap:var(--ds-xl);margin-bottom:var(--ds-md)}
.deal-screen .deal-head h1{font-size:var(--ds-emphasis);font-weight:var(--ds-semibold);margin:var(--ds-xs) 0}
.deal-screen .deal-head p{color:var(--ds-muted)}
.deal-screen .deal-progress{width:240px;flex:none;display:grid;gap:var(--ds-xs);font-size:var(--ds-caption)}
.deal-screen .deal-progress b{font-size:var(--ds-body);font-weight:var(--ds-semibold)}
.deal-screen .deal-progress i{height:4px;background:var(--ds-border);border-radius:var(--ds-pill);overflow:hidden}
.deal-screen .deal-progress i span{height:100%;display:block;background:var(--navy-700)}
.deal-screen .branch-tabs{display:flex;gap:var(--ds-xs);padding:var(--ds-xs);background:var(--navy-100);border-radius:var(--ds-control);margin-bottom:var(--ds-md)}
.deal-screen .branch-tabs button{flex:1;border:0;background:transparent;color:var(--ds-muted);font:var(--ds-semibold) var(--ds-body) Inter,system-ui,sans-serif;min-height:44px;padding:var(--ds-sm);border-radius:var(--ds-control);cursor:pointer}
.deal-screen .branch-tabs button.on{background:var(--ds-surface);color:var(--ds-ink)}
/* Фокус — тот же оранжевый 2px/2px, что у остальных контролов (DESIGN.md: focus ring),
   не свой navy-700 «стиль сегмента» — просто наследуется от глобального :focus-visible
   (строка 29/796) теперь, что override тут перекрывал (приёмка Карима 18.10). */
.deal-screen .branch-current{font-size:var(--ds-body);color:var(--ds-ink);margin:0 0 var(--ds-md);font-weight:var(--ds-semibold)}
.deal-screen .vtabs{margin:0 0 var(--ds-md)}
.deal-screen .vtab{border-radius:var(--ds-control);font-size:var(--ds-body);min-height:44px;display:inline-flex;align-items:center}
.deal-screen .vtab{gap:var(--ds-xs)}
.deal-screen .addr-value .btn,.deal-screen .wallet-address-line .btn{font-family:Inter,system-ui,sans-serif!important}

<script>
const KEY='grusha_proto_v2';
/* ===== Стенд: состояние общее, лежит на сервере =====
   В прототипе доска жила в localStorage — у каждого свой мирок, и проверить
   передачу работы между ролями было нечем. На стенде данные одни на всех,
   а UI-состояние (что открыто, что печатается) остаётся личным: иначе у
   коллеги на экране прыгала бы твоя карточка. */
const STAND=true;
const STAND_SHARED=['deals','convs','seq','cseq','notes','incomes','cps','cpChats',
                    'wallets','refs','clients','bal','txpool','avg','avgU','chatClientMap'];
let standVer=null, standPush=null, standBusy=false, standSaveScheduled=false, standLoadError=false,
    standClosing=false, standMe=null, standMeId=null, STAND_EMPLOYEES=[];
let standLastSaveResult={ok:true};
let standDemoEnabled=false;
function demoAllowed(){return standDemoEnabled===true;}
let sberMirrorStatus=null;
async function fetchSberMirrorStatus(){
  try{
    const r=await fetch('/api/stand/sber-mirror/status',{credentials:'same-origin'});
    if(r.ok)sberMirrorStatus=await r.json();
  }catch(e){sberMirrorStatus={enabled:true,last_error:'недоступно'};}
  if(S.view==='income'&&!standTyping())render();
}
function sberMirrorLabel(){
  const x=sberMirrorStatus;
  if(!x)return 'зеркало Сбера: проверяем';
  const assumption=' · '+(x.account_assumption||'счёт проставлен по допущению: SberNotifier следит за одним счётом');
  if(!x.enabled)return 'зеркало Сбера: выключено · ограниченное окно 300'+assumption;
  if(x.last_error||!x.last_success_at)return 'зеркало Сбера: не отвечает · ограниченное окно 300'+assumption;
  return 'зеркало Сбера: обновлено '+new Date(x.last_success_at).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+
    ' · в окне '+x.last_seen_count+', новых '+x.last_new_count+' · ограниченное окно 300'+assumption;
}
function sberText(value){return String(value||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
/* Последний снимок с сервера — база для слияния, когда доску одновременно правят
   двое. Раньше при конфликте версии своя правка молча выбрасывалась: операционист
   отправлял курс, а он пропадал (Карим, 25.09 — «приняло только с третьего раза»). */
let standBase=null;
function standClone(o){return JSON.parse(JSON.stringify(o||{}));}
function jeq(a,b){return JSON.stringify(a)===JSON.stringify(b);}
/* Слияние трёх версий: база (что видели), моя, серверная. Меняли разное — берём оба
   изменения; одно и то же — побеждает серверная, и об этом говорим. */
function standMerge(base,mine,theirs){
  const out={}, conflicts=[];
  STAND_SHARED.forEach(k=>{
    const b=base[k], m=mine[k], t=theirs[k];
    if(m===undefined&&t===undefined)return;
    if(jeq(m,b)){if(t!==undefined)out[k]=t;return;}
    if(jeq(t,b)){if(m!==undefined)out[k]=m;return;}
    const byId=a=>Array.isArray(a)&&a.every(x=>x&&typeof x==='object'&&x.id!=null);
    if(byId(m)&&byId(t)&&(b==null||byId(b))){
      const bm=new Map((b||[]).map(x=>[x.id,x])), mm=new Map(m.map(x=>[x.id,x])), tm=new Map(t.map(x=>[x.id,x]));
      const ids=[...new Set([...t.map(x=>x.id),...m.map(x=>x.id)])], arr=[], extra=[];
      ids.forEach(id=>{
        const bx=bm.get(id), mx=mm.get(id), tx=tm.get(id);
        if(jeq(mx,bx)){if(tx!==undefined)arr.push(tx);return;}
        if(jeq(tx,bx)){if(mx!==undefined)arr.push(mx);return;}
        if(jeq(mx,tx)){if(tx!==undefined)arr.push(tx);return;}
        if(k==='deals'&&bx&&mx&&tx){
          /* Независимые правки одной сделки сохраняем вместе. Денежные объекты
             (quotes, rates, transfer и др.) остаются неделимыми: конфликт любого
             поля отменяет всю локальную правку, включая переход шага. */
          const merged={}, clashes=[];
          new Set([...Object.keys(bx),...Object.keys(mx),...Object.keys(tx)]).forEach(field=>{
            const bv=bx[field],mv=mx[field],tv=tx[field];
            let value;
            if(jeq(mv,bv)||jeq(mv,tv))value=tv;
            else if(jeq(tv,bv))value=mv;
            else if(field==='rates'&&mv&&tv&&typeof mv==='object'&&typeof tv==='object'){
              /* Курс клиенту менеджера и ответ брокера операциониста — разные поля. */
              value={};
              new Set([...Object.keys(bv||{}),...Object.keys(mv),...Object.keys(tv)]).forEach(rateKey=>{
                const oldRate=(bv||{})[rateKey],mineRate=mv[rateKey],theirRate=tv[rateKey];
                if(jeq(mineRate,oldRate)||jeq(mineRate,theirRate))value[rateKey]=theirRate;
                else if(jeq(theirRate,oldRate))value[rateKey]=mineRate;
                else{value[rateKey]=theirRate;clashes.push('rates.'+rateKey);}
              });
            }
            else if(field==='log'&&Array.isArray(bv)&&Array.isArray(mv)&&Array.isArray(tv)
                &&jeq(mv.slice(0,bv.length),bv)&&jeq(tv.slice(0,bv.length),bv)){
              /* Оба сотрудника только дописали журнал; старые записи не правим. */
              value=tv.concat(mv.slice(bv.length).filter(entry=>!tv.slice(bv.length).some(x=>jeq(x,entry))));
            }else{clashes.push(field);value=tv;}
            if(value!==undefined)merged[field]=value;
          });
          if(!clashes.length){arr.push(merged);return;}
        }
        if(tx!==undefined)arr.push(tx);
        /* две новые сделки с одним номером — свою не теряем, даём следующий номер */
        if(k==='deals'&&bx===undefined&&mx&&tx) extra.push(mx);
        else conflicts.push(k+':'+id);
      });
      extra.forEach(x=>{const id=Math.max(0,...arr.map(y=>Number(y.id)||0))+1;
        arr.push(Object.assign({},x,{id:id,code:'СД-'+id}));});
      out[k]=arr;return;
    }
    if(m&&t&&typeof m==='object'&&typeof t==='object'&&!Array.isArray(m)&&!Array.isArray(t)){
      const o={};
      new Set([...Object.keys(t),...Object.keys(m)]).forEach(kk=>{
        const bb=(b||{})[kk];
        if(jeq(m[kk],bb)){if(t[kk]!==undefined)o[kk]=t[kk];}
        else if(jeq(t[kk],bb)){if(m[kk]!==undefined)o[kk]=m[kk];}
        else{o[kk]=t[kk];conflicts.push(k+'.'+kk);}
      });
      out[k]=o;return;
    }
    if(typeof m==='number'&&typeof t==='number'){out[k]=Math.max(m,t);return;}
    if(t!==undefined)out[k]=t; conflicts.push(k);
  });
  if(Array.isArray(out.deals)&&typeof out.seq==='number')
    out.seq=Math.max(out.seq,...out.deals.map(x=>Number(x.id)||0));
  return {data:out,conflicts};
}

function standSnapshot(){
  const o={}; STAND_SHARED.forEach(k=>{ if(S[k]!==undefined)o[k]=S[k]; });
  if(Array.isArray(o.incomes))o.incomes=o.incomes.map(({sel,...income})=>income);
  return o;
}
function standApply(data){
  if(!data||typeof data!=='object')return;
  /* Снимок применяем целиком, а не только присутствующие ключи. Иначе сброс
     доски (сервер отдаёт пустой объект) ничего не очищал: старые сделки
     оставались в памяти у всех открытых вкладок и возвращались первым же
     сохранением. */
  const blank=load();
  STAND_SHARED.forEach(k=>{ S[k]=(data[k]!==undefined)?data[k]:blank[k]; });
  S=migrate(S);
}
function standTyping(){
  const a=document.activeElement?.shadowRoot?.activeElement||document.activeElement;
  return !!a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT');
}
async function standPull(force){
  if(standBusy||standPush||standSaveScheduled||standClosing)return;
  const requestedVersion=standVer;
  try{
    const r=await fetch('/api/stand/state',{credentials:'same-origin'});
    if(r.status===401){location.href='/login';return;}
    if(r.status>=400)throw new Error('stand_state_unavailable');
    const j=await r.json(); if(!j.success)throw new Error('stand_state_unavailable');
    standLoadError=false;
    standDemoEnabled=j.demoEnabled===true;
    if(standBusy||standPush||standSaveScheduled||standClosing)return;
    /* GET мог начаться до PUT, а вернуться уже после его завершения. Такой
       ответ не должен откатывать ни доску, ни базу последующего слияния. */
    if(standVer!==requestedVersion||(standVer!==null&&j.version<standVer))return;
    if(j.role&&j.role!==S.role&&j.role!=='admin'){S.role=j.role;}
    if(standVer===j.version&&!force)return;
    /* клик уже начался — перерисовка заменила бы кнопку под пальцем, и нажатие
       терялось бы. Догоним на следующем тике. */
    if(!force&&(Date.now()-lastPointer<1500||brokerSentSubmitPointer))return;
    /* Пока человек печатает, чужое состояние не подставляем — иначе ввод
       затрётся на полуслове. Догоним на следующем тике. */
    if(standTyping()&&!force)return;
    standVer=j.version; standBase=standClone(j.data); standApply(j.data); render();
  }catch(e){if(standVer===null){standLoadError=true;render();}}
}
async function standSave(){
  standSaveScheduled=false;
  if(standBusy){standPush=true;standLastSaveResult={ok:false,pending:true};return;}
  standLastSaveResult={ok:false,pending:true};
  standBusy=true; standPush=false;
  try{
    const r=await fetch('/api/stand/state',{method:'PUT',credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({version:standVer,fileStorageVersion:1,data:standSnapshot()})});
    if(r.status===409){
      const j=await r.json();
      if(j.error&&j.error!=='conflict'){
        standLastSaveResult={ok:false,error:j.detail||j.error||'save_rejected'};
        if(S.modal&&S.modal.noteId)S.modal.delivery='save_failed';
        standVer=j.version; standBase=standClone(j.data); standApply(j.data);
        if(!brokerSentSubmitPointer)render();toast(j.detail||j.error);
      }else{
        /* Доску поменял коллега: сливаем его правки с нашими и досылаем */
        const mine=standSnapshot(), m=standMerge(standBase||{},mine,j.data||{});
        standVer=j.version; standBase=standClone(j.data); standApply(m.data);
        if(!standTyping()&&!brokerSentSubmitPointer)render();
        if(!jeq(m.data,j.data)) standPush=true;
        standLastSaveResult=standPush?{ok:false,pending:true}:{ok:true};
        if(m.conflicts.length) toast('Ту же сделку одновременно поменял'+(j.updated_by?' '+j.updated_by:' коллега')+' — оставил его версию, проверьте свою правку');
      }
    }else{
      const j=await r.json();
      if(j.success){
        standLastSaveResult={ok:true};
        standVer=j.version;
        if(j.data)standBase=standClone(j.data);
        if(j.data&&!standPush){standApply(j.data);if(!standTyping()&&!brokerSentSubmitPointer)render();}
        else if(j.data&&standPush){
          /* Первый PUT нового manual draft возвращает серверный originMode.
             Второй queued PUT уже содержит заполненную форму; переносим только
             эту серверную метку, не подменяя локальные поля старым снимком. */
          (j.data.deals||[]).forEach(saved=>{
            const local=(S.deals||[]).find(x=>x.id===saved.id);
            if(local&&local.manual&&saved.originMode==='manual')local.originMode='manual';
          });
          /* Время регистрации новой отправки приходит только в ответе сервера.
             Переносим его в queued PUT, сохраняя последующие действия оператора. */
          (j.data.convs||[]).forEach(saved=>{
            const local=(S.convs||[]).find(x=>x.id===saved.id);
            if(local&&Number.isSafeInteger(saved.sentRecordedTs))local.sentRecordedTs=saved.sentRecordedTs;
          });
        }
        const modal=S.modal, delivered=j.notification_delivery||[];
        if(modal&&modal.noteId){
          const serverNote=(j.data?.notes||[]).find(n=>n.dealId===modal.id&&n.role===modal.to&&String(n.id).startsWith('stand:state:'+j.version+':'));
          if(serverNote)modal.noteId=serverNote.id;
          const result=delivered.find(x=>String(x.note_id)===String(modal.noteId)&&x.role===modal.to);
          const adminResult=delivered.find(x=>String(x.note_id)===String(modal.noteId)&&x.role==='admin');
          modal.delivery=result?result.status:'unknown';
          modal.adminDelivery=adminResult?adminResult.status:'unknown';
        }
      }
      else {standLastSaveResult={ok:false,error:j.detail||j.error||'save_rejected'};if(S.modal&&S.modal.noteId)S.modal.delivery='save_failed';toast(j.detail||j.error||'Сервер не сохранил изменения');}
    }
  }catch(e){ standLastSaveResult={ok:false,error:'network'};if(S.modal&&S.modal.noteId)S.modal.delivery='save_failed';toast('Не сохранилось — проверьте связь'); }
  finally{
    standBusy=false;
    if(standPush){standPush=false;standSaveScheduled=true;standLastSaveResult={ok:false,pending:true};setTimeout(standSave,120);}
  }
}
async function standWaitSaved(){
  const deadline=Date.now()+15000;
  while(standBusy||standPush||standSaveScheduled){
    if(Date.now()>deadline)throw new Error('stand save timed out');
    await new Promise(resolve=>setTimeout(resolve,25));
  }
  return standLastSaveResult;
}
/* Сохраняем причину отказа: следующее действие не должно затирать её общим тостом. */
function standSaveError(result,fallback){
  const error=result?.detail||result?.error;
  return ({network:'Нет связи с сервером — изменения не сохранены',
    timeout:'Сервер не подтвердил сохранение за 15 секунд — обновите доску перед повтором',
    save_rejected:'Сервер отклонил сохранение',
    conflict:'Доска изменилась — обновите сделку и повторите'})[error]||error||fallback;
}
async function standRequireSaved(fallback){
  let result;
  try{result=await standWaitSaved();}catch(e){result={error:'timeout'};}
  if(result?.ok)return true;
  toast(standSaveError(result,fallback||'Изменения ещё не сохранены'));
  return false;
}
function standRollbackHandoff(id){
  const saved=(standBase&&Array.isArray(standBase.deals)?standBase.deals:[])
    .find(x=>String(x.id)===String(id));
  if(!saved)return false;
  const index=(S.deals||[]).findIndex(x=>String(x.id)===String(id));
  if(index<0)return false;
  S.deals[index]=standClone(saved);
  S.notes=standClone(Array.isArray(standBase.notes)?standBase.notes:[]);
  S.modal=null;
  render();
  return true;
}
/* Режим экранов: ?screen=<id> собирает сделку сразу на нужном шаге.
   Состояние живёт только в памяти — рабочий прототип в localStorage не трогаем. */
const SCREEN=(new URLSearchParams(location.search)).get('screen')||null;
/* Кликабельный прототип (Карим, 27.09: скриншоты читать тяжело): ?snap=walkthrough/…/NN.json
   поднимает сохранённое состояние сделки на этом шаге и рисует настоящий интерфейс.
   Нажимать можно, но всё остаётся в этой вкладке — на сервер ничего не пишется. */
const SNAP=(function(){const v=(new URLSearchParams(location.search)).get('snap')||'';
  return /^walkthrough\/[\w\-\/]+\.json$/.test(v)?v:null;})();
const ROLES={
  manager:{t:'Менеджер',n:'Елизавета'},
  operator:{t:'Операционист',n:'Настя'},
  findir:{t:'Фин дир',n:'Виталий'},
  teodor:{t:'Теодор',n:'Теодор'},
  admin:{t:'Админ',n:'Карим'}
};
let S=load();
/* Ручной перенос в CRM минуя задачник живёт только в памяти этой вкладки — на сервер
   не уходит и в STAND_SHARED не попадает (Карим, 19.10). */
if(!S.manualCloseDraft||typeof S.manualCloseDraft!=='object')S.manualCloseDraft={};
/* Черновик полей ручного переноса (хеши, которые ещё не хотим писать в саму сделку) —
   тоже только в памяти вкладки, по той же причине, что и manualCloseDraft (задача 5). */
if(!S.manualCloseForm||typeof S.manualCloseForm!=='object')S.manualCloseForm={};

function load(){
  /* На стенде стартовое состояние приходит с сервера, из браузера не читаем */
  if(!SCREEN&&!STAND){try{const r=localStorage.getItem(KEY);if(r)return migrate(JSON.parse(r));}catch(e){}}
  return {role:'manager',tab:'tasks',seq:1471,cseq:0,deals:[],convs:[],open:null,draft:null,
    modal:null,doc:null,cnv:null,avg:{v:2.6,at:Date.now()}};
}
/* сделки, созданные до появления новых полей, не должны показывать undefined */
function migrate(st){
  st.deals=(st.deals||[]).map(d=>{
    d.type=d.type||'Оплата недвижимости';
    if(d.kind===undefined) d.kind=d.type==='Оплата недвижимости'?'Лизхолд':'';
    if(d.type!=='Оплата недвижимости') d.kind='';
    if(!d.payType) d.payType='По реквизитам';
    if(!d.curBase) d.curBase=(d.amountRub&&!d.amountThb)?'rub':'thb';
    if(d.partial===undefined) d.partial=false;
    if(d.invoiceTotal===undefined) d.invoiceTotal=null;
    if(d.partNo===undefined) d.partNo='';
    if(!d.client) d.client=d.sourceRef||'Без имени';
    if(!d.source) d.source='none';
    d.rates=d.rates||{};
    d.pay=(d.pay&&typeof d.pay==='object')?d.pay:{};
    d.docs=d.docs||{}; d.docMeta=d.docMeta||{}; d.conv=d.conv||[]; d.log=d.log||[];
    d.log.forEach(l=>{if(l.at===undefined)l.at=null;});
    if(d.amountUsdt===undefined) d.amountUsdt=null;
    if(d.selfRate===undefined) d.selfRate=false;
    if(d.agents===undefined) d.agents=[];
    if(d.compare===undefined) d.compare=false;      // старый флаг, остался для совместимости
    if(d.compareWith!==undefined) delete d.compareWith;   // сравнение вариантов убрано
    if(d.stepNotes===undefined) d.stepNotes={};           // комментарий по каждому шагу
    if(d.docFields===undefined) d.docFields=null;   // поля пакета, если правили руками
    if(d.clientId===undefined) d.clientId=null;     // карточка клиента в CRM
    if(d.bank===undefined) d.bank=null;             // банк, если приход или выдача в батах
    if(d.dev===undefined) d.dev=null;               // получатель платежа по недвижимости
    if(d.invNo===undefined) d.invNo=null;           // номер инвойса застройщика
    if(d.realtyPurpose===undefined) d.realtyPurpose=null;  // назначение: проект, юнит, инвойс
    if(d.payTo===undefined) d.payTo=null;           // реквизиты, по которым платим получателю
    if(!Array.isArray(d.quotes)) d.quotes=[];       // ответы контрагентов: кто, какой курс, когда
    if(!d.ratePick||typeof d.ratePick!=='object') d.ratePick={};  // если менеджер взял не лучший
    if(d.sentToClient===undefined) d.sentToClient=false;  // чек отправлен клиенту
    if(d.sentAt===undefined) d.sentAt=null;
    if(d.sentThb===undefined) d.sentThb=null;       // сколько ушло в MF Corp батами

function freeholdApprox(d){

function approx(d){
  if(d.type==='Обмен валюты'){
    const p=exchangeSpec(d);
    return {pay:d[amountField(p.input)],thb:d[amountField(p.output)],cur:p.input,
      sign:SIGN[p.input],thbSign:SIGN[p.output],approx:null,rub:d.amountRub};
  }
  if(d.type==='Оплата недвижимости'&&d.kind==='Фрихолд') return freeholdApprox(d);
  const cur=payCur(d), usdt=cur==='usdt';
  const k=usdt?avgUsdt():avgRate();
  const own=usdt?d.amountUsdt:d.amountRub;
  const r={thb:d.amountThb,pay:own,cur:cur,sign:SIGN[cur],approx:null};
  if(d.amountThb&&!own){
    r.pay=usdt?Math.round(d.amountThb/k*100)/100:Math.round(d.amountThb*k);r.approx='pay';}
  if(own&&!d.amountThb){
    r.thb=usdt?Math.round(own*k):Math.round(own/k);r.approx='thb';}
  r.rub=usdt?null:r.pay;   // совместимость со старыми местами
  return r;
}
/* Курса дня на экранах больше нет (Карим, 27.09 — «не понимаю, что это и зачем»): курс
   в сделке появляется только из ответа операциониста. approx() внутри по-прежнему
   досчитывает вторую сумму — по ней спрашивают контрагентов, — но людям до курса
   оценочное «≈» не показываем: его путали с суммой для клиента (аудит 27.09, №25). */
function apMoney(ap,side){
  if(ap.approx===side) return 'посчитаем после курса';
  return side==='thb'?money(ap.thb,ap.thbSign||'฿'):money(ap.pay,ap.sign);
}
/* Единица курса клиенту в подписях — общая для карточки, шагов и Telegram.
   Крипто-фрихолд курса не имеет вовсе (шаги s5/s6 выпадают, спека 28.09) — юнит пустой. */
function rateUnit(d){
  if(d.type==='Обмен валюты')return exchangeSpec(d).unit;
  if(d.kind==='Фрихолд') return isCrypto(d)?'':'₽/$';
  return isCrypto(d)?'฿/USDT':'₽/฿';
}
/* Экономика сделки — те же формулы, что в CalcCRM (docs/specs/mf-corp-leasehold,
   mf-freehold). Лизхолд: баты покупаем по курсу партнёра, в компанию уходит инвойс
   плюс её процент, и этот процент — наш же доход, просто в другом кармане.
   Валовая прибыль = остаток в крипте + комиссия компании. Фрихолд: карман один,
   комиссия банка — настоящий расход. */
function num(v){return v==null||v===''?null:parseFloat(String(v).replace(',','.'));}
/* Разбор суммы с разделителями тысяч — Number(v.replace(',','.')) ломает "4,500,000"
   (даёт 4.5): запятая/точка может быть и разделителем тысяч, и десятичным. Правило:
   разделитель, встретившийся больше одного раза, — точно тысячи (десятичный бывает
   только один раз). Если встретился один раз — десятичный только если после него
   ровно 2 цифры ("4500000,50"), иначе тоже тысячи ("4.500" → 4500, не 4.5). Если есть
   оба разделителя — десятичный тот, что встретился последним ("1.234,56"). Пробелы
   (и неразрывные) — только разделитель тысяч, десятичных с пробелом не бывает.
   Возвращает null, если строка не похожа на число, или число ≤ 0. */
function parseFlexibleAmount(raw){
  let s=String(raw==null?'':raw).trim();
  if(!s) return null;
  s=s.replace(/[\s ]/g,'');
  if(!/^[0-9.,]+$/.test(s)) return null;
  const commaCount=(s.match(/,/g)||[]).length;
  const dotCount=(s.match(/\./g)||[]).length;
  let decimalSep=null;
  if(commaCount&&dotCount){
    decimalSep=s.lastIndexOf(',')>s.lastIndexOf('.')?',':'.';
  }else if(commaCount===1||dotCount===1){
    const sep=commaCount===1?',':'.';
    if(s.length-s.lastIndexOf(sep)-1===2) decimalSep=sep;
  }
  let intPart=s, fracPart='';
  if(decimalSep){
    const idx=s.lastIndexOf(decimalSep);
    intPart=s.slice(0,idx);fracPart=s.slice(idx+1);
  }
  intPart=intPart.replace(/[.,]/g,'');
  if(!intPart||!/^\d+$/.test(intPart)) return null;
  if(fracPart&&!/^\d+$/.test(fracPart)) return null;
  const v=Number(intPart+(fracPart?'.'+fracPart:''));
  return Number.isFinite(v)&&v>0?v:null;
}
/* Курс TT Buying выбранного банка застройщика — та же логика, что в квизе

   минимум трёх (в $ выходит больше — ориентир не занижен). Любой из трёх банков

    .then(async r=>{

        r=await fetch('/api/stand/thb-bank-rates',{credentials:'same-origin',cache:'no-store'});

      if(S.draft&&S.draft.cur==='fhusd'&&S.draft.invoiceCurrency==='thb')recomputeDraftFhEstimate();

      if(force)toast('Не удалось обновить курс — попробуйте через минуту');})

function crmWalletNet(w){
  const bc=String((w||{}).blockchain||'TRON').toUpperCase();
  return (bc==='ETH'||bc.startsWith('ERC'))?'ERC-20':'TRC-20';
}
function crmWalletById(id){return CRM_WALLETS.find(w=>String(w.id)===String(id))||null;}
/* Склеиваем только варианты выбора; старые id в сделках и снимках остаются. */
function uniqueWallets(list,selected){
  const out=[], seen=new Map();
  for(const w of list){
    const addr=String(w.addr||w.address||'').trim(), key=addr.startsWith('0x')?addr.toLowerCase():addr;
    if(!key)continue;
    if(!seen.has(key)){seen.set(key,out.length);out.push(w);}
    else if(String(w.id)===String(selected))out[seen.get(key)]=w;
  }
  return out;
}
function walletOptionText(w){
  return htmlText(w.addr||w.address)+' · '+((w.addr||w.address||'').startsWith('0x')?'ERC-20':'TRC-20')+
    ' · '+htmlText(w.owner||'владелец не указан')+((w.multisig||w.is_multisig)?' · мультисиг':' · личный');
}
function crmPayinChoices(net,selected){return uniqueWallets(CRM_WALLETS.filter(w=>w.accepts_payin&&crmWalletNet(w)===net&&
  (!w.not_for_new_deals||String(w.id)===String(selected))),selected);}

function walletPurpose(d){return d?.type==='Обмен валюты'?'exchange':d?.type==='Оплата недвижимости'?'realty':null;}
function payinDefaultWallet(net,d){
  const choices=crmPayinChoices(net);

function payinWallet(d){
  if(d.walletId==='custom'){const c=d.payinCustom||{};
    return {id:'custom',name:'Указанный кошелёк',owner:c.owner||'владелец уточняется',
      addr:c.addr||'',net:c.network||'',multisig:!!c.multisig};}
  const legacyAddr=LEGACY_PAYIN_ADDR[d.walletId];
  if(legacyAddr){
    const net=d.walletId==='teodor-erc'?'ERC-20':'TRC-20';
    const found=CRM_WALLETS.find(w=>crmWalletNet(w)===net&&String(w.address).toLowerCase()===legacyAddr.toLowerCase());
    if(found)return payinWalletView(found);
    return {id:d.walletId,name:legacyAddr,owner:'—',addr:legacyAddr,net,
      multisig:(d.walletId==='grusha'||d.walletId==='vitaly')};
  }
  if(d.walletId){
    const w=crmWalletById(d.walletId);
    if(w)return payinWalletView(w);
  }
  return payinDefaultWallet('TRC-20',d)||{id:null,name:'—',owner:'—',addr:'',net:'TRC-20',multisig:false};
}
function payinNet(d){return (payinWallet(d)||{}).net||'TRC-20';}

function payinWalletSet(id,wid){

   (деньги пришли), показываем только выбранный. */
function walletCards(d,cur,fn,disabled,name,choices){

    String(w.id)===String(cur?.id)),cur?.id);

    (choices&&w.addr===cur.addr))):source;

  if(cur&&!list.some(w=>String(w.id)===String(cur.id)))list=list.concat([cur]);
  return `<div class="wallet-picker-row"><select class="fc" aria-label="Кошелёк" name="${name}" ${disabled?'disabled':''}
      onchange="${fn}(${d.id},this.value)">
    ${!cur?`<option value="">— выберите кошелёк —</option>`:''}
    ${list.map(w=>`<option value="${htmlText(w.id)}"${cur&&String(cur.id)===String(w.id)?' selected':''}>
      ${htmlText(w.addr)}</option>`).join('')}
  </select>${cur?`<button type="button" class="btn btn-outline btn-sm" onclick="copyAsk(${htmlText(JSON.stringify(cur.addr))})">Копировать адрес</button>`:''}</div>

/* Кошелёк сделки — из её пачки конвертации (выбран при отправке рублей брокеру),
   либо walletId самой сделки. У крипты пачки нет: USDT клиента приходят прямо на
   walletId, выбранный на s11 (payinWalletSet/payinCustomSet), и с него же потом
   уходят на s23 — «Указать кошелёк…» без «Запомнить» держит owner/multisig в
   payinCustom, а не в реестре, поэтому резолвим его тут же, как payinWallet(d). */
function dealWallet(d){
  if(d&&d.prepay&&!d._prepayBroker)return d.prepay.wallet;
  const c=convOf(d);
  const wid=(c&&c.walletId)||(d&&d.walletId);
  if(wid==='custom'){
    const cc=(d&&d.payinCustom)||{};
    return {id:'custom',name:'Указанный кошелёк',owner:cc.owner||'владелец уточняется',
      addr:cc.addr||'',net:cc.network||'',multisig:!!cc.multisig,role:cc.multisig?'findir':'teodor'};
  }
  return walletById(wid)||null;
}

function policyInitiators(w){return (w?.initiator_roles||[]).concat(w?.owner_can_alone?['teodor']:[]);}

function walletSigner(w){return (!w||!w.owner||w.owner==='компания')?'фин дир':w.owner;}
function cnvWalletSet(id,wid){

/* Что делают с пришедшими USDT. Вариантов четыре, и от выбора зависит, какая задача
   родится дальше: у Coins своя, у IPPS своя, «оставить» не рождает ничего. */
const POST_CONV=[
  {k:'coins', t:'Конвертация USDT для отправки батов через партнёров (Coins)', n:'ставим задачу партнёру: сколько USDT конвертировать, куда выдать баты'},
  {k:'ipps',  t:'Платим батами с баланса IPPS',  n:'получателю уходят баты с корпоративного кошелька IPPS — сумма конвертации уже известна, с криптокошелька по умолчанию ничего не отправляем'},
  {k:'keep',  t:'Оставить на кошельке',         n:'выдача была или будет из другого источника — кассы, SCB, кошелька фаундера'},
  {k:'refund',t:'Вернуть фаундеру',             n:'баты уже выдал фаундер своими — этот приход гасит долг перед ним'},
  {k:'client',t:'Отправить клиенту на кошелёк', n:'обмен: клиент получает USDT — отправляем на его адрес'}
];
/* Одна пачка — несколько сделок, и задачи по ним разные: лизхолд уходит в Coins,
   обмен возвращается клиенту на кошелёк, по третьей отправлять нечего — выдача идёт
   с баланса. Поэтому назначение выбирают по каждой сделке, а не одно на всю сумму. */
function cnvMembers(d){
  if(d.prepay)return [d];
  const c=convOf(d);
  const l=c?(c.sources||[]).map(x=>deal(x.dealId)).filter(Boolean):[];
  return l.some(x=>x.prepay)?[d]:(l.length?l:[d]);
}
/* Что по пачке ушло в Coins: сделка, баты, курс, отправленные USDT и хеши.
   sends — все зарегистрированные переводы с их статусом (не только подтверждённые):
   на s25 нужно видеть неподтверждённые тоже, отдельно от подтверждённых, иначе
   операционист извещает Coins не про все переводы (Карим, 25.09). */
function coinsSends(d){
  return cnvMembers(d).filter(x=>x.postConv==='coins').map(x=>{
    const tr=x.transfer||{}, all=sendList(x).filter(t=>t.hash||t.ref), l=all.filter(t=>t.status==='confirmed');
    return {id:x.id, code:x.code, client:x.client, thb:num(cleanNum(String(tr.thb||'')))||approx(x).thb||0, rate:tr.rate,
      usdt:sendSum(x), hashes:l.map(t=>t.hash||t.ref).filter(Boolean), sends:all};});
}
function cnvShareOf(d,x){
  const c=convOf(d);
  if(!c) return (x.pay&&x.pay.usdt)||null;
  const s=(c.sources||[]).find(y=>y.dealId===x.id);
  return s?(s.usdtFact!=null?s.usdtFact:s.usdt):null;
}
/* Уходит ли с кошелька перевод. У IPPS — только если решили вернуть USDT на тот
   кошелёк, с которого пополняют баланс: сама оплата батами перевода не требует. */
function pcSends(x){
  const k=(x&&typeof x==='object')?x.postConv:x;
  if(!k||k==='keep') return false;
  if(k==='ipps') return !!(x&&typeof x==='object'&&x.transfer&&x.transfer.back);
  /* Автовозмещение, как в CRM: брокер прислал USDT прямо на кошелёк фаундера,
     который выдавал баты, — двигать деньги не нужно, долг закрыт приходом. */
  if(k==='refund'&&x&&typeof x==='object'){
    const c=convOf(x), tr=x.transfer||{};
    if(c&&c.walletId&&tr.walletId&&c.walletId===tr.walletId) return false;
  }
  return true;
}
/* Возврат внутрь компании — на наш же кошелёк, поэтому его выбирают из списка */
function pcInside(k){return k==='ipps'||k==='refund';}
function transferWallet(id,wid){
  const x=deal(id); x.transfer=Object.assign({},x.transfer||{});
  const w=walletById(wid);

function pcAmount(x){return num(cleanNum(String((x.transfer||{}).amount||'')));}
/* Мелкая сделка пачки закрывается, только когда по ней больше нечего отправлять
   (Карим, 24.09). Без перевода с кошелька — IPPS без возврата, «оставить на кошельке» —
   сразу после решения по USDT. С переводом — Coins, клиенту, фаундеру, IPPS с возвратом —
   когда перевод ушёл в сеть. Раньше все мелкие закрывались при получении USDT, и по
   выдаче с IPPS или из кассы никто не получал задачи. */
/* Задачи — это путь, которым заполняется карточка сделки из CRM (Карим, 24.09).
   Решение по USDT и уход перевода в сеть — это Pay-Out: источник, баты, USDT,
   хеши выдачи. Возмещение — только когда баты выдал фаундер своими; если платили
   деньгами, которые пришли к нам, это просто наш расход, долга нет.
   Раньше пачка Pay-Out не писала вовсе: у сделок была пустая выдача, и прибыль
   не считалась (прогон 24.09). */
function payoutRecord(x,phase,main){
  const tr=x.transfer||{}, k=x.postConv, thb=num(cleanNum(String(tr.thb||'')))||approx(x).thb||0;
  const po=Object.assign({},x.payout||{});
  const w=dealWallet(x);
  if(phase==='decided'){
    if(k==='coins'){x.paySrc='coins';Object.assign(po,{method:'Coins — выдача батов',source:SOURCES_PAY.coins.t,
      thb:thb,rate:tr.rate||null,wallet:(w&&w.addr)||''});}
    if(k==='client'){x.paySrc='client';Object.assign(po,{method:'USDT клиенту на кошелёк',source:SOURCES_PAY.client.t,
      thb:null,usdt:pcAmount(x)||null,wallet:(w&&w.addr)||''});}
    if((k==='ipps'||k==='keep')&&!main){
      /* Выдача не с кошелька: баты ушли с баланса — списываем, иначе балансы
         на стенде врут (Поляковой выдали 91 538 ฿ с IPPS, баланс не изменился). */
      const src=k==='ipps'?'ipps':(tr.src||'cash');
      x.paySrc=src;
      Object.assign(po,{method:k==='ipps'?'баты с баланса IPPS':'выдача не с кошелька',source:SOURCES_PAY[src].t,thb:thb});
      const t=balTake(src,thb,null);
      log(x,t===false?'На балансе «'+SOURCES_PAY[src].t+'» не хватает '+money(thb,'฿')+' — выдачу надо закрыть другим источником'
        :'Списано с «'+SOURCES_PAY[src].t+'»: '+money(thb,'฿'));
    }
    if(k==='refund'){
      const fw=walletById(tr.walletId);
      x.paySrc='founder';
      Object.assign(po,{method:'баты выдал фаундер своими',source:SOURCES_PAY.founder.t,founder:fw?fw.owner:(tr.to||''),
        ownBaht:true,thb:thb,usdt:pcAmount(x)||null,wallet:tr.addr||''});
      if(!pcSends(x)) po.reimbursement={id:'R-'+x.id,kind:'автовозмещение — USDT пришли на кошелёк фаундера',hash:null,at:now()};
    }
    /* Фрихолд: единственный маршрут — IPPS SWIFT в USD, застройщик получает X,
       на кошельке уходит S (спека 28.09, §2 «s22»). */
    if(k==='ipps_swift'){x.paySrc='ipps_swift';Object.assign(po,{method:'IPPS · SWIFT в USD',
      source:'IPPS (SWIFT)',usdt:pcAmount(x)||null,wallet:IPPS_WALLET});}
  }else{
    const l=sendList(x).filter(t=>t.status==='confirmed'&&(t.hash||t.ref));
    const hashes=l.map(t=>({amount:t.verifiedAmount,network:pcNet(x).replace('-',''),hash:t.hash||t.ref}));
    if(k==='coins'||k==='client'||k==='ipps_swift'){
      po.hashes=hashes; po.hash=(hashes[0]||{}).hash||null; po.usdt=sendSum(x)||po.usdt||null;
      /* у недвижимости перевод в Coins/IPPS — это «Переводы в MF Corp (факт)» / переводы застройщику */
      if(x.type==='Оплата недвижимости')
        x.mfPayout=hashes.map(h=>({hash:h.hash,net:pcNet(x),amount:h.amount}));
    }
    if(k==='refund') po.reimbursement={id:'R-'+x.id,kind:'перевод фаундеру',
      hash:hashes.map(h=>h.hash).join(', '),usdt:sendSum(x),at:now()};
  }
  x.payout=po;
}
/* Мелкая сделка пачки закрывается, как в CRM, когда клиент получил деньги:
   выдача с баланса, из кассы или фаундером своими — сразу после решения по USDT
   (долг фаундеру живёт отдельно, во «Возмещениях»); Coins и перевод клиенту — когда
   перевод ушёл в сеть. */
function packSettle(d,phase){
  cnvMembers(d).forEach(x=>{
    if(x.closed&&x.id!==d.id&&!(phase==='sent'&&x.postConv==='refund')) return;
    payoutRecord(x,phase,x.id===d.id);
    if(x.id===d.id||x.closed) return;
    if(x.postConv==='refund')return; /* Возмещение и закрытие записывает сервер после проверки. */
    const o=POST_CONV.find(p=>p.k===x.postConv), what=o?o.t:(x.postConv||'—');
    const now1=(phase==='decided')&&!pcSends(x);
    if(phase==='sent'&&!sendDone(x))return;
    if(phase==='decided'&&!now1){log(x,'Ждёт перевода с кошелька — закроется, когда он уйдёт в сеть');return;}
    x.step='done';x.closed=true;x.closeReason='Успешно завершена';x.closedAt=now();
    log(x,phase==='sent'?'Закрыта: перевод ушёл в сеть — '+what
      :(x.postConv==='refund'?'Закрыта: баты клиенту выдал фаундер — возмещение '+(pcSends(x)?'ждёт перевода':'закрыто автоматически')
      :'Закрыта: перевода с кошелька нет — '+what));
  });
}
function pcOut(d){return Math.round(cnvMembers(d).reduce((s,x)=>s+(pcSends(x)?(pcAmount(x)||0):0),0)*100)/100;}
const NETS=['TRC-20','ERC-20'];
function pcNet(x){return (x.transfer||{}).net||'TRC-20';}
/* Откуда эта сделка взялась в пачке: B2C-обмены заводят отдельно, они уже
   оплачены клиентом и ждут ближайшей конвертации — их и добирают на шаге 18. */
function pcOrigin(x){
  const paid=x.amountRub?money(x.amountRub,'₽'):(x.amountUsdt?usd(x.amountUsdt):null);
  const bits=[];
  if(x.payType) bits.push(x.payType);
  if(paid) bits.push('клиент заплатил '+paid);
  if(x.readyAt) bits.push('внесена без шагов, ждала конвертации с '+
    new Date(x.readyAt).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit'}));
  else if(x.docVersion) bits.push('прошла задачник, пакет документов есть');
  if(SOURCES[x.source]) bits.push('источник '+SOURCES[x.source]);
  return bits.join(' · ');
}

/* Одна задача может уйти несколькими переводами: отправили часть, потом добили
   остаток. Поэтому храним список отправок, а не одно поле, и закрываем задачу,
   когда сумма отправленного покрывает сумму задачи. */
function sendList(x){return ((x.transfer||{}).sends)||[];}
function sendSum(x){return Math.round(sendList(x).reduce((s,t)=>s+(t.status==='confirmed'?(Number(t.verifiedAmount)||0):0),0)*100)/100;}
function sendDeclared(x){return Math.round(sendList(x).filter(t=>!['failed','mismatch'].includes(t.status)).reduce((s,t)=>s+(Number(t.amount)||0),0)*100)/100;}
function sendLeft(x){return Math.max(0,Math.round(((pcAmount(x)||0)-sendSum(x))*100)/100);}
function sendDone(x){const need=pcAmount(x)||0;return need>0&&sendSum(x)>=need-0.005;}

async function standAction(path,payload){
  if(standBusy||standPush){toast('Дождитесь сохранения и повторите');return null;}
  standBusy=true;
  try{
    const r=await fetch(path,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const j=await r.json();
    if(j.success){if(j.data){standVer=j.version;standBase=standClone(j.data);standApply(j.data);render();}return j;}
    if(j.error==='stand_blocked'){toast('Канал проверки сети недоступен. Перевод остаётся неподтверждённым',2600,'error');return null;}
    if(j.taken_by){toast('Шаг уже взял '+j.taken_by,2600,'error');setTimeout(()=>standPull(true),0);return null;}
    if(j.warning&&j.data){standVer=j.version;standBase=standClone(j.data);standApply(j.data);render();}
    toast(j.detail||j.error||'Не удалось проверить',2600,'error');return j.warning?j:null;
  }catch(e){toast('Проверка недоступна — перевод остаётся неподтверждённым',2600,'error');return null;}
  finally{standBusy=false;if(standPush){standPush=false;setTimeout(standSave,120);}}

const CALC_URL='/';
function calcLink(d){
  const cat=dealKind(d)==='mf_freehold'?'property_freehold'
    :(dealKind(d)==='mf_realty'?'property_leasehold':'exchange');
  const spec=exchangeSpec(d), directPair=spec&&spec.output==='usdt';
  const scenario=directPair?spec.input+'-to-usdt':isCrypto(d)?'usdt-to-thb':'rub-to-thb';
  const dir=directPair?(d.curBase===spec.output?'target':'amount'):(d.curBase==='thb'?'target':'amount');
  const amount=directPair?(d[amountField(dir==='target'?spec.output:spec.input)]||''):(d.curBase==='thb'?(d.amountThb||''):(isCrypto(d)?(d.amountUsdt||''):(d.amountRub||'')));
  const q=new URLSearchParams();
  q.set('deal',d.code); q.set('cat',cat); q.set('method','custom');
  q.set('scenario',scenario); q.set('dir',dir);
  if(amount) q.set('amount',String(amount));
  if(d.rates.rubUsdt) q.set('rub_usdt',String(d.rates.rubUsdt).replace(',','.'));
  if(d.rates.usdtThb) q.set('usdt_thb',String(d.rates.usdtThb).replace(',','.'));
  if(cat==='property_freehold'){
    /* Фрихолд: тариф IPPS, валюта инвойса, ฿ и курс ฿/$ — калькулятор предзаполняется.
       Рублёвый: расчёт идёт от $ к отправке застройщику («хочу получить X USDT»). */
    q.set('tariff',d.ippsTariff||'bank');
    if(!isCrypto(d)){
      q.set('scenario','rub-to-usdt'); q.set('dir','target');
      if(d.invoiceUsd) q.set('amount',String(d.invoiceUsd));
    }
    if(d.invoiceCurrency==='thb'){
      q.set('inv_cur','thb');
      if(d.invoiceThb) q.set('inv_thb',String(d.invoiceThb));
      if(d.fxBank) q.set('fx_bank',d.fxBank);
      if(d.fxRate) q.set('fx_rate',String(d.fxRate));

  return CALC_URL+'?'+q.toString();

async function quoteSet(id,cpId,dir){
  const d=deal(id), c=cpById(cpId); if(!c)return;
  const v=cleanNum(val('q_'+cpId+'_'+dir));
  if(!v){toast('Впишите курс, который назвал контрагент');return;}
  if(STAND&&!SCREEN&&!SNAP){
    /* Ответ сохраняет сервер поверх актуальной сделки: поздний ответ не зависит
       от того, успел ли менеджер нажать «Клиент согласен». При отказе поле остаётся. */
    const old=(d.quotes||[]).find(q=>q.cpId===cpId&&q.dir===dir);
    const result=await standAction('/api/stand/quote',{
      version:standVer,dealId:id,cpId,dir,rate:v,previousAt:old?.at??null});
    if(result){
      delete DRAFTS[(S.open||S.tab||'')+'|q_'+cpId+'_'+dir];
      S.qEdit=null;render();toast('Курс сохранён: '+c.name+' '+v);
    }
    return;
  }
  d.quotes=d.quotes||[];
  const ex=d.quotes.find(q=>q.cpId===cpId&&q.dir===dir);
  /* снимок, а не ссылка: строку ниже правим на месте, и объект «прежнего лучшего»
     менялся бы вместе с ней — сравнение всегда говорило «ничего не изменилось» */
  const wb=quoteBest(d,dir), wasBest=wb?{cpId:wb.cpId,rate:wb.rate}:null;
  if(ex){ex.rate=v;ex.at=Date.now();}
  else d.quotes.push({cpId:cpId,name:c.name,dir:dir,rate:v,at:Date.now()});
  quoteApply(d);
  S.qEdit=null;
  delete DRAFTS[(S.open||S.tab||'')+'|q_'+cpId+'_'+dir];
  const best=quoteBest(d,dir);
  const better=best&&(!wasBest||wasBest.cpId!==best.cpId||wasBest.rate!==best.rate);
  log(d,(ex?'Курс обновлён':'Курс получен')+' — '+c.name+' ('+(quoteDirection(d,dir))+'): '+v+
    (better?' · в сделку ушёл лучший: '+best.rate+' ('+best.name+')':''));
  noteAdd('manager',(ex?'Курс обновлён':'Новый курс')+' · '+c.name+' '+(quoteDirection(d,dir))+' '+v+
    (better?' — теперь он лучший в сделке':' — лучший прежний: '+(best?best.rate+' ('+best.name+')':'—')),d.id);
  /* первый же ответ уводит задачу менеджеру — ждать остальных не нужно.
     Фрихолд без крипты: USDT→THB не спрашиваем вообще (батов нет), поэтому его
     не ждём — иначе шаг никогда не отпускал бы (спека 28.09-freehold-no-baht). */
  const ready=quoteDirs(d).every(dir=>quoteBest(d,dir));
  if(d.step==='s5'&&ready){
