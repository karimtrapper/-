name: UI parity synthetic drift
on:
  pull_request:
  push:
    branches: [stage]
jobs:
  ui-parity-synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.14.3
      - run: python scripts/ui_parity/synthetic_gate.py
      - run: python scripts/ui_parity/synthetic_gate.py --mutation-test
